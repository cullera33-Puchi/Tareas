# Publishes the static app to GitHub Pages on every push to main.
# No build step: the repository root is uploaded as is, plus config.js written from the secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Block 8: config.js for the sync, from the repository secrets (never committed; .gitignore keeps it out).
      # Without the secrets it holds nulls and the app runs local only. JSON.stringify quotes the values safely.
      - name: Write config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            // Accept the project URL in any usual form (full, without https://, with a path, in quotes, or only the ref)
            const clean = v => String(v || "").trim().replace(/^["\x27]|["\x27]$/g, "").trim();
            let url = clean(process.env.SUPABASE_URL);
            let key0 = clean(process.env.SUPABASE_ANON_KEY);
            // Secrets saved the other way round (the key in SUPABASE_URL and the URL in SUPABASE_ANON_KEY) are swapped back
            const looksKey = v => /^(sb_publishable_|eyJ)/.test(v), looksUrl = v => /supabase\.co|^https?:\/\//i.test(v);
            if (looksKey(url) && looksUrl(key0)) { const t = url; url = key0; key0 = t; console.log("Secrets were swapped: fixed"); }
            console.log("SUPABASE_ANON_KEY as stored:", JSON.stringify({ length: key0.length, publishable: key0.startsWith("sb_publishable_"), jwt: key0.startsWith("eyJ"), secret: key0.startsWith("sb_secret_") }));
            console.log("SUPABASE_URL looks like a key:", looksKey(url));
            const shape = { length: url.length, https: /^https:\/\//i.test(url), supabaseCo: /supabase\.co/i.test(url), path: /\.co\/./i.test(url) };
            if (url && !/^https?:\/\//i.test(url)) url = /^[a-z0-9]{15,30}$/i.test(url) ? "https://" + url + ".supabase.co" : "https://" + url;
            try { const x = new URL(url); url = /\./.test(x.hostname) ? x.origin : null; } catch (e) { url = null; }
            const anonKey = key0 && !key0.startsWith("sb_secret_") ? key0 : null; // never ship a secret key
            const cfg = url && anonKey ? { url, anonKey } : { url: null, anonKey: null };
            require("fs").writeFileSync("config.js", "window.TAREAS_CONFIG = " + JSON.stringify(cfg) + ";\n");
            console.log("SUPABASE_URL as stored:", JSON.stringify(shape));
            console.log(url && anonKey ? "config.js written with a valid project URL" : "config.js written without keys: local only (url " + (url ? "ok" : "missing or invalid") + ", key " + (anonKey ? "ok" : "missing") + ")");
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
