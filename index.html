<title>Tareas</title>
<style>
:root{
  color-scheme:light;
  --bg:#F2F2F7; --card:#FFFFFF; --sep:#C6C6C8; --ink:#000000; --ink2:#8E8E93; --ink3:#AEAEB2;
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --fill:#E5E5EA; --fill2:#D1D1D6;
  --bar:rgba(249,249,249,.82); --mat:rgba(255,255,255,.88); --dim:rgba(0,0,0,.35); --press:#D9D9DE;
  --kb:0px; --qhl:rgba(0,122,255,.16); --ghbg:rgba(242,242,247,.86);
  --pmmat:rgba(246,246,248,.8); --pmhl:rgba(0,0,0,.1); --pmgap:rgba(0,0,0,.07); --pmsep:rgba(60,60,67,.24); --pmdim:rgba(0,0,0,.04); --pmdimL:rgba(0,0,0,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --sep:#38383A; --ink:#FFFFFF; --ink2:#8E8E93; --ink3:#636366;
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --fill:#2C2C2E; --fill2:#3A3A3C;
  --bar:rgba(22,22,24,.82); --mat:rgba(36,36,38,.9); --dim:rgba(0,0,0,.55); --press:#2C2C2E; --qhl:rgba(10,132,255,.34); --ghbg:rgba(0,0,0,.78);
  --pmmat:rgba(44,44,46,.76); --pmhl:rgba(255,255,255,.13); --pmgap:rgba(0,0,0,.42); --pmsep:rgba(84,84,88,.55); --pmdim:rgba(0,0,0,.18); --pmdimL:rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --sep:#38383A; --ink:#FFFFFF; --ink2:#8E8E93; --ink3:#636366;
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --fill:#2C2C2E; --fill2:#3A3A3C;
  --bar:rgba(22,22,24,.82); --mat:rgba(36,36,38,.9); --dim:rgba(0,0,0,.55); --press:#2C2C2E; --qhl:rgba(10,132,255,.34); --ghbg:rgba(0,0,0,.78);
  --pmmat:rgba(44,44,46,.76); --pmhl:rgba(255,255,255,.13); --pmgap:rgba(0,0,0,.42); --pmsep:rgba(84,84,88,.55); --pmdim:rgba(0,0,0,.18); --pmdimL:rgba(0,0,0,.4);
}
/* R11 and R17: macOS materials of the desktop layout (content, translucent sidebar, hairlines, menus) */
:root{ --dmain:#FFFFFF; --dside:rgba(232,232,236,.8); --dgroup:#F5F5F7; --dline:rgba(0,0,0,.1); --dhov:rgba(0,0,0,.045); --dsel:rgba(0,0,0,.085); --dfield:rgba(0,0,0,.055); --dgh:rgba(255,255,255,.92);
  --mmat:rgba(246,246,246,.88); --msep:rgba(0,0,0,.1); --mshadow:0 10px 32px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.22); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --dmain:#1E1E1E; --dside:rgba(48,48,50,.8); --dgroup:#28282A; --dline:rgba(255,255,255,.1); --dhov:rgba(255,255,255,.055); --dsel:rgba(255,255,255,.11); --dfield:rgba(255,255,255,.08); --dgh:rgba(30,30,30,.92);
  --mmat:rgba(42,42,44,.9); --msep:rgba(255,255,255,.12); --mshadow:0 10px 32px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.16); }}
:root[data-theme="dark"]{ --dmain:#1E1E1E; --dside:rgba(48,48,50,.8); --dgroup:#28282A; --dline:rgba(255,255,255,.1); --dhov:rgba(255,255,255,.055); --dsel:rgba(255,255,255,.11); --dfield:rgba(255,255,255,.08); --dgh:rgba(30,30,30,.92);
  --mmat:rgba(42,42,44,.9); --msep:rgba(255,255,255,.12); --mshadow:0 10px 32px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.16); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:17px;}
html{font:-apple-system-body;} /* iOS: follow the system text size; other browsers ignore it */
html,body{margin:0;overscroll-behavior:none;}
body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1rem;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;}
input,textarea,select{font-size:max(16px,1rem);} /* under 16px Safari zooms on focus */

/* Desktop (wide screens): sidebar, main column, detail pane. Mobile code paths stay untouched. */
.desk{display:none;}
.app.desktop .screen,.app.desktop .tabbar,.app.desktop .selbar{display:none !important;}
.app.desktop{overflow:hidden;}
.app.desktop .desk{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;background:var(--bg);} /* one row, capped at the window height, so each column scrolls on its own */
.app.desktop.has-pane .desk{grid-template-columns:240px minmax(0,1fr) 400px;}
.side{background:var(--card);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:14px 10px calc(10px + env(safe-area-inset-bottom,0px));overflow-y:auto;}
.side .sp{display:flex;align-items:center;gap:6px;font-size:1.176rem;font-weight:700;padding:6px 10px 14px;letter-spacing:-.3px;width:100%;text-align:left;}
.side .sp svg{width:12px;height:12px;color:var(--ink3);}
.side .sec{font-size:0.706rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;padding:14px 10px 6px;}
.side .it{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:0.941rem;text-align:left;color:var(--ink);}
.side .it:hover{background:var(--fill);}
.side .it.on{background:var(--blue);color:#fff;}
.side .it svg{width:18px;height:18px;flex:none;}
.side .it>span:not(.n):not(.dot){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side .it .dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px;}
.side .it .n{margin-left:auto;font-size:0.765rem;color:var(--ink2);}
.side .it.on .n{color:rgba(255,255,255,.85);}
.side .grow{flex:1;}
.side .it.add{color:var(--blue);}
.main{display:flex;flex-direction:column;min-width:0;height:100%;}
.main .mhead{display:flex;align-items:center;gap:14px;padding:16px 28px 8px;}
.main .mhead h1{margin:0;font-size:1.647rem;font-weight:700;letter-spacing:-.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.main .mhead .searchbar{margin:0;width:260px;}
.main .mhead .mopts{flex:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--blue);background:var(--card);border:.5px solid var(--sep);} /* R13 */
.main .mhead .mopts svg{width:18px;height:18px;}
.main .mbody{flex:1;overflow-y:auto;padding:0 28px 40px;}
.main .mbody .scroll{padding:0;overflow:visible;flex:none;}
.main .inner{max-width:760px;}
.main .inner.week-inner{max-width:none;}
.addbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:0 14px;height:46px;margin:6px 0 14px;border:.5px solid var(--sep);}
.addbar svg{width:18px;height:18px;color:var(--blue);flex:none;}
.addbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:max(16px,1rem);color:var(--ink);}
.addbar input::placeholder{color:var(--ink2);}
.addbar .kbd{font-size:0.706rem;color:var(--ink3);border:.5px solid var(--sep);border-radius:5px;padding:1px 6px;}
.pane{background:var(--card);border-left:.5px solid var(--sep);height:100%;overflow:hidden;display:flex;flex-direction:column;}
.app.desktop .pane .screen{position:relative;display:flex !important;transform:none;background:var(--card);height:100%;will-change:auto;}
.pane .nav{background:var(--card);}
.pane .nav .back span{display:none;}
.pane .group{background:var(--bg);}
.pane .scroll{padding-bottom:40px;}
.desktop .row-content:hover{background:var(--press);cursor:default;}
.desktop .rowmore{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);opacity:0;transition:opacity .15s;}
.desktop .row:hover .rowmore{opacity:1;}
.desktop .rowmore svg{width:18px;height:18px;}
.desktop .fab{display:none;}
.desktop .check,.desktop .cell,.desktop .chip,.desktop button{cursor:pointer;}
.desktop .row-title{-webkit-line-clamp:1;}
/* Closed sheets sit invisible at the centre: hidden and without hit area, so they never take clicks */
body.desktop .sheet{left:50%;right:auto;bottom:auto;top:50%;width:440px;max-height:80%;border-radius:16px;transform:translate(-50%,-50%) scale(.96);opacity:0;visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .22s,visibility 0s linear .28s;padding:10px 20px 20px;}
body.desktop .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s;}
body.desktop .sheet .handle{display:none;}
body.desktop .asheet{left:50%;right:auto;bottom:auto;top:50%;width:320px;transform:translate(-50%,-50%) scale(.96);opacity:0;visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .22s,visibility 0s linear .28s;}
body.desktop .asheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s;}
body.desktop .asheet button.it{height:46px;font-size:1rem;}
body.desktop .app.sheet-open{transform:none;border-radius:0;}
body.desktop .toast{left:auto;right:28px;bottom:28px;width:360px;}

/* Screens */
.app{height:100%;position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),border-radius .5s cubic-bezier(.32,.72,0,1);} /* iOS timing: screens and sheets take half a second */
.app.sheet-open{transform:scale(.96);border-radius:14px;}
@media (prefers-reduced-motion: reduce){.app{transition:none;}.app.sheet-open{transform:none;}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(0,0,0);will-change:transform;}
.screen.pushed{transform:translate3d(100%,0,0);transition:transform .5s cubic-bezier(.32,.72,0,1);}
.screen.shown{transform:translate3d(0,0,0);transition:transform .5s cubic-bezier(.32,.72,0,1);}
.screen.under{transform:translate3d(-33%,0,0);transition:transform .5s cubic-bezier(.32,.72,0,1);}
.screen.dragging,.screen.dragging-under{transition:none;}
.screen.hidden-tab{display:none;}
.screen.root{touch-action:pan-y;}
.screen.pushed-screen{z-index:8;}
.screen.pushed-screen.pushed{pointer-events:none;} /* a screen sliding in or out (already popped) takes no taps */
.app.navigating .screen{pointer-events:none;} /* during a push or pop transition a second tap acts on nothing */
.screen.tabanim{transition:transform .4s cubic-bezier(.32,.72,0,1);}
/* Reduce Motion: a pushed screen fades in and out where it stands; the screen below stays still */
@media (prefers-reduced-motion: reduce){.screen.pushed{transform:none;opacity:0;transition:opacity .2s;}.screen.shown{transform:none;opacity:1;transition:opacity .2s;}.screen.under{transform:none;transition:none;}.screen.tabanim{transition:none;}}

.nav{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));} /* side safe areas: landscape on a notched iPhone */
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.nav-title{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:1rem;pointer-events:none;}
.nav.compact{box-shadow:0 .5px 0 var(--sep);}
.nav .title{display:flex;align-items:center;gap:6px;font-size:1.294rem;font-weight:700;letter-spacing:-.3px;height:44px;}
.nav .title svg{width:12px;height:12px;color:var(--ink3);}
.nav .title .pdot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:2px;}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:1rem;height:44px;}
.nav .back svg{width:12px;height:20px;}
.nav .action{color:var(--blue);font-size:1rem;height:44px;display:flex;align-items:center;}
.nav .action.strong{font-weight:600;}
.nav .actions{display:flex;gap:4px;margin-right:-8px;}
.nav .actions .action{width:40px;justify-content:center;}
.nav .actions svg{width:22px;height:22px;}
.nav .vopts{width:44px;justify-content:flex-end;flex:none;} /* R13: view options, on the right of the bar */
.nav .vopts svg{width:22px;height:22px;}
.cell.input{display:block;}
.cell .val.high{color:var(--red);}
.cell .val.mid{color:var(--orange);}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));}

/* Day summary */
.summary{background:var(--card);border-radius:12px;padding:12px 16px 12px;margin:8px 0 12px;}
.summary-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.summary-head h3{margin:0;font-size:0.882rem;font-weight:600;color:var(--ink2);}
.summary-head button{color:var(--ink3);width:44px;height:44px;margin:-8px -12px -8px 0;display:flex;align-items:center;justify-content:center;} /* 44 pt to the finger (R2), drawn as before: the negative margin keeps the head's height */
.summary-head svg{width:14px;height:14px;transition:transform .25s;}
.summary.collapsed .summary-head svg{transform:rotate(-90deg);}
.summary.collapsed .summary-body{display:none;}
.summary.collapsed{padding-bottom:12px;}
.summary.collapsed .summary-head{margin-bottom:0;}
.nums{display:flex;gap:8px;}
.first{margin-top:10px;}
.num{flex:1;border-radius:10px;padding:6px 4px;text-align:center;}
.num b{display:block;font-size:1.647rem;font-weight:700;line-height:1.1;letter-spacing:-.6px;}
.num span{font-size:0.706rem;color:var(--ink2);}
.num.red b{color:var(--red);}
.num.on{background:var(--fill);}
.num:active{opacity:.7;}
.num.orange b{color:var(--orange);}
.first h4{margin:6px 0 2px;font-size:0.765rem;color:var(--ink2);font-weight:500;}
.first .row{margin:0;}
.first .row-content{padding-left:0;}
.first .empty-line{color:var(--ink3);font-size:0.882rem;padding:8px 0 10px;}
.first .soon{display:flex;align-items:center;gap:8px;font-size:0.824rem;color:var(--ink2);padding:8px 0 6px;border-top:.5px solid var(--sep);}
.first .soon svg{width:15px;height:15px;color:var(--orange);}

/* Search and segment */
.searchbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px;}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--ink2);}
.search svg{width:16px;height:16px;flex:none;}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;height:36px;color:var(--ink);}
.search input::placeholder{color:var(--ink2);}
.searchbar .cancel{color:var(--blue);font-size:1rem;flex:none;}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px;}
.seg button{flex:1;height:28px;border-radius:7px;font-size:0.765rem;font-weight:500;color:var(--ink);}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;}
.seg button .n{font-weight:400;color:var(--ink2);margin-left:5px;font-size:.765rem;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366;}}
:root[data-theme="dark"] .seg button.on{background:#636366;}

/* Lists */
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.group-title{font-size:0.765rem;color:var(--ink2);padding:0 4px 6px;margin-top:4px;}
/* Group headers with a count, and a link or a + on the right (R8, R9, R13, R14) */
.group-title.gh{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 4px 4px;}
.gh .gl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gh .gn{color:var(--ink3);font-variant-numeric:tabular-nums;}
.gh .gdot{flex:none;width:8px;height:8px;border-radius:50%;}
.gh .gx{flex:none;position:relative;color:var(--blue);font-weight:600;font-size:0.765rem;height:30px;}
.gh .gadd{flex:none;position:relative;width:30px;height:30px;margin-right:-6px;display:flex;align-items:center;justify-content:center;color:var(--blue);}
.gh .gadd svg{width:18px;height:18px;}
.gh .gx::after,.gh .gadd::after{content:"";position:absolute;left:-7px;right:-7px;top:-7px;bottom:-7px;} /* 44 pt to the finger */
.group-title.gtap{cursor:pointer;}
.group-title.gtap:active .gl{opacity:.6;}
.gtap .gchev{flex:none;width:7px;height:12px;color:var(--ink3);}
/* R14: in a .gsec the header stays at the top of the list while its rows scroll under it, and the next header pushes it away */
.gsec{display:flow-root;} /* the group's bottom margin stays inside: the header is pushed away only by the next one */
.gsec > .group-title{position:sticky;top:0;z-index:3;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 2px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px calc(4px + max(16px,env(safe-area-inset-right,0px))) 4px calc(4px + max(16px,env(safe-area-inset-left,0px)));background:var(--ghbg);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);}
.app.desktop .gsec > .group-title{margin-left:-12px;margin-right:-12px;padding-left:16px;padding-right:16px;}
.row{position:relative;overflow:hidden;background:var(--card);}
.row.cv{content-visibility:auto;contain-intrinsic-size:auto 62px;} /* far below the visible part when drawn: see lazyRows */
.rph{height:62px;} /* a row of a long list not drawn yet: see lazyRows */
.row + .row .row-content::before{content:"";position:absolute;left:50px;right:0;top:0;height:.5px;background:var(--sep);}
.first .row + .row .row-content::before{left:34px;}
.row-bg{position:absolute;inset:0;display:none;align-items:stretch;}
.row.swiping.dir-r .row-bg.left{display:flex;}
.row.swiping.dir-l .row-bg.right{display:flex;}
.row-bg.left{justify-content:flex-start;background:var(--green);}
.row-bg.right{justify-content:flex-end;background:var(--red);}
.row-bg.left span{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;color:#fff;transform:translate3d(10px,0,0) scale(.6);will-change:transform;}
.row-bg.left svg{width:24px;height:24px;}
.row.armed .row-bg.left{background:#2DBE54;}
.row.armed .row-bg.left svg{animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row.armed .row-bg.left{background:#28C250;}}
:root[data-theme="dark"] .row.armed .row-bg.left{background:#28C250;}
.row-bg.right button{width:80px;color:#fff;font-size:0.882rem;font-weight:500;}
.row-bg.right .b-tomorrow{background:var(--orange);}
.row-bg.right .b-delete{background:var(--red);}
.row-content{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 16px;min-height:52px;transition:transform .4s cubic-bezier(.32,.72,0,1);}
.row-content.drag{transition:none;}
.row.leaving .row-content{opacity:0;transform:translate3d(28px,0,0);transition:opacity .22s,transform .22s;}
.row.leaving{pointer-events:none;} /* a second tap during the exit must not reopen the task or open its detail */
.flip{transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .4s;}
.enter{opacity:0;}
.row-content:active{background:var(--press);}
.first .row-content{padding:8px 0;min-height:44px;}
.check{flex:none;position:relative;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s;}
/* R2: the circle is drawn at 22 pt but takes the finger over 44 by 44 pt (Apple's minimum); a tap there completes instead of opening the detail */
.check::after,.selbox::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;}
.wcard .check::after{display:none;} /* desktop week cards: mouse only, and the area would cover the title */
.first .row{overflow:visible;} /* "Lo primero" rows have no swipe background to clip, and their circle's area reaches into the card's padding */
/* R1: a row just marked stays where it is, dimmed, until the marks settle (flushHeld) */
.row.held .row-text,.row.held .inds,.row.held .pri{opacity:.4;transition:opacity .2s;}
.check:active{transform:scale(.88);}
.check.done{background:var(--pc,var(--blue));border-color:var(--pc,var(--blue));}
.check.done.just{animation:pop .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.check svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .28s cubic-bezier(.34,1.56,.64,1);}
.check.done svg{opacity:1;transform:scale(1);}
.row-text{flex:1;min-width:0;}
.row-title{font-size:1rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.row.done .row-title{color:var(--ink2);text-decoration:line-through;}
.row.done.byday .row-title{text-decoration:none;} /* R3: the Completadas day groups already say they are done */
.row-meta{display:block;font-size:0.765rem;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px;position:relative;top:-1px;}
.row-meta .sep{color:var(--ink3);margin:0 6px;}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:0.706rem;font-weight:500;color:var(--tagl,var(--pc));background:var(--tagbg);vertical-align:1px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* R3: text and background colours of a project capsule come from tagVars, above 4.4:1 in both themes */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:var(--tagd,var(--pc));background:var(--tagbgd,var(--tagbg));} }
:root[data-theme="dark"] .tag{color:var(--tagd,var(--pc));background:var(--tagbgd,var(--tagbg));}
.row-meta .over{color:var(--red);}

.row-meta .bell svg{width:11px;height:11px;vertical-align:-1px;}
.row-meta .carried{color:var(--orange);font-weight:500;}
/* R3: the notes and voice indicators sit on the right, next to the priority */
.inds{flex:none;display:flex;align-items:center;gap:5px;color:var(--ink3);}
.inds svg{width:14px;height:14px;display:block;}
.pri{flex:none;font-weight:700;font-size:1rem;min-width:14px;text-align:center;letter-spacing:-1px;}
.pri.high{color:var(--red);}
.pri.mid{color:var(--orange);}
.chev{flex:none;color:var(--ink3);width:8px;height:14px;}

.empty{text-align:center;color:var(--ink2);padding:60px 20px 20px;font-size:0.882rem;}
.empty svg{width:48px;height:48px;color:var(--ink3);margin-bottom:10px;}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px;}
.empty .acts{display:flex;gap:20px;justify-content:center;margin-top:14px;}
.empty .btn-link{color:var(--blue);font-weight:600;font-size:1rem;}

.done-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;font-size:0.882rem;color:var(--ink2);}
.done-toggle svg{width:12px;height:12px;transition:transform .25s;}
.done-toggle.open svg{transform:rotate(90deg);}

/* Settings cell */
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;width:100%;text-align:left;}
.cell + .cell{border-top:.5px solid var(--sep);margin-left:16px;padding-left:0;width:calc(100% - 16px);}
.cell:active{background:var(--press);}
.cell .lbl{flex:1;}
.cell .val{color:var(--ink2);display:flex;align-items:center;gap:6px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell .val .dot{width:12px;height:12px;border-radius:50%;}
.cell .chev{margin-left:2px;}
.cell .count{color:var(--ink2);background:var(--fill);border-radius:10px;padding:1px 8px;font-size:.765rem;min-width:24px;text-align:center;}
.cell.destructive{color:var(--red);justify-content:center;}
.cell.link{color:var(--blue);}
.cell input[type=text]{flex:1;background:none;border:0;outline:0;}
.cell .pdot{width:12px;height:12px;border-radius:50%;flex:none;}
.picon{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;}
.picon svg{width:17px;height:17px;}
.footnote{font-size:0.765rem;color:var(--ink2);padding:0 16px 14px;line-height:1.4;}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .2s;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s;}
.switch.on{background:var(--green);}
.switch.on::after{transform:translateX(20px);}
.seg.mini{margin:-4px 0 12px;padding:2px;}
.pchips{display:flex;gap:8px;overflow-x:auto;margin:-4px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 12px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 2px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;}
.pchips::-webkit-scrollbar{display:none;}
.pchips .chip{height:30px;font-size:0.824rem;}
.pchips .chip .dot{width:8px;height:8px;border-radius:50%;}
.pchips .chip.on{color:#fff;}
.plan-title{font-size:1.06rem;font-weight:600;text-align:center;margin:2px 0 10px;line-height:1.3;}
.closeday{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:10px 0 2px;border-top:.5px solid var(--sep);color:var(--blue);font-weight:600;font-size:0.882rem;}

/* R8: Cerrar el día in the folded summary, at the end of Hoy and its sheet */
.summary-head .sumclose{width:auto;height:44px;margin:-8px 10px -8px auto;color:var(--blue);font-size:0.824rem;font-weight:600;}
.cell.closecell svg{width:20px;height:20px;flex:none;}
.cdnums{display:flex;gap:8px;margin:0 0 4px;}
.cdnums div{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:8px 4px;}
.cdnums b{display:block;font-size:1.412rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;}
.cdnums span{font-size:0.706rem;color:var(--ink2);}
.cdnums .red b{color:var(--red);}
.plist.cdlist{max-height:140px;margin-top:6px;}
.cdlist .pl{padding:4px 16px;}
.cdlist.done .t{color:var(--ink2);}
.cdacts{margin-top:14px;}
.sheet .cdfoot{margin:10px 0 0;font-size:0.824rem;}
.rvchips{justify-content:center;margin:4px 0 6px;}
.seg.mini button{height:24px;font-size:0.706rem;}
.selbox{flex:none;position:relative;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.selbox svg{width:12px;height:12px;color:#fff;opacity:0;}
.row.selected .selbox{background:var(--blue);border-color:var(--blue);}
.row.selected .selbox svg{opacity:1;}
.row.selected .row-content{background:var(--fill);}
.selbar{position:absolute;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:none;z-index:7;}
.selbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:0.588rem;color:var(--blue);height:48px;}
.selbar button.red{color:var(--red);}
.selbar button:disabled{opacity:.35;}
.selbar svg{width:22px;height:22px;}
.app.selecting .tabbar,.app.selecting .fab{display:none;}
.app.selecting .selbar{display:flex;z-index:9;} /* above pushed screens (8): selecting inside a project; still under sheets and toast */
.preview{display:flex;align-items:center;justify-content:space-between;width:100%;padding:4px 20px 16px;color:var(--ink2);font-size:0.882rem;}
.preview svg{width:8px;height:14px;color:var(--ink3);}
.alldone{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--sep);color:var(--green);font-weight:600;font-size:0.882rem;}
.alldone svg{width:16px;height:16px;}
.tips p{margin:0 0 10px;font-size:0.882rem;line-height:1.4;}
.tips b{font-weight:600;}

/* FAB */
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,122,255,.35);z-index:6;transition:transform .15s;}
.fab:active{transform:scale(.94);}
.fab svg{width:26px;height:26px;}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;z-index:7;}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:0.588rem;color:var(--ink2);height:48px;}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--dim);opacity:0;transition:opacity .45s ease;z-index:20;pointer-events:none;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px 14px 0 0;transform:translate3d(0,110%,0);transition:transform .5s cubic-bezier(.32,.72,0,1);z-index:21;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85%;overflow-y:auto;}
.sheet.on{transform:translate3d(0,calc(-1 * var(--kb)),0);}
/* Keyboard not reported by the system (kbFallback): the sheet moves to the top of the screen, above where the keyboard is */
.sheet.on.top{top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;left:8px;right:8px;border-radius:14px;transform:none;max-height:46%;padding-bottom:14px;animation:sheetTop .4s cubic-bezier(.32,.72,0,1);}
.sheet.on.top .handle{display:none;}
@keyframes sheetTop{from{opacity:0;transform:translate3d(0,-12px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.sheet.on.top{animation:none;}}
.sheet.drag{transition:none;}
.handle{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:4px auto 10px;}
.sheet h2{font-size:1rem;font-weight:600;margin:4px 0 12px;text-align:center;}
/* iOS sheet header with text fields: Cancelar, title and the main action stay above the keyboard and its floating bar */
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin:0 -6px 8px;}
.shead h2{margin:0;padding:0 6px;}
.hbtn{height:44px;padding:0 6px;font-size:1rem;color:var(--blue);justify-self:start;}
.hbtn.ok{justify-self:end;font-weight:600;}
.hbtn:active{opacity:.4;}
/* While the keyboard is up, room for the floating input bar iOS draws over the page: the icon bar and Añadir of Nueva tarea (R5) sit right above it */
.kbup .sheet.on:not(.top){padding-bottom:64px;}
.sheet .titlein{width:100%;background:var(--bg);border:0;border-radius:10px;height:44px;padding:0 12px;outline:0;font-size:max(16px,1rem);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:0.824rem;font-weight:500;white-space:nowrap;}
.chip.on{background:var(--blue);color:#fff;}
.chip .dot{width:9px;height:9px;border-radius:50%;}
.chip svg{width:14px;height:14px;}
/* R5 and R7: quick add. Recognised words are tinted blue behind the text of the field (an overlay that scrolls with it);
   a bar of 44 pt icons sits on the keyboard and each icon opens a strip of options above it */
.qin{position:relative;border-radius:10px;background:var(--bg);}
.qhl{position:absolute;inset:0;display:flex;align-items:center;padding:0 12px;overflow:hidden;pointer-events:none;color:transparent;white-space:pre;font-size:max(16px,1rem);}
.qhl span{flex:none;white-space:pre;}
.qhl mark{color:transparent;background:var(--qhl);border-radius:4px;box-shadow:0 0 0 1px var(--qhl);}
.qin input{position:relative;display:block;background:transparent !important;}
.sheet.addsheet{padding-top:2px;}
.qtoks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;}
.qtoks:empty,.qstatus:empty,.qstrip:empty{display:none;}
.tok{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 2px 0 10px;border-radius:14px;background:var(--qhl);color:var(--blue);font-size:0.824rem;font-weight:500;white-space:nowrap;}
.tok .dot{width:8px;height:8px;border-radius:50%;}
.tok svg{width:13px;height:13px;}
.tok .x{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:1.06rem;line-height:1;opacity:.75;}
.tok .x::after{content:'';position:absolute;inset:-10px -6px;} /* a 44 pt target around a small cross */

.qstatus.warn{color:var(--orange);}

.qbtn svg{width:22px;height:22px;}
.qbtn.set{color:var(--blue);}
.qbtn.open{background:var(--fill);color:var(--blue);}
.qbar .grow{flex:1;}
.qadd{position:relative;height:36px;padding:0 18px;margin-right:4px;border-radius:18px;background:var(--blue);color:#fff;font-weight:600;font-size:0.941rem;flex:none;-webkit-touch-callout:none;}

.plist{margin-top:10px;background:var(--bg);border-radius:10px;max-height:236px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.plhead{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 0;font-size:0.765rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;}
.plhead button{color:var(--blue);text-transform:none;letter-spacing:0;font-size:0.882rem;height:32px;}
.pl{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 0 4px 12px;font-size:0.941rem;}

.btn{flex:1;height:48px;border-radius:12px;font-size:1rem;font-weight:600;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn.primary{background:var(--blue);color:#fff;}

.sheet .mic.rec{animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}100%{box-shadow:0 0 0 18px rgba(255,59,48,0)}}

/* Action menu */
.asheet{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:21;max-height:calc(100% - 60px);overflow-y:auto;transform:translate3d(0,120%,0);transition:transform .45s cubic-bezier(.32,.72,0,1);}

/* R10: anchored menus on the iPhone (popMenu). A long press lifts a copy of the row over a blurred screen; buttons anchor the menu to themselves */
.pm{position:fixed;inset:0;z-index:30;display:none;touch-action:none;}
.pm.open{display:block;}
.pm.open:not(.on){pointer-events:none;} /* a closing menu takes no taps while it fades */
.pm-back{position:absolute;inset:0;background:var(--pmdim);opacity:0;transition:opacity .3s ease;}
.pm.lift .pm-back{background:var(--pmdimL);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.pm.on .pm-back{opacity:1;}
.pm-lift{position:absolute;pointer-events:none;transform:translate3d(0,0,0);transition:transform .32s cubic-bezier(.32,.72,0,1),opacity .18s;}
.pm.on .pm-lift{transform:translate3d(0,var(--sy,0px),0) scale(1.03);transition:transform .42s cubic-bezier(.34,1.32,.64,1),opacity .18s;}
.pm.pick .pm-lift{opacity:0;}
.pm-lift::before{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.1);opacity:0;transition:opacity .3s;}
.pm.on .pm-lift::before{opacity:1;}
.pm-lift > .group{margin:0;height:100%;border-radius:12px;}
.pm-lift .row-content{transform:none;}
.pm-menu{position:absolute;width:254px;max-width:calc(100% - 16px);background:var(--pmmat);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.04);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;color:var(--ink);opacity:0;transform:scale(.4);transition:transform .2s ease-in,opacity .18s;}
.pm.on .pm-menu{opacity:1;transform:none;transition:transform .42s cubic-bezier(.34,1.25,.64,1),opacity .2s;}
.pm-list.swap{animation:pmSwap .24s cubic-bezier(.32,.72,0,1);}
@keyframes pmSwap{from{opacity:0;transform:scale(.97);}}
.pm-title{font-size:0.765rem;color:var(--ink2);padding:10px 16px 8px;line-height:1.25;border-bottom:.5px solid var(--pmsep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pm-grp + .pm-grp,.pm-prio + .pm-grp,.pm-head + .pm-grp{border-top:8px solid var(--pmgap);}
.pm-it,.pm-head{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:10px 16px;text-align:left;font-size:1rem;line-height:1.2;color:var(--ink);}
.pm-it + .pm-it{border-top:.5px solid var(--pmsep);}
.pm-it.chk{padding-left:10px;}
.pm-it .pm-ck{width:18px;flex:none;display:flex;color:var(--ink);}
.pm-it .pm-ck svg{width:15px;height:15px;}
.pm-it .pm-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.pm-it .pm-l small{display:block;font-size:0.765rem;color:var(--ink2);margin-top:1px;}
.pm-it .pm-ic{flex:none;display:flex;align-items:center;gap:6px;color:var(--ink);}
.pm-it .pm-ic svg{width:20px;height:20px;}
.pm-it .pm-ic .pm-sub{width:7px;height:12px;color:var(--ink3);}
.pm-it .pm-dot{width:14px;height:14px;border-radius:50%;margin:3px;}
.pm-it.red,.pm-it.red .pm-ic{color:var(--red);}
.pm-head{font-weight:600;gap:8px;}
.pm-head svg{width:10px;height:17px;color:var(--blue);flex:none;}
.pm-prio{display:flex;}
.pm-prio button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;font-size:0.706rem;color:var(--ink);}
.pm-prio button + button{border-left:.5px solid var(--pmsep);}
.pm-prio button svg{width:22px;height:22px;}
.pm-prio .high svg{color:var(--red);}
.pm-prio .mid svg{color:var(--orange);}
.pm-prio .none svg{color:var(--ink2);}
.pm-prio button.on{background:var(--pmhl);font-weight:600;}
.pm-it.hl,.pm-head.hl,.pm-prio button.hl,.pm-it:active,.pm-head:active,.pm-prio button:active{background:var(--pmhl);}
.pm-src{visibility:hidden;}

/* Toast */
.toast{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);color:var(--ink);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.18);transform:translate3d(0,20px,0);opacity:0;transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .3s;z-index:30;pointer-events:none;font-size:0.882rem;}
.toast.on{transform:translate3d(0,0,0);opacity:1;pointer-events:auto;}
.toast button{color:var(--blue);font-weight:600;}

/* Detail */
.detail .scroll{padding-top:4px;}

.detail .titlein{width:100%;font-size:max(16px,1rem);font-weight:600;background:none;border:0;outline:0;padding:0;resize:none;overflow:hidden;line-height:1.3;display:block;min-height:22px;}
.detail textarea{width:100%;min-height:72px;background:none;border:0;outline:0;resize:none;padding:0;line-height:1.4;overflow:hidden;display:block;}
.vn{position:relative;overflow:hidden;border-top:.5px solid var(--sep);}
.vn:first-child{border-top:0;}
.vn-c{position:relative;background:var(--card);padding:10px 16px;font-size:0.882rem;line-height:1.4;white-space:pre-wrap;transition:transform .4s cubic-bezier(.32,.72,0,1);}
.vn-c.drag{transition:none;}

.wide .vn-c{cursor:pointer;} .wide .vn-c:hover{background:var(--fill);}

.links{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px;}

.seg.pri-seg button{height:32px;}
.seg.pri-seg button.on.high{color:var(--red);}

/* ---------- R11: desktop density, as on a Mac. Text at 14 px (html.wide sets the rem), single-line rows of 32 px with date,
   reminder and priority in right-aligned columns, white content and a translucent grey sidebar. The iPhone layout is untouched. ---------- */
html.wide{font-size:14px;}
.app.desktop{--bg:var(--dmain);--card:var(--dmain);--ghbg:var(--dgh);--press:var(--dhov);--sep:var(--dline);}
.app.desktop .desk{grid-template-columns:220px minmax(0,1fr);background:var(--dmain);position:relative;}
.app.desktop.has-pane .desk{grid-template-columns:220px minmax(0,1fr) var(--panew,400px);}
.app.desktop .side{background:var(--dside);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-right:.5px solid var(--dline);padding:10px 10px 10px;}
.app.desktop .side .sp{font-size:15px;padding:6px 8px 10px;}
.app.desktop .side .sp:hover{color:var(--ink2);}
.app.desktop .side .sec{font-size:11px;text-transform:none;letter-spacing:0;padding:12px 8px 4px;}
.app.desktop .side .it{height:28px;gap:8px;padding:0 8px;border-radius:6px;font-size:13px;}
.app.desktop .side .it svg{width:16px;height:16px;color:var(--blue);}
.app.desktop .side .it:hover{background:var(--dhov);}
.app.desktop .side .it.on{background:var(--dsel);color:var(--ink);}
.app.desktop .side .it.on .n{color:var(--ink2);}
.app.desktop .side .it .dot{width:9px;height:9px;margin:0 3.5px;}
.app.desktop .side .it .n{font-size:11px;font-variant-numeric:tabular-nums;}
/* The column head: title, project filter, search and view options, as wide as the list under it */
.app.desktop .main .mhead{gap:8px;padding:12px 24px 8px;max-width:948px;min-height:52px;}
.app.desktop .main .mhead.wide-head{max-width:none;}
.app.desktop .main .mhead h1{font-size:20px;letter-spacing:-.2px;}
.app.desktop .main .mhead .searchbar{width:auto;flex:none;gap:8px;}
.app.desktop .main .mhead .search{width:190px;flex:none;height:28px;border-radius:7px;background:var(--dfield);padding:0 8px;}
.app.desktop .main .mhead .search svg{width:13px;height:13px;}
.app.desktop .main .mhead .search input{height:28px;font-size:13px;}
.app.desktop .main .mhead .searchbar .cancel{font-size:13px;}
.app.desktop .main .mhead .mopts{width:28px;height:28px;border-radius:6px;background:none;border:0;color:var(--ink2);}
.app.desktop .main .mhead .mopts:hover,.app.desktop .main .mhead .mopts.open{background:var(--dhov);color:var(--ink);}
.pfslot{display:flex;flex:none;min-width:0;}
.pfdrop{display:flex;align-items:center;gap:6px;height:28px;max-width:230px;padding:0 8px 0 10px;border-radius:6px;font-size:13px;color:var(--ink);background:var(--dmain);border:.5px solid var(--dline);box-shadow:0 .5px 1.5px rgba(0,0,0,.08);}
.pfdrop:hover{background:var(--dhov);}
.pfdrop .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pfdrop .l i{font-style:normal;color:var(--ink2);}
.pfdrop .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.pfdrop svg{width:9px;height:9px;flex:none;color:var(--ink2);}
.pfdrop.on{background:var(--qhl);border-color:transparent;box-shadow:none;}
.app.desktop .main .mbody{padding:0 24px 40px;}
.app.desktop .main .inner{max-width:900px;}
.app.desktop .main .inner.week-inner{max-width:none;}
.app.desktop .addbar{height:34px;gap:8px;padding:0 10px;margin:2px 0 10px;border-radius:8px;background:var(--dmain);border:.5px solid var(--dline);box-shadow:0 .5px 1.5px rgba(0,0,0,.06);}

.app.desktop .addbar > svg{width:14px;height:14px;}
.app.desktop .addbar input,.app.desktop .addbar .qhl{font-size:14px;}
.app.desktop .addbar .kbd{font-size:11px;}
.app.desktop .addhint{margin:-6px 4px 10px;font-size:12px;}
/* The day summary as one line: the figures filter the list; "Lo primero" folds under it (the summary's own fold) */
.app.desktop .summary{background:none;border-radius:0;padding:0;margin:0 0 8px;}
.app.desktop .summary.collapsed{padding:0;}
.app.desktop .dsum .summary-head{margin:0;gap:4px;min-height:28px;justify-content:flex-start;}
.app.desktop .dsum .summary-head button{width:auto;height:26px;margin:0;color:var(--ink2);}
.app.desktop .dsum .summary-head svg,.app.desktop .summary.collapsed .summary-head svg{transform:none;}
.dsum .num{flex:none;display:flex;align-items:center;gap:5px;padding:0 10px;border-radius:13px;font-size:13px;text-align:left;}
.dsum .num b{display:inline;font-size:14px;font-weight:600;letter-spacing:0;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.dsum .num span{font-size:13px;color:var(--ink2);}
.dsum .num:hover{background:var(--dhov);}
.dsum .num.on,.dsum .num.on:hover{background:var(--fill);}
.dsum .soonl{flex:1;min-width:0;display:flex;align-items:center;gap:5px;padding:0 8px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;}
.dsum .soonl span{overflow:hidden;text-overflow:ellipsis;}
.dsum .soonl svg{width:13px;height:13px;flex:none;color:var(--orange);}
.dsum .soonl.ok svg{color:var(--green);}
.app.desktop .dsum .summary-head .sumclose{color:var(--blue);font-size:13px;font-weight:500;padding:0 8px;border-radius:6px;}
.app.desktop .dsum .summary-head .sumfold{display:flex;align-items:center;gap:5px;padding:0 8px;border-radius:6px;font-size:13px;}
.app.desktop .dsum .summary-head .sumclose:hover,.app.desktop .dsum .summary-head .sumfold:hover{background:var(--dhov);}
.dsum .sumfold svg{width:9px;height:9px;transition:transform .2s;}
.app.desktop .summary.collapsed .sumfold svg{transform:rotate(-90deg);}
.app.desktop .dsum .first{margin:4px 0 0;}
.app.desktop .dsum .first .row-content{padding:0 8px 0 12px;min-height:32px;}
/* Rows: one line; the circle keeps a 32 px click area */

.app.desktop .row-content:hover{background:var(--dhov);}

.app.desktop .check{width:16px;height:16px;border-width:1.2px;}

.app.desktop .row-meta{flex:none;display:flex;margin:0;font-size:12px;font-variant-numeric:tabular-nums;}
.rc{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;}
.rc-date{width:84px;}
.rc-rem{width:100px;}

.app.desktop .inds{width:34px;justify-content:flex-end;gap:4px;}

.app.desktop .pri{width:22px;font-size:13px;}

.app.desktop .row.cv{contain-intrinsic-size:auto 32px;}
.app.desktop .rph{height:32px;}
/* R15, R16: the selected row in the accent tint (apart from the hover gray), the multiple selection, the keyboard's focus ring,
   the title edited in place and the rows being dragged */
.app.desktop .main .row{outline:none;scroll-margin:40px 0 8px;}
.app.desktop .main .row.cur > .row-content,.app.desktop .main .row.selected > .row-content{background:var(--qhl);border-radius:6px;}
.app.desktop .main .row.cur > .row-content::before,.app.desktop .main .row.selected > .row-content::before,.app.desktop .main .row.cur + .row > .row-content::before,.app.desktop .main .row.selected + .row > .row-content::before{opacity:0;}

.rowedit{flex:1;min-width:0;height:24px;margin:0 0 0 -5px;padding:0 5px;border:0;border-radius:5px;font-size:14px;background:var(--dmain);box-shadow:0 0 0 2px var(--blue);outline:none;}
.app.desktop .side .it.over{background:var(--qhl);box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--ink);}
.dragcount{position:fixed;left:-1000px;top:0;padding:4px 10px;border-radius:12px;background:var(--blue);color:#fff;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap;}

.mact{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 12px;font-size:13px;color:var(--ink);text-align:left;}

body.desktop .sheet.keysheet{width:min(680px, calc(100% - 48px));}

.wbody{flex:1;min-height:0;display:flex;gap:10px;}
.wgrid{flex:1;min-width:0;display:grid;gap:8px;grid-template-rows:minmax(0,1fr);}

.wday.over,.wtray.over,.hallday.over,.mday.over,.hs.over{background:var(--fill);border-color:var(--blue);}
.wday .wl,.wtray .wl{flex:1;min-height:0;overflow-y:auto;padding:0 6px 6px;overscroll-behavior:contain;}
/* A day's header: name and date, counts and the load bar */
.dh{flex:none;padding:6px 8px 6px;}
.dh .dt{display:flex;align-items:center;justify-content:space-between;gap:4px;height:22px;}
.dh b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;}
.dh b small{font-weight:400;color:var(--ink2);margin-left:4px;font-size:13px;}
.today .dh b{color:var(--blue);}
.dh button{flex:none;width:22px;height:22px;border-radius:5px;color:var(--ink2);display:flex;align-items:center;justify-content:center;}
.dh button:hover{background:var(--dhov);color:var(--blue);}
.dh button svg{width:13px;height:13px;}
.dh .dm{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums;}
.dh .dm .wc{overflow:hidden;text-overflow:ellipsis;}
.dh .dm .wp{color:var(--red);font-weight:600;}
.dh .ld{height:3px;border-radius:2px;background:var(--dline);margin-top:5px;overflow:hidden;}
.dh .ld i{display:block;height:100%;background:var(--ink3);transform-origin:left;}
.dh .ld.orange i{background:var(--orange);}
.dh .ld.red i{background:var(--red);}
/* One-line cards: priority, title, time at the right; project colour at the left edge; carried ones with an orange edge */
.wcard{display:flex;align-items:center;gap:6px;height:28px;padding:0 7px 0 6px;border-radius:6px;background:var(--dmain);margin-bottom:4px;cursor:grab;border-left:3px solid var(--pc,var(--ink3));box-shadow:0 0 0 .5px var(--dline),0 .5px 1px rgba(0,0,0,.05);}
.wcard:hover{box-shadow:0 0 0 1px var(--blue);}
.wcard.popped{box-shadow:0 0 0 2px var(--blue);}
.wcard.carried{box-shadow:0 0 0 1px var(--orange);}
.wcard.carried:hover{box-shadow:0 0 0 1px var(--blue);}
.wcard.dragging{opacity:.4;}
.app.desktop .wcard .check{width:14px;height:14px;border-width:1.2px;}
.app.desktop .wcard .check svg{width:8px;height:8px;}
.wcard .t{flex:1;min-width:0;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wcard .t .pri{display:inline;width:auto;min-width:0;margin-right:4px;letter-spacing:-1px;font-size:11px;}
.wcard .tm{flex:none;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;}
.wcard.done .t{text-decoration:line-through;color:var(--ink2);}
/* The undated tray: a column at the right that folds into a narrow strip */
.wtray{flex:none;width:210px;display:flex;flex-direction:column;min-height:0;background:var(--dgroup);border-radius:10px;border:1.5px solid transparent;transition:border-color .15s,background .15s;}
.wtray .trh{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;font-size:13px;font-weight:600;color:var(--ink);text-align:left;}
.wtray .trh svg{width:9px;height:9px;color:var(--ink2);flex:none;}
.wtray .trh .l{flex:1;min-width:0;white-space:nowrap;}
.wtray .trh .n{font-size:11px;font-weight:400;color:var(--ink2);font-variant-numeric:tabular-nums;}
.wtray .trhint{margin:8px 4px;font-size:11px;color:var(--ink2);text-align:center;}
@media (max-width:1180px){ .wtray{width:160px;} } /* on a small window the days keep most of the width */
.wtray.shut{width:36px;}
.wtray.shut .trh{flex-direction:column;height:auto;padding:10px 0;gap:8px;}
.wtray.shut .trh svg{transform:rotate(90deg);}
.wtray.shut .trh .l{writing-mode:vertical-rl;flex:none;}
/* Horas: the "Todo el día" strip and the half-hour grid; blocks are always half an hour */
.hours{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--dgroup);border-radius:10px;overflow:hidden;}
.hrow{display:grid;column-gap:0;}
.hhead{flex:none;border-bottom:.5px solid var(--dline);}
.hdh{min-width:0;border-left:.5px solid var(--dline);}
.hall{flex:none;border-bottom:.5px solid var(--dline);}
.hgut{font-size:10px;color:var(--ink2);padding:5px 6px 0 0;text-align:right;line-height:1.15;}
.hallday{min-width:0;min-height:34px;border-left:.5px solid var(--dline);border:1.5px solid transparent;border-left-color:var(--dline);}
.hallday .wl{max-height:96px;overflow-y:auto;padding:3px 4px 0;}
.hallday .hcount{display:block;padding:7px 8px;font-size:12px;color:var(--ink2);}
.hscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
.hgrid{position:relative;border-bottom:.5px solid var(--dline);}
.hlab{position:relative;padding:0;}
.hlab span{position:absolute;right:6px;transform:translateY(-50%);font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;}
.hlab span:first-child{transform:none;}
.hcol{position:relative;min-width:0;border-left:.5px solid var(--dline);}
.hs{height:22px;border-top:.5px solid var(--dline);border-bottom:0;}
.hs.half{border-top-style:dotted;}
.hs.past{background:var(--dhov);}
.hs.over{border:0;box-shadow:inset 0 0 0 1.5px var(--blue);}
.hcol.today .hs:not(.past){background:rgba(0,122,255,.035);}
.wcard.hb{position:absolute;margin:0;height:20px;padding:0 5px 0 4px;gap:4px;z-index:1;}
.wcard.hb .tm{font-size:10px;font-weight:600;color:var(--ink);}
.hnow{position:absolute;left:0;right:0;top:0;height:0;border-top:1.5px solid var(--red);z-index:2;pointer-events:none;}
.hnow::before{content:"";position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--red);}
/* Mes: six weeks filling the column; up to four chips a day and "N más" */
.month{flex:1;min-height:0;display:flex;flex-direction:column;}
.mdow{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11px;color:var(--ink2);font-weight:600;padding:0 0 4px;}
.mdow span{padding:0 8px;text-align:right;}
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));border-top:.5px solid var(--dline);border-left:.5px solid var(--dline);}
.mday{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:3px 4px 4px;border-right:.5px solid var(--dline);border-bottom:.5px solid var(--dline);outline:1.5px solid transparent;outline-offset:-1.5px;}
.mday.over{outline-color:var(--blue);}
.mday.other{background:var(--dgroup);}
.mday.other .mnum{color:var(--ink3);}
.mday .mh{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.mnum{height:20px;min-width:20px;padding:0 6px;border-radius:10px;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;}
.mnum:hover{background:var(--dhov);}
.mday.today .mnum{background:var(--red);color:#fff;font-weight:600;}
.wcard.mc{flex:none;height:18px;margin:0;padding:0 4px;gap:4px;border-left:0;box-shadow:none;background:none;border-radius:4px;}
.wcard.mc:hover{background:var(--dhov);box-shadow:none;}
.wcard.mc.carried{box-shadow:inset 0 0 0 1px var(--orange);}
.wcard.mc.popped{box-shadow:inset 0 0 0 1.5px var(--blue);}
.wcard.mc .mdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--pc,var(--ink3));}
.wcard.mc .t{font-size:11px;}
.wcard.mc .tm{font-size:10px;}
.mmore{flex:none;margin-right:auto;height:18px;padding:0 5px;border-radius:4px;font-size:11px;color:var(--ink2);font-weight:600;}
.mmore:hover{background:var(--dhov);color:var(--ink);}
/* R19: the sidebar's mini month */
.minical{padding:4px 2px 2px;}
.minical .cal{padding:0;}
.minical .cal-head{font-size:12px;padding:0 0 2px 6px;}
.minical .cal-head button{width:24px;height:22px;border-radius:5px;color:var(--ink2);}
.minical .cal-head button:hover{background:var(--dhov);}
.minical .cal-head svg{width:6px;height:10px;}
.minical .cal-dow{font-size:10px;padding:0 0 2px;}
.minical .cal-grid{row-gap:0;}
.minical .cal-d{height:24px;border-radius:5px;}
.minical .cal-d span{width:22px;height:22px;font-size:11px;font-variant-numeric:tabular-nums;}
.minical .cal-d.past span{color:var(--ink2);}
.minical .cal-d.other span{color:var(--ink3);}
.minical .cal-d.inr{background:var(--dsel);border-radius:0;}
.minical .cal-d:hover span{background:var(--dhov);}
.minical .cal-d.today span{background:var(--red);color:#fff;}
.minical .cal-d i{bottom:0;}
.minical .cal-d i b{width:3px;height:3px;}
.minical .cal-d.over{box-shadow:inset 0 0 0 1.5px var(--blue);}
/* R20: the agenda of Hoy, on screens wider than 1400 px */
.hagenda{display:none;}
@media (min-width:1401px){
  .app.desktop:not(.has-pane) .main.with-agenda{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr);}
  .app.desktop:not(.has-pane) .main.with-agenda .mhead{grid-column:1;grid-row:1;}
  .app.desktop:not(.has-pane) .main.with-agenda .mbody{grid-column:1;grid-row:2;}
  .app.desktop:not(.has-pane) .hagenda{grid-column:2;grid-row:1 / 3;display:flex;flex-direction:column;min-height:0;padding:12px 16px 14px 0;}
}
.hagenda .ahead{flex:none;display:flex;align-items:baseline;gap:8px;height:28px;margin:0 0 8px;}
.hagenda .ahead b{font-size:15px;font-weight:600;}
.hagenda .ahead span{font-size:13px;color:var(--ink2);}
/* ---------- R17: the detail pane becomes an inspector: close button, a form of pop-up buttons, priority segment,
   dates at the foot, and a left edge that resizes it (320 to 600 px). In Semana it opens as a popover next to the card. ---------- */
.app.desktop .pane{background:var(--dmain);border-left:.5px solid var(--dline);position:relative;}
.app.desktop .pane .screen{background:var(--dmain);}
.ihead{flex:none;display:flex;align-items:center;gap:2px;height:40px;padding:0 8px;border-bottom:.5px solid var(--dline);}
.ihead .grow{flex:1;}
.ihead button{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink2);}
.ihead button:hover{background:var(--dhov);color:var(--ink);}
.ihead svg{width:15px;height:15px;}
.ihead .ix svg{width:12px;height:12px;}
.app.desktop .pane .scroll{padding:12px 16px 24px;}
.app.desktop .pane .igroup{background:none;border-radius:0;margin:0;}
.app.desktop .pane .igroup .cell{padding:0;min-height:0;width:100%;margin:0;}
.app.desktop .pane .igroup .cell + .cell{margin:8px 0 0;padding-top:8px;border-top:.5px solid var(--dline);width:100%;}
.app.desktop .pane .titlein{font-size:17px;font-weight:600;line-height:1.3;}
.app.desktop .pane textarea[data-role=notes]{font-size:13px;line-height:1.45;}
.app.desktop .pane .links{padding:4px 0 6px;}
.app.desktop .pane .links a{font-size:12px;padding:3px 9px;}
.app.desktop .pane .igroup .convert{padding:4px 0;min-height:28px;font-size:13px;}
.iform{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px 12px;padding:12px 0;margin:10px 0 14px;border-top:.5px solid var(--dline);border-bottom:.5px solid var(--dline);}
.iform .ilbl{font-size:13px;color:var(--ink2);text-align:right;}
.ipop{justify-self:start;display:flex;align-items:center;gap:6px;height:26px;min-width:150px;max-width:100%;padding:0 6px 0 9px;border-radius:6px;font-size:13px;background:var(--dmain);border:.5px solid var(--dline);box-shadow:0 .5px 1.5px rgba(0,0,0,.08);}
.ipop:hover,.ipop.open{background:var(--dhov);}
.ipop .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
.ipop .val.none{color:var(--ink2);}
.ipop .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.ipop svg{width:12px;height:12px;flex:none;color:var(--ink2);}
.seg.iseg{margin:0;padding:2px;max-width:260px;border-radius:7px;}
.seg.iseg button{height:22px;font-size:12px;border-radius:5px;}
.seg.iseg button .pri{display:inline;width:auto;min-width:0;margin-right:4px;font-size:12px;}
.app.desktop .pane .group-title{padding:0 0 4px;}
.app.desktop .pane .group:not(.igroup){background:var(--dgroup);border-radius:8px;margin-bottom:12px;}
.app.desktop .pane .vn-c{font-size:13px;padding:8px 12px;}
.app.desktop .pane .cell.link{min-height:32px;padding:6px 12px;font-size:13px;}
.ifoot{font-size:11px;line-height:1.55;color:var(--ink2);margin-top:4px;padding-top:10px;border-top:.5px solid var(--dline);}
.igrip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:6;}
.igrip::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--blue);opacity:0;transition:opacity .15s;}
.igrip:hover::after,body.resizing .igrip::after{opacity:1;}
body.resizing,body.resizing *{cursor:col-resize !important;-webkit-user-select:none;user-select:none;}
.app.desktop .pane.wpop{position:absolute;z-index:12;width:340px;height:auto;border:0;border-radius:12px;box-shadow:var(--mshadow);overflow:hidden;animation:wpopIn .16s ease-out;}
.app.desktop .pane.wpop .screen{height:auto;max-height:inherit;min-height:0;}
.app.desktop .pane.wpop .scroll{flex:1 1 auto;min-height:0;}
@keyframes wpopIn{from{opacity:0;}}
/* ---------- R17: macOS menus (popMenu on the desktop): at the pointer or under their control, 13 px, hover highlight,
   submenus to the side, a check column and the shortcut on the right. Popovers (dates) use the same panel. ---------- */
.pm.mac .pm-back{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;}
.pm.mac .pm-menu{width:auto;min-width:210px;max-width:320px;padding:5px;border-radius:9px;background:var(--mmat);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--mshadow);font-size:13px;opacity:0;transform:none;transition:opacity .12s;}
.pm.mac.on .pm-menu{opacity:1;transform:none;transition:opacity .06s;}
.pm.mac .pm-it{min-height:24px;padding:2px 10px 2px 4px;gap:4px;border-radius:5px;font-size:13px;}
.pm.mac .pm-it + .pm-it{border-top:0;}
.pm.mac .pm-grp + .pm-grp,.pm.mac .pm-title + .pm-grp{border-top:0;}
.pm.mac .pm-grp + .pm-grp::before{content:"";display:block;height:1px;margin:5px 8px;background:var(--msep);}
.pm.mac .pm-title{font-size:11px;font-weight:600;padding:3px 10px 4px 24px;border:0;color:var(--ink2);}
.pm.mac .pm-it .pm-ck{width:18px;justify-content:center;}
.pm.mac .pm-it .pm-ck svg{width:11px;height:11px;}
.pm.mac .pm-it .pm-dot{width:9px;height:9px;margin:0 4px 0 0;flex:none;}
.pm.mac .pm-it .pm-key{flex:none;margin-left:auto;padding-left:22px;color:var(--ink2);font-size:12px;}
.pm.mac .pm-it .pm-sub{flex:none;width:6px;height:10px;margin-left:12px;color:var(--ink2);}
.pm.mac .pm-it .pm-key + .pm-sub{margin-left:8px;}
.pm.mac .pm-it.hl,.pm.mac .pm-it:active{background:var(--blue);color:#fff;}
.pm.mac .pm-it.hl .pm-ck,.pm.mac .pm-it.hl .pm-key,.pm.mac .pm-it.hl .pm-sub,.pm.mac .pm-it.red.hl{color:#fff;}
.pm.mac .pm-menu.pm-pop{width:300px;max-width:calc(100% - 16px);padding:12px;border-radius:12px;}
.pm-pop .chips{margin:0 0 8px;gap:6px;}
.pm-pop .chip{height:24px;padding:0 9px;border-radius:12px;font-size:12px;}
.pm-pop .chip:hover{background:var(--fill2);}
.pm-pop .chip.on:hover{background:var(--blue);}
.pm-pop .cal{padding:0;}
.pm-pop .cal-head{font-size:13px;padding:0 0 4px;}
.pm-pop .cal-head button{width:28px;height:24px;border-radius:5px;}
.pm-pop .cal-head button:hover{background:var(--dhov);}
.pm-pop .cal-head svg{width:7px;height:12px;}
.pm-pop .cal-dow{font-size:11px;padding:0 0 4px;}
.pm-pop .cal-d{height:32px;}
.pm-pop .cal-d span{width:28px;height:28px;font-size:13px;}
.pm-pop .cal-d:not(.sel):not([disabled]):hover span{background:var(--fill);}
.pm-pop .cal-d i{bottom:0;}
.pm-pop .timerow{margin-top:8px;padding:0 10px;height:32px;font-size:13px;border-radius:7px;background:var(--fill);}
.pm-pop .timerow input[type=time]{font-size:13px;}
.pm-pop .sheet-actions{margin-top:10px;}
.pm-pop .btn{height:28px;border-radius:7px;font-size:13px;}
.pm-pop .hint.warn{color:var(--red);font-size:12px;text-align:center;margin:8px 0 0;}
/* Reduce Motion (last, so it wins over the rules above): what slides or scales fades instead.
   Finger tracking stays; a row or sheet let go jumps to its place. Sheets keep their keyboard offset (.sheet.on). */
@media (prefers-reduced-motion: reduce){
 .row-content,.flip{transition-property:opacity;}
 .row.leaving .row-content{transform:none;transition:opacity .22s;}
 .check.done.just,.row.armed .row-bg.left svg{animation:none;}
 .check svg{transform:none;transition:opacity .15s;}
 .sheet,.asheet{transform:none;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s;}
 .sheet.on,.asheet.on{opacity:1;visibility:visible;transition:opacity .2s,visibility 0s;}
 .sheet.drag{transition:none;}
 body.desktop .sheet,body.desktop .asheet,body.desktop .sheet.on,body.desktop .asheet.on{transform:translate(-50%,-50%);}
 .toast,.toast.on{transform:none;transition:opacity .25s;}
 .pm-menu,.pm.on .pm-menu{transform:none;transition:opacity .2s;}
 .pm-lift,.pm.on .pm-lift{transform:translate3d(0,var(--sy,0px),0);transition:opacity .18s;} /* the lifted row only moves out of the menu's way, without scaling or sliding */
 .pm-list.swap{animation:pmFade .2s;}
}
@keyframes pmFade{from{opacity:0;}}
</style>

<body>
<div class="app" id="app"><nav class="tabbar" id="tabbar"></nav><nav class="selbar" id="selbar"></nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="asheet" id="asheet"></div>
<div class="pm" id="pmenu" role="presentation"></div>
<label style="position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none" aria-hidden="true"><input type="checkbox" switch id="hap" tabindex="-1"></label>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn">Deshacer</button></div>

<script>
'use strict';
const APP_VERSION = '0.14.5';
let pendingSW = null; // service worker installed and waiting to take over
let updateRequested = false; // the user asked for the waiting worker to take over

/* ---------- Log: errors and app events, kept in localStorage for copy-and-paste debugging ---------- */
const LOGKEY = 'tareas-log';
let LOG = []; try{ LOG = JSON.parse(localStorage.getItem(LOGKEY)||'[]'); if(!Array.isArray(LOG)) LOG=[]; }catch(e){ LOG=[]; }
function log(level, msg, extra){
  const e = { t:new Date().toISOString(), l:level, m:String(msg) };
  if(extra!==undefined){ try{ e.x = typeof extra==='string' ? extra : JSON.stringify(extra); }catch(err){ e.x = String(extra); } }
  LOG.push(e); if(LOG.length>400) LOG = LOG.slice(-400);
  try{ localStorage.setItem(LOGKEY, JSON.stringify(LOG)); }catch(err){}
}
window.addEventListener('error', e => log('error', e.message||'Error', (e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno+(e.error&&e.error.stack?'\n'+e.error.stack:'')));
window.addEventListener('unhandledrejection', e => log('error', 'Promesa rechazada: '+(e.reason&&e.reason.message||e.reason), e.reason&&e.reason.stack));
const _consoleError = console.error.bind(console);
console.error = (...a) => { log('error', a.map(x=>x&&x.message||String(x)).join(' ')); _consoleError(...a); };
function logText(){
  const d = (typeof DB!=='undefined'&&DB) ? ' | espacios '+DB.spaces.length+', proyectos '+DB.projects.length+', tareas '+DB.tasks.length+', notas de voz '+DB.voiceNotes.length : '';
  let st='?'; try{ st = (navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)?'instalada':'navegador'; }catch(e){}
  const head = 'Tareas v'+APP_VERSION+' | '+st+' | '+navigator.userAgent+' | '+new Date().toString()+d;
  const lines = LOG.map(e=>{ const t=e.t.replace('T',' ').slice(5,19); return t+' ['+e.l+'] '+e.m+(e.x?' | '+e.x:''); });
  return head+'\n'+(lines.length?lines.join('\n'):'(sin entradas)');
}

/* ---------- Utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));

function deskRowHTML(x, opts, v){ const t=v.t; let date='', dcls='', rem='';

    '<span class="inds">'+v.ind+'</span><span class="row-meta"><span class="rc rc-date'+dcls+'"'+(date?' title="'+esc(date)+'"':'')+'>'+date+'</span><span class="rc rc-rem"'+(rem?' title="Recordatorio: '+esc(rem)+'"':'')+'>'+(rem?I.bell+rem:'')+'</span></span>'+

/* Group headers. R14: in Todas, a project, Hoy by project and Completadas each header sits in a .gsec with its group,

function gtitle(label, n, right, attrs){ return '<div class="group-title gh"'+(attrs||'')+'><span class="gl">'+label+(n!=null?'<span class="gn">'+n+'</span>':'')+'</span>'+(right||'')+'</div>'; }
const gsec = (head, rows) => '<div class="gsec">'+head+'<div class="group">'+rows+'</div></div>';
// R14: a day of Todas, "Martes 3 nov"; a month, "Diciembre" (and the year when it is not this one)
function dayTitle(d){ const t=todayStr(); if(d===t) return 'Hoy'; if(d===addDays(t,1)) return 'Mañana'; const x=new Date(d+'T00:00:00'); return DIAS_FULL[x.getDay()]+' '+x.getDate()+' '+MESES[x.getMonth()]; }
function monthTitle(ym){ const [y,m]=ym.split('-').map(Number), n=MESES_FULL[m-1]; return n[0].toUpperCase()+n.slice(1)+(y!==new Date().getFullYear()?' '+y:''); }
/* R14: Todas by date. Today first (with the carried tasks), then one group per day for the next 14 days that have tasks,
   then one per month, then Sin fecha. A day header adds with its date (+) and, on a long press or a right click, moves its tasks.
   Keys sort as text: a day 'YYYY-MM-DD', a month 'YYYY-MM-~' (after its days), no date '~' (last) */
function dayGroupsHTML(list, R, root, projectId){ const t=todayStr(), lim=addDays(t,14), by=new Map(); let h='';
  list.forEach(x=>{ const k=!x.date?'~':x.date<=t?t:x.date<=lim?x.date:x.date.slice(0,7)+'-~'; if(!by.has(k)) by.set(k,[]); by.get(k).push(x); });
  [...by.keys()].sort().forEach(k=>{ const xs=by.get(k); let head;
    if(k==='~') head=root&&!UI.select ? gtitle('Sin fecha', null, '<button class="gx" data-act="plan">Planificar ('+xs.length+')</button>') : gtitle('Sin fecha', xs.length);
    else if(k.length===10) head=gtitle(dayTitle(k), xs.length, UI.select?'':'<button class="gadd" data-add-date="'+k+'"'+(projectId!==undefined?' data-project="'+(projectId||'')+'"':'')+' aria-label="Añadir con esta fecha">'+I.plus+'</button>', ' data-day-head="'+k+'"');
    else head=gtitle(monthTitle(k.slice(0,7)), xs.length);
    h+=gsec(head, xs.map(x=>R(x, k.length===10?{day:k, noToday:true}:{})).join('')); });

/* Grouped by project (Todas and, R13, Hoy): one group per project in the order of the Proyectos tab, with its colour and count.

  list.forEach(x=>{ const k=!x.projectId||!proj(x.projectId)?'none':ps.some(p=>p.id===x.projectId)?x.projectId:'archived'; (by[k]=by[k]||[]).push(x); });

  ps.forEach(p=>{ if(by[p.id]) h+=gsec(head(p.id, p.color, esc(p.name), by[p.id].length), by[p.id].map(x=>R(x,o)).join('')); });

/* R17: the desktop detail as a Mac inspector. The title and notes (the same fields and roles as the iPhone, for bindDetail),
   then a form: Proyecto a pop-up menu, Fecha and Recordatorio popovers with the calendar, Prioridad a three-position segment;

const UPDOWN='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5L6 2l2.5 2.5M3.5 7.5L6 10l2.5-2.5"/></svg>';

  return '<header class="ihead"><button class="ix back" data-act="back" aria-label="Cerrar" title="Cerrar (Esc)">'+XICON+'</button><span class="grow"></span><button data-act="share" aria-label="Compartir" title="Compartir">'+I.share+'</button><button data-act="menu" aria-label="Más" title="Más">'+I.more+'</button></header>'+

   '<div class="iform"><span class="ilbl">Proyecto</span>'+pop('pickProject', p?esc(p.name):'Ninguno', !p, UPDOWN, p?'<span class="dot" style="background:'+p.color+'"></span>':'')+

   '<div class="ifoot">'+[['Creada',x.created],['Modificada',x.modified],['Completada',x.status==='done'&&x.completed]].filter(o=>o[1]).map(o=>{ const w=fmtDateTime(o[1]); return o[0]+' '+w[0].toLowerCase()+w.slice(1)+'<br>'; }).join('')+'La notificación en el iPhone llega con la sincronización.</div>'+
