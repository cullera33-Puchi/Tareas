<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F9F9F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Tareas</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app"><nav class="tabbar" id="tabbar"></nav><nav class="selbar" id="selbar"></nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="asheet" id="asheet"></div>
<div class="pm" id="pmenu" role="presentation"></div>
<label style="position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none" aria-hidden="true"><input type="checkbox" switch id="hap" tabindex="-1"></label>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn">Deshacer</button></div>

<!-- Optional: window.TAREAS_CONFIG = {url, anonKey} for the sync (block 8). Written by the Pages workflow from the repository secrets,
     ignored by git. Without it (404) the app stays local only, as before. -->
<script src="config.js"></script>
<!-- The app: classic scripts in this order (no modules, no build). They share global names; boot.js starts the app. -->
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
<script src="js/menus.js"></script>
<script src="js/sheets.js"></script>
<script src="js/attachments.js"></script>
<script src="js/steps.js"></script>
<script src="js/notes.js"></script>
<script src="js/status.js"></script>
<script src="js/suggest.js"></script>
<script src="js/sync.js"></script>
<script src="js/push.js"></script>
<script src="js/inbox.js"></script>
<script src="js/lifecycle.js"></script>
<script src="js/desktop.js"></script>
<script src="js/desktop-calendar.js"></script>
<script src="js/desktop-render.js"></script>
<script src="js/desktop-add.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
