const detailLinks = notes => extractLinks(notes).slice(0,6);
/* R6: note lines that start with a dash, an asterisk or an empty box can become tasks of the same project. The note keeps its lines;
   once converted, the link hides until the note changes. */
function convertHTML(x){ const n=UI.convertedNotes[x.id]===x.notes?0:noteItems(x.notes).length; return n?'<button class="cell link convert" data-act="convertLines">'+I.list.replace('<svg','<svg style="width:18px;height:18px"')+'<span class="lbl">Convertir '+n+(n===1?' línea en tarea':' líneas en tareas')+'</span></button>':''; }
function convertNoteLines(id){ const x=task(id); if(!x) return; const ls=noteItems(x.notes); if(!ls.length) return;
  const ids=addMany(ls, {date:null, projectId:x.projectId, priority:'none'}, x.projectId?{}:{spaceId:x.spaceId}); UI.convertedNotes[id]=x.notes; renderAnimated();
  log('info','Líneas de notas convertidas en tareas', {n:ids.length}); toast(ids.length===1?'1 tarea creada':ids.length+' tareas creadas', ()=>{ removeTasks(ids); delete UI.convertedNotes[id]; }); }
// A voice note row: swipe right to edit, left to delete (on the desktop, a click offers both)
const vnHTML = v => '<div class="vn" data-vn="'+v.id+'"><div class="vn-bg l"><button data-vact="edit">Editar</button></div><div class="vn-bg r"><button data-vact="del">Eliminar</button></div><div class="vn-c"><small>'+fmtDateTime(v.created)+(v.modified?', editada':'')+'</small>'+linkify(v.text)+'</div></div>';
function linksHTML(links){ return links.map(l=>'<a href="'+esc(l.href)+'"'+(l.href.startsWith('tel:')?'':' target="_blank" rel="noopener"')+'>'+esc(l.label)+'</a>').join(''); }
function bindDetail(el, id){
  const x=task(id); if(!x) return;
  const ti=$('[data-role=title]',el), no=$('[data-role=notes]',el), sc=el.querySelector('.scroll');
  // Growing a text area collapses it for a moment: the screen keeps its scroll instead of jumping to the top
  const fit=(ta,h)=>{ const y=sc?sc.scrollTop:0; ta.style.height='auto'; ta.style.height=h()+'px'; if(sc) sc.scrollTop=y; };
  const growT=()=>fit(ti,()=>ti.scrollHeight); growT();
  // The lists behind show the new title as it is typed; no render here, which would rebuild this screen under the finger
  const showTitle=()=>{ document.querySelectorAll('.row[data-id="'+id+'"] .row-title').forEach(e=>e.textContent=x.title||'Sin título');
    document.querySelectorAll('.wcard[data-id="'+id+'"] .t').forEach(e=>{ const n=[...e.childNodes].find(c=>c.nodeType===3); if(n) n.nodeValue=x.title; }); };
  // The title is required: an empty field never reaches the data, and on leaving it the last title comes back
  ti.addEventListener('input',()=>{ const v=ti.value.replace(/\n/g,' '); if(v.trim()){ saveEdit(x,{title:v}); showTitle(); } growT(); });
  ti.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ti.blur(); } });
  ti.addEventListener('blur',()=>{ const v=ti.value.replace(/\n/g,' ').trim(); if(v&&v!==x.title){ x.title=v; x.modified=new Date().toISOString(); save(); showTitle(); } else flushEdits(); if(ti.value!==x.title){ ti.value=x.title; growT(); } });
  const grow=()=>fit(no,()=>Math.max(100, no.scrollHeight+2)); grow();
  // The link and phone chips under the notes follow what is typed, a moment after the last key; only the strip changes
  let lt=null; const refreshLinks=()=>{ const ls=detailLinks(x.notes); let box=$('.links',el); const cur=box?[...box.querySelectorAll('a')].map(a=>a.getAttribute('href')).join(' '):'';
    if(cur===ls.map(l=>l.href).join(' ')) return;
    if(!ls.length){ box.remove(); return; }
    if(!box){ if(!no.isConnected) return; box=document.createElement('div'); box.className='links'; no.closest('.cell').after(box); }
    box.innerHTML=linksHTML(ls); };
  const refreshConvert=()=>{ const old=$('.convert',el), html=convertHTML(x); if(!no.isConnected) return; if(old&&old.outerHTML===html) return; if(old) old.remove(); if(html) no.closest('.group').insertAdjacentHTML('beforeend', html); };
  no.addEventListener('input',()=>{ saveEdit(x,{notes:no.value}); grow(); clearTimeout(lt); lt=setTimeout(()=>{ refreshLinks(); refreshConvert(); }, 400); });
  no.addEventListener('blur', flushEdits);
}

/* ---------- Shared events ---------- */
function bindRows(box){
  if(!UI.select) box.querySelectorAll('.row:not(.first .row)').forEach(bindRowGestures);
  box.querySelectorAll('[data-day-head]').forEach(h=>bindLongPress(h, ()=>dayHeadMenu(h))); // R14: a long press on a day header moves its tasks
  box.querySelectorAll('.first .row').forEach(r=>{ if(r._fc) return; r._fc=1; r.addEventListener('click',e=>{ if(e.target.closest('[data-act=check]')) return; if(HELD.has(r.dataset.id)) toggleHold(r.dataset.id); else openDetail(r.dataset.id); }); }); }
function bindCommon(scr){
  scr.addEventListener('click', onClick);
  bindRows(scr);
  if(!UI.wide) scr.querySelectorAll('.vn[data-vn]').forEach(bindVnGestures);
  scr.querySelectorAll('[data-open-project]').forEach(b=>bindLongPress(b, src=>{ if(b.dataset.openProject!=='none') projectMenu(b.dataset.openProject, src); }));
  const s=$('[data-role=search]',scr); if(s) bindSearch(s, ()=>searchAround(s));
  bindBackSwipe(scr);
}
/* Search. The list follows the typing a moment after the last key, and the search field itself is never rebuilt:
   only what is around it changes (summary, filters, Cancelar and the list), so the keyboard stays open on the iPhone
   and the caret, an accent typed with a dead key or IME text being composed are never cut off. */
let searchT=null;
function bindSearch(s, around){
  s.dataset.shown=UI.query; // the query the screen around the field was drawn with
  if(s._sb) return; s._sb=1; let composing=false; // a field kept by a merge (R18) is bound once
  const go=()=>{ searchT=null; if(composing||!s.isConnected||s.closest('.hidden-tab')) return; if(UI.query===s.dataset.shown) return;
    if(!UI.query) UI.searchDone=false;
    if(around()){ s.dataset.shown=UI.query; return; }
    render(); }; // not expected: the screen has no search field where it should be
  const typed=()=>{ composing=false; UI.query=s.value; clearTimeout(searchT); searchT=setTimeout(go, 120); };
  s.addEventListener('compositionstart', ()=>{ composing=true; });
  s.addEventListener('input', e=>{ if(!e.isComposing) typed(); });
  s.addEventListener('compositionend', typed); // Chrome sends the last input of a composition before this event, still marked as composing
}
// iPhone: the Tareas screen is merged around the live field (R18): rows that still match stay where they are, the others go,
// and the summary, filters, Cancelar and the count follow; the field is never touched
function searchAround(s){ return drawing(()=>searchAroundNow(s)); }
function searchAroundNow(s){ const bar=s.closest('.searchbar'), sc=bar&&bar.parentElement, scr=sc&&sc.closest('.screen.root'); if(!scr||!sc.classList.contains('scroll')) return false;
  const html=lazyRows(viewTareas(), sc.scrollTop, innerHeight), stash=rowStash; if(!morphInto(scr, html, {keep:s})||!s.isConnected||!sc.isConnected) return false; rowStash=stash;
  armRows(sc); delete scr.dataset.dirty; scr.dataset.ver=dataVer;
  if(openRow&&!openRow.isConnected) openRow=null;
  bindRows(sc); const pc=sc.querySelector('.pchips'); if(pc) chipInView(pc);
  return true; }
function onClick(e){
  const scr=e.currentTarget;
  const entry=UI.wide?null:UI.stack.find(x=>x.el===scr); if(!UI.wide&&scr.classList.contains('pushed-screen')&&!entry) return; // a popped screen still sliding out takes no taps
  const f=e.target.closest('[data-filter]'); if(f){ DB.settings.filter=f.dataset.filter; UI.sumFilter=null; if(UI.wide) UI.deskView=f.dataset.filter; save(); render(); return; }
  const sm=e.target.closest('[data-sum]'); if(sm){ const k=sm.dataset.sum; UI.sumFilter=(k==='all'||UI.sumFilter===k)?null:k; haptic(6); render(); return; }
  const th=e.target.closest('button[data-theme]'); if(th){ DB.settings.theme=th.dataset.theme; save(); applyTheme(); render(); return; } // only the Tema buttons: <html> carries data-theme too
  const op=e.target.closest('[data-open-project]'); if(op){ if(UI.wide){ setDeskView('project:'+op.dataset.openProject); } else push('project', op.dataset.openProject); return; }
  const dv=e.target.closest('[data-view]'); if(dv){ setDeskView(dv.dataset.view); return; }
  const wk=e.target.closest('[data-week]'); if(wk){ calNav(wk.dataset.week); return; }
  const cv=e.target.closest('[data-cal-view]'); if(cv){ if(UI.deskView!==cv.dataset.calView) setDeskView(cv.dataset.calView); return; } // R19, R20: Día, Semana, Mes
  const cm=e.target.closest('[data-cal-mode]'); if(cm){ if(calMode()!==cm.dataset.calMode){ DB.settings.calMode=cm.dataset.calMode; save(); render(); } return; } // Lista or Horas
  const ow=e.target.closest('[data-open-week]'); if(ow){ openCalWeek(ow.dataset.openWeek); return; }
  const od=e.target.closest('[data-open-day]'); if(od){ openCalDay(od.dataset.openDay); return; }
  const mn=e.target.closest('[data-mini]'); if(mn){ openCalWeek(mn.dataset.mini); return; } // the sidebar's mini month
  const mc=e.target.closest('.minical [data-cal]'); if(mc){ UI.miniYM=shiftMonth(UI.miniYM||calAnchor().slice(0,7), +mc.dataset.cal); render(); return; }
  const wa=e.target.closest('[data-add-date]'); if(wa){ addSheet(wa.dataset.project||null,'',{date:wa.dataset.addDate}); return; } // R14: a day header in a project adds to that project
  const es=e.target.closest('[data-edit-space]'); if(es){ spaceSheet(es.dataset.editSpace); return; }
  const rb=e.target.closest('[data-restore]'); if(rb){ restoreBackup(rb.dataset.restore); return; }
  const ua=e.target.closest('[data-unarchive]'); if(ua){ const p=proj(ua.dataset.unarchive); p.archived=false; p.modified=new Date().toISOString(); save(); render(); return; }
  const pf=e.target.closest('[data-pf]'); if(pf){ const v=pf.dataset.pf; UI.projFilter=(v===''||UI.projFilter===v)?null:v; haptic(4); render(); return; }
  const va=e.target.closest('[data-vact]'); if(va){ const el=va.closest('.vn'); const vid=el&&el.dataset.vn; closeVn(el); if(va.dataset.vact==='del') deleteVoiceNote(vid); else editVoiceNote(vid); return; }
  const vnEl=e.target.closest('.vn[data-vn]'); if(vnEl&&!e.target.closest('a')){ if(vnEl.dataset.open){ closeVn(vnEl); return; } if(UI.wide) voiceNoteMenu(vnEl.dataset.vn, e); return; }
  if(UI.select){ const row=e.target.closest('.row'); if(row && !row.closest('.first')){ toggleSelected(row); return; } }
  if(UI.wide){ const row=e.target.closest('.main .mbody .row[data-id]'); if(row && deskRowClick(e, row)) return; } // R16: Comando, Mayúsculas or the selection mode
  const act=e.target.closest('[data-act]'); if(!act) { const row=e.target.closest('.row');
    if(row && row.closest('.first')){ if(UI.wide){ if(HELD.has(row.dataset.id)) toggleHold(row.dataset.id); else openDetail(row.dataset.id); } return; } // on the iPhone bindCommon opens "Lo primero" rows; the desktop has only this handler
    if(row) { if(row.dataset.open==='1'){ closeRow(row); return; } if(HELD.has(row.dataset.id)){ toggleHold(row.dataset.id); return; } openDetail(row.dataset.id); } return; } // a tap on a marked row unmarks it
  const row=act.closest('.row'); const a=act.dataset.act;
  const detailId = UI.wide ? detailTaskId() : (entry&&entry.kind==='detail'?entry.id:null); // the task of the screen that was tapped, not of the stack top
  switch(a){

    case 'tomorrow': { const id=row.dataset.id; releaseHold(id); closeRow(row); leaveRows(id); setTimeout(()=>{ tomorrowTask(id); renderAnimated(); },200); break; }
    case 'delete': if(row){ closeRow(row); confirmDelete(row.dataset.id); } else if(detailId){ confirmDelete(detailId, closeDetailOf(detailId)); } break;
    case 'clearSearch': UI.query=''; UI.searchDone=false; render(); break;
    case 'selDone': endSelect(); break;
    case 'closeDay': closeDaySheet(); break;
    case 'plan': planStart(); break;
    case 'review': reviewStart('carried'); break;
    case 'viewMenu': viewMenu(act); break;
    case 'exportCSV': exportCSV(); break;
    case 'selAll': selectAllVisible(); break;
    case 'bulkComplete': bulkComplete(); break;
    case 'bulkPostpone': bulkPostponeSheet(act); break;
    case 'bulkMove': bulkMoveSheet(act); break;
    case 'bulkDelete': bulkDelete(); break;
    case 'bulkDate': bulkDateMenu(act); break; // R16, desktop pane

/* Month calendar, Monday first. R14: a day's load of pending tasks shows as one, two or three dots (1 or 2, 3 to 5, 6 or more) */
// opts.mini (R19, the sidebar): every day can be clicked (data-mini) and takes a dropped task (data-day); opts.range marks the days the calendar shows
function calendarHTML(ym, sel, opts){ const mini=!!(opts&&opts.mini), rg=opts&&opts.range;
  const [y,m]=ym.split('-').map(Number); const t=todayStr(); const startDow=(new Date(y,m-1,1).getDay()+6)%7;
  const days=new Date(y,m,0).getDate(), prevDays=new Date(y,m-1,0).getDate();
  const load=new Map(); spaceTasks().forEach(x=>{ if(x.status==='pending'&&x.date) load.set(x.date, (load.get(x.date)||0)+1); });
  const dots=ds=>{ const n=load.get(ds)||0; return n?'<i class="ld">'+'<b></b>'.repeat(n<3?1:n<6?2:3)+'</i>':''; };
  let cells=''; const total=Math.ceil((startDow+days)/7)*7;
  for(let i=0;i<total;i++){ const n=i-startDow+1; let yy=y,mm=m,dd=n,other=false; if(n<1){ other=true; mm=m-1; dd=prevDays+n; if(mm<1){ mm=12; yy--; } } else if(n>days){ other=true; mm=m+1; dd=n-days; if(mm>12){ mm=1; yy++; } }
    const ds=yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    cells+='<button class="cal-d'+(other?' other':'')+(ds<t?' past':'')+(ds===t?' today':'')+(ds===sel?' sel':'')+(rg&&ds>=rg[0]&&ds<=rg[1]?' inr':'')+'"'+(mini?' data-mini="'+ds+'" data-day="'+ds+'"':ds<t?' disabled':' data-d="'+ds+'"')+'><span>'+dd+'</span>'+dots(ds)+'</button>'; } // a past day cannot be picked: no task is ever overdue (decision 8.5)
  const name=MESES_FULL[m-1]; return '<div class="cal'+(mini?' mini':'')+'"><div class="cal-head"><button data-cal="-1" aria-label="Mes anterior">'+I.back+'</button><span>'+name[0].toUpperCase()+name.slice(1)+' '+y+'</span><button data-cal="1" aria-label="Mes siguiente">'+I.chev+'</button></div><div class="cal-grid">'+['L','M','X','J','V','S','D'].map(d=>'<div class="cal-dow">'+d+'</div>').join('')+cells+'</div></div>';
}
function shiftMonth(ym, d){ let [y,m]=ym.split('-').map(Number); m+=d; if(m<1){ m=12; y--; } if(m>12){ m=1; y++; } return y+'-'+String(m).padStart(2,'0'); }

function reminderSheet(id, src){ const x=task(id); if(!x) return; const t=todayStr(); const pad=n=>String(n).padStart(2,'0');

/* Plan the undated tasks one by one */
function planStart(){ let ids=pendingFor('todas').filter(x=>!x.date); if(UI.projFilter!==null) ids=ids.filter(x=> UI.projFilter==='none' ? !x.projectId : x.projectId===UI.projFilter); ids=ids.map(x=>x.id); if(!ids.length) return; planStep(ids, 0, {done:0, skipped:0}); }
function planEnd(st){ renderAnimated(); toast(st.done+(st.done===1?' planificada':' planificadas')+(st.skipped?', '+st.skipped+(st.skipped===1?' saltada':' saltadas'):'')); log('info','Planificar sin fecha', st); }
function planStep(ids, i, st){
  if(i>=ids.length){ sheetOnClose=null; closeSheet(); planEnd(st); return; }
  const x=task(ids[i]); if(!x){ planStep(ids, i+1, st); return; }
  const t=todayStr(); const dow=new Date(t+'T00:00:00').getDay(); const chips=[[t,'Hoy'],[addDays(t,1),'Mañana']]; if(dow>=1&&dow<=4) chips.push([nextWeekday(5,true),'Este viernes']); chips.push([nextWeekday(1,true),'Próxima semana']);

  openSheet('<h2>Planificar</h2><div class="hint" style="margin-top:-6px">'+(i+1)+' de '+ids.length+(p?', '+esc(p.name):'')+'</div><div class="plan-title">'+esc(x.title)+'</div><div class="chips" style="margin-top:0">'+uniqueBy(chips, c=>c[0]).map(c=>'<button class="chip" data-d="'+c[0]+'">'+c[1]+'</button>').join('')+'</div><div id="calwrap">'+calendarHTML(ym, null)+'</div><div class="sheet-actions"><button class="btn" data-x="skip">Saltar</button><button class="btn" data-x="end">Terminar</button></div>', s=>{
    sheetOnClose=()=>{ st.skipped+=ids.length-i; planEnd(st); }; // closed with a tap outside or a drag: as Terminar
    s.onclick=e=>{ const nav=e.target.closest('[data-cal]'); if(nav){ ym=shiftMonth(ym,+nav.dataset.cal); $('#calwrap',s).innerHTML=calendarHTML(ym, null); return; }
      const d=e.target.closest('[data-d]'); if(d){ updTask(x.id,{date:d.dataset.d}); st.done++; haptic(6); render(); planStep(ids, i+1, st); return; } // the list behind stays current

}

/* Voice note.
   Primary route: the iOS keyboard dictation, typing into a focused textarea.
   SpeechRecognition is only offered in a browser tab where it is known to work;
   in standalone (home screen) mode Safari refuses it, so it is not shown. */
let stopRec=null;
const isStandalone = () => { try{ return navigator.standalone===true || matchMedia('(display-mode: standalone)').matches; }catch(e){ return false; } };
function voiceSheet(id, editId){ if(!task(id)) return; // a note always belongs to an existing task
  const editing=editId?DB.voiceNotes.find(v=>v.id===editId):null; if(editId&&!editing) return;
  const SR = (!isStandalone() && (window.SpeechRecognition||window.webkitSpeechRecognition)) || null; let rec=null, recording=false, final='', sess=0; // sess: only the newest recognizer may touch the text
  const kbHint = UI.wide ? 'El dictado no está disponible en este navegador. Escribe la nota.' : 'Toca el micrófono del teclado para dictar. Revisa el texto y guarda.'; // a desktop has no keyboard mic
  const errHint = UI.wide ? kbHint : 'El dictado automático no está disponible. Usa el micrófono del teclado.';
  openSheet(sheadHTML(editing?'Editar nota':'Nota de voz',editing?'Cancelar':'Descartar','Guardar')+(SR?'<button class="mic" data-x="mic" aria-label="Grabar">'+I.mic+'</button>':'')+'<div class="hint">'+(editing?(SR?'Corrige el texto o toca el micrófono para dictar de nuevo':(UI.wide?'Corrige el texto y guarda.':'Corrige el texto, o toca Volver a dictar y usa el micrófono del teclado.')):(SR?'Toca para empezar a dictar':kbHint))+'</div><textarea placeholder="El texto aparecerá aquí" enterkeyhint="done">'+(editing?esc(editing.text):'')+'</textarea>'+(editing?'<button class="btn slim" data-x="redo">Volver a dictar</button>':''), s=>{
    const ta=$('textarea',s), mic=$('.mic',s), hint=$('.hint',s);
    if(editing){ ta.setSelectionRange(ta.value.length, ta.value.length); }
    // Focus synchronously inside the tap handler: iOS only opens the keyboard then.
    if(!SR) ta.focus();
    const fallback=msg=>{ if(mic) mic.style.display='none'; hint.textContent=msg||kbHint; ta.focus(); };
    const stop=()=>{ recording=false; mic&&mic.classList.remove('rec'); try{ rec&&rec.stop(); }catch(e){} rec=null; if(SR&&mic&&mic.style.display!=='none') hint.textContent='Revisa el texto y guarda'; };
    // Each recognizer's handlers act only while it is the newest one: a stopped engine's late result or end must not double the text or restart the new one
    const start=()=>{ const my=++sess; try{ const r=rec=new SR(); r.lang='es-ES'; r.continuous=true; r.interimResults=true; final=ta.value?ta.value+' ':'';
      r.onresult=ev=>{ if(my!==sess) return; let interim=''; for(let i=ev.resultIndex;i<ev.results.length;i++){ const x=ev.results[i]; if(x.isFinal) final+=x[0].transcript+' '; else interim+=x[0].transcript; } ta.value=(final+interim).trim(); };
      r.onerror=e=>{ if(my!==sess) return; const er=e&&e.error; if(er==='no-speech') return; if(er==='aborted'){ if(recording) stop(); return; } // silence or an interruption are routine: the mic stays
        stop(); fallback(errHint); };
      r.onend=()=>{ if(my===sess&&recording){ try{ r.start(); }catch(e){ stop(); fallback(); } } };
      r.start(); recording=true; mic.classList.add('rec'); hint.textContent='Escuchando. Toca para parar'; haptic(10); }catch(e){ stop(); fallback(); } };
    stopRec=stop;
    ta.addEventListener('input',()=>{ sess++; if(recording) stop(); }); // a hand edit pauses dictation and wins over any late result; the next tap on the mic goes on from the edited text
    const saveNote=()=>{ const t=ta.value.trim(); if(!t){ ta.focus(); return false; } if(!task(id)) return true;
      if(editing){ const cur=DB.voiceNotes.find(v=>v.id===editing.id); if(!cur) return true; if(cur.text===t) return true; const prev={text:cur.text, modified:cur.modified};
        cur.text=t; cur.modified=new Date().toISOString(); updTask(id,{}); haptic(8); log('info','Nota de voz editada');
        setTimeout(()=>toast('Nota de voz editada', ()=>{ const v=DB.voiceNotes.find(x=>x.id===editing.id); if(!v) return; v.text=prev.text; if(prev.modified) v.modified=prev.modified; else delete v.modified; save(); render(); }),0); return true; }
      DB.voiceNotes.push({id:uid(), taskId:id, text:t, created:new Date().toISOString()}); updTask(id,{}); haptic(8); return true; };
    s.onclick=e=>{ const b=e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='mic'){ recording?stop():start(); return; }
      if(b.dataset.x==='redo'){ ta.value=''; ta.focus(); if(SR&&!recording) start(); return; } // focus inside the tap so iOS opens the keyboard
      stop();
      if(b.dataset.x==='ok'){ if(!saveNote()) return; }
      closeSheet(); render(); };
  });
}

async function shareTask(id){ const t=shareText(id); if(!t) return; try{ if(navigator.share){ await navigator.share({title:task(id).title, text:t}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } copyText(t,'Texto copiado. Pégalo en Claude, WhatsApp o Mail.'); }
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg||'Copiado'); }catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); // iOS selects only through setSelectionRange
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e2){} ta.remove(); if(ok) toast(msg||'Copiado'); else { log('error','No se pudo copiar al portapapeles', e&&e.name); toast('No se pudo copiar'); } } } // execCommand returns false, without throwing, when the copy is refused

/* Local backups: one snapshot per day in IndexedDB, last seven kept. A safety net until the sync exists. */
const BK = {
  // Version 2 keeps a small 'meta' record (date, counts) next to each snapshot: listing the copies never reads the snapshots themselves,
  // which hold all the data seven times over. The upgrade writes the records of the copies already kept.
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('tareas-backups',2);
    r.onupgradeneeded=()=>{ const db=r.result, tx=r.transaction; const snaps=db.objectStoreNames.contains('snapshots')?tx.objectStore('snapshots'):db.createObjectStore('snapshots',{keyPath:'date'});
      if(!db.objectStoreNames.contains('meta')){ const meta=db.createObjectStore('meta',{keyPath:'date'}); snaps.openCursor().onsuccess=e=>{ const c=e.target.result; if(!c) return; meta.put(BK.metaOf(c.value)); c.continue(); }; } };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  metaOf(x){ const d=x.data||{}; return {date:x.date, created:x.created, tasks:(d.tasks||[]).length, projects:(d.projects||[]).length}; },
  async tx(mode, fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction(['snapshots','meta'],mode); const out=fn(t.objectStore('snapshots'), t.objectStore('meta')); t.oncomplete=()=>{ db.close(); res(out&&out.result!==undefined?out.result:out); }; t.onerror=()=>{ db.close(); rej(t.error); }; }); },
  async list(){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('meta','readonly'); const r=t.objectStore('meta').getAll(); r.onsuccess=()=>{ db.close(); res((r.result||[]).sort((a,b)=>a.date<b.date?1:-1)); }; r.onerror=()=>{ db.close(); rej(r.error); }; }); },
  async get(date){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('snapshots','readonly'); const r=t.objectStore('snapshots').get(date); r.onsuccess=()=>{ db.close(); res(r.result); }; r.onerror=()=>{ db.close(); rej(r.error); }; }); },
  async put(date){ const snap={date, created:new Date().toISOString(), data:exportData()}; await this.tx('readwrite', (st,meta)=>{ st.put(snap); meta.put(BK.metaOf(snap)); });
    const old=(await this.list()).slice(7); if(old.length) await this.tx('readwrite', (st,meta)=>{ old.forEach(b=>{ st.delete(b.date); meta.delete(b.date); }); }); }
};
let BACKUPS=[];
async function refreshBackups(){ try{ BACKUPS=await BK.list(); }catch(e){ BACKUPS=[]; } }
// Ajustes is on screen: the desktop settings view, or the iPhone tab with nothing pushed on top
function onSettings(){ return UI.wide ? UI.deskView==='settings' : (UI.tab==='ajustes'&&!UI.stack.length); }
async function dailyBackup(force){ try{ const t=todayStr(); if(force || !BACKUPS.some(b=>b.date===t)){ await BK.put(t); await refreshBackups(); log('info', force?'Copia local creada':'Copia local diaria', {date:t, tasks:DB.tasks.length}); if(onSettings()) render(); } }catch(e){ log('warn','Copia local no disponible: '+(e&&e.message||e)); } }
function restoreBackup(date){ const b=BACKUPS.find(x=>x.date===date); if(!b) return;
  const when = date===todayStr()?'de hoy':date===addDays(todayStr(),-1)?'de ayer':'del '+fmtDate(date);

      log('info','Copia restaurada', {date, tasks:DB.tasks.length}); toast('Copia '+when+' restaurada', ()=>{ Object.assign(DB, prev); DB.settings.activeSpace=prevActive; save(); });

/* Export and import */
function exportData(){ return { app:'tareas', version:APP_VERSION, exported:new Date().toISOString(), spaces:DB.spaces, projects:DB.projects, tasks:DB.tasks, voiceNotes:DB.voiceNotes }; }
function exportJSON(){ const t=JSON.stringify(exportData(),null,2); if(navigator.share){ navigator.share({title:'Tareas (copia)', text:t}).catch(()=>copyText(t,'Copia JSON en el portapapeles')); } else copyText(t,'Copia JSON en el portapapeles'); }
// CSV for Excel in Spanish locales: semicolon separated, UTF-8 with BOM, one row per task.
// A cell that starts with = + - or @ gets a leading apostrophe: Excel runs it as a formula even when quoted.
function csvText(){ const q=v=>{ let s=String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' '); if(/^[=+\-@\t\r]/.test(s)) s="'"+s; return '"'+s+'"'; }; const sp=Object.fromEntries(DB.spaces.map(s=>[s.id,s.name])); const pr={high:'Alta',mid:'Media',none:''};
  const head=['Espacio','Proyecto','Título','Fecha','Prioridad','Estado','Completada','Recordatorio','Aplazada','Notas','Notas de voz','Creada'];
  const rows=DB.tasks.slice().sort((a,b)=>(a.spaceId+(a.date||'9999')+a.created)<(b.spaceId+(b.date||'9999')+b.created)?-1:1).map(x=>{ const p=x.projectId?proj(x.projectId):null; const vn=DB.voiceNotes.filter(v=>v.taskId===x.id).map(v=>v.text).join(' | ');
    return [sp[x.spaceId]||'', p?p.name:'', x.title, x.date||'', pr[x.priority]||'', x.status==='done'?'Hecha':'Pendiente', x.completed?localDay(x.completed)+' '+fmtTime(x.completed):'', x.reminder?localDay(x.reminder)+' '+fmtTime(x.reminder):'', x.carried?'Sí':'', x.notes||'', vn, localDay(x.created)].map(q).join(';'); });
  return '﻿'+head.map(q).join(';')+'\r\n'+rows.join('\r\n')+'\r\n'; }
async function exportCSV(){
  const name='tareas-'+todayStr()+'.csv'; const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'});
  try{ const file=new File([blob],name,{type:'text/csv'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Tareas'}); log('info','Exportado CSV (compartir)',name); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; log('warn','Compartir CSV no disponible: '+(e&&e.message||e)); }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Archivo '+name+' generado'); log('info','Exportado CSV (descarga)',name); }
  catch(e){ log('error','Exportar CSV falló: '+(e&&e.message||e)); copyText(csvText(),'CSV copiado al portapapeles'); }
}
async function exportFile(){
  const name='tareas-'+todayStr()+'.json'; const text=JSON.stringify(exportData(),null,2); const blob=new Blob([text],{type:'application/json'});
  try{ const file=new File([blob],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Tareas'}); log('info','Exportado a archivo (compartir)',name); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; log('warn','Compartir archivo no disponible: '+(e&&e.message||e)); }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Archivo '+name+' generado'); log('info','Exportado a archivo (descarga)',name); }
  catch(e){ log('error','Exportar a archivo falló: '+(e&&e.message||e)); exportJSON(); }
}
// Merge an exported copy: unknown ids are added, known ids are replaced when the copy is newer.
function importData(text){
  const d=JSON.parse(text); if(!d||typeof d!=='object') throw new Error('Formato no reconocido');
  let added=0, updated=0;
  const merge=(arr,src)=>{ (Array.isArray(src)?src:[]).forEach(it=>{ if(!it||!it.id) return; const i=arr.findIndex(a=>a.id===it.id); if(i<0){ arr.push(it); added++; } else if((it.modified||'')>(arr[i].modified||'')){ arr[i]=it; updated++; } }); };
  merge(DB.spaces,d.spaces); merge(DB.projects,d.projects); merge(DB.tasks,d.tasks); merge(DB.voiceNotes,d.voiceNotes);
  DB.tasks.forEach(x=>{ if(x.carried===undefined) x.carried=false; });
  save(); rollOver(); log('info','Importación', {added, updated, spaces:(d.spaces||[]).length, projects:(d.projects||[]).length, tasks:(d.tasks||[]).length});
  return {added, updated};
}
function importSheet(){ openSheet(sheadHTML('Importar texto','Cancelar','Importar')+'<div class="hint">Pega aquí una copia exportada.</div><textarea placeholder="{ ... }"></textarea>', s=>{ const ta=$('textarea',s); ta.focus(); s.onclick=e=>{ const b=e.target.closest('[data-x]'); if(!b) return; if(b.dataset.x==='cancel'){ closeSheet(); return; } try{ const r=importData(ta.value); closeSheet(); render(); toast(r.added+' nuevos, '+r.updated+' actualizados'); }catch(err){ log('warn','Importar texto: '+err.message); toast('El texto no es un JSON válido'); } }; }); }
function pickImportFile(){
  let inp=$('#importFile'); if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='importFile'; inp.accept='application/json,.json,text/plain'; inp.style.cssText='position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0'; document.body.appendChild(inp); }
  inp.value=''; inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const r=importData(rd.result); render(); toast(r.added+' nuevos, '+r.updated+' actualizados'); }catch(err){ log('warn','Importar archivo '+f.name+': '+err.message); toast('El archivo no es una copia válida'); } }; rd.onerror=()=>{ log('error','No se pudo leer '+f.name); toast('No se pudo leer el archivo'); }; rd.readAsText(f); };
  inp.click();
}

/* Test data: about 150 tasks in invented projects, all ids prefixed "demo-" so they can be removed cleanly */
const demoCount = () => DB.tasks.filter(x=>String(x.id).startsWith('demo-')).length;
function generateDemo(){
  let seed=20261031; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; const pick=a=>a[Math.floor(rnd()*a.length)];
  const batch=Date.now().toString(36); const sp=space().id; const now=new Date(); const t=todayStr();
  const projNames=[['Cliente FLC',0],['Verifactu',4],['Cash Application',3],['Propuesta Iberdrola',5],['Formación del equipo',6],['Administración',7]];
  const projects=projNames.map((pn,i)=>({id:'demo-p-'+batch+'-'+i, spaceId:sp, name:pn[0], color:COLORS[pn[1]], order:DB.projects.length+i, archived:false, created:now.toISOString(), modified:now.toISOString()}));
  const verbs=['Preparar','Revisar','Enviar','Cerrar','Actualizar','Llamar a','Validar','Redactar','Planificar','Documentar','Confirmar','Analizar'];
  const objs=['comité de seguimiento','SOW con legal','acta del steering','plan de cutover','RAID log','Marta por el presupuesto','mapping de Verifactu','propuesta de fase 2','sesión de formación','backlog de defectos','escenarios de prueba UAT','calendario de go-live','informe de horas','presentación a dirección','integración con BTP','matriz de riesgos','contrato marco','facturas pendientes','ampliación del equipo','notas del taller'];
  const noteTexts=['Pendiente de la respuesta del cliente.','Revisar con el equipo antes del jueves.','Incluye los cambios acordados en la última reunión.','Ver correo de ayer con el detalle.',''];
  const tasks=[], vnotes=[];
  for(let i=0;i<150;i++){
    const r=rnd(); let date=null; if(r<0.2) date=addDays(t,-1-Math.floor(rnd()*10)); else if(r<0.5) date=t; else if(r<0.8) date=addDays(t,1+Math.floor(rnd()*30));
    const pr=rnd(); const priority=pr<0.15?'high':pr<0.4?'mid':'none';
    const done=rnd()<0.2; const created=new Date(now.getTime()-Math.floor(rnd()*40)*864e5).toISOString();
    const completed=done?new Date(now.getTime()-Math.floor(rnd()*25)*864e5).toISOString():null;
    const projectId=rnd()<0.85?pick(projects).id:null;
    let reminder=null; if(!done&&rnd()<0.1){ const d=new Date(now.getTime()+Math.floor(rnd()*72)*36e5); d.setMinutes(0,0,0); reminder=d.toISOString(); }
    const id='demo-t-'+batch+'-'+i;
    tasks.push({id, title:pick(verbs)+' '+pick(objs), spaceId:sp, projectId, date, reminder, priority, status:done?'done':'pending', notes:pick(noteTexts), carried:false, created, modified:created, completed});
    if(rnd()<0.06) vnotes.push({id:'demo-v-'+batch+'-'+i, taskId:id, text:'Nota dictada de prueba: '+pick(noteTexts.filter(Boolean)), created});
  }
  DB.projects.push(...projects); DB.tasks.push(...tasks); DB.voiceNotes.push(...vnotes); save(); const n=rollOver(); render(); haptic(8);
  log('info','Datos de prueba generados', {projects:projects.length, tasks:tasks.length, voiceNotes:vnotes.length, rolledOver:n});
  toast(tasks.length+' tareas de prueba en '+projects.length+' proyectos');
}
function clearDemo(){
  const n=demoCount(); if(!n){ toast('No hay datos de prueba'); return; }
  confirmSheet('Eliminar '+n+' tareas de prueba', 'Se eliminan solo los elementos marcados como prueba. Tus datos no se tocan.', ()=>{
    const isDemo=x=>String(x.id).startsWith('demo-');
    DB.tasks=DB.tasks.filter(x=>!isDemo(x)); DB.projects=DB.projects.filter(x=>!isDemo(x)); DB.voiceNotes=DB.voiceNotes.filter(x=>!isDemo(x));
    // Your own tasks filed in a test project stay, with no project; notes of removed tasks go with them
    const pids=new Set(DB.projects.map(p=>p.id)), tids=new Set(DB.tasks.map(x=>x.id)), now=new Date().toISOString(); let moved=0;
    DB.tasks.forEach(x=>{ if(x.projectId&&!pids.has(x.projectId)){ x.projectId=null; x.modified=now; moved++; } });
    const vn=DB.voiceNotes.length; DB.voiceNotes=DB.voiceNotes.filter(v=>tids.has(v.taskId));
    save(); render(); haptic(10);
    log('info','Datos de prueba eliminados', {tasks:n, unfiled:moved, voiceNotes:vn-DB.voiceNotes.length}); toast('Datos de prueba eliminados');
  });
}

/* Shake to undo (optional): undoes the action whose toast is still showing */
let shakeArmed=false, lastShake=0, lastAcc=null;
function onMotion(e){ const a=e.accelerationIncludingGravity; if(!a) return; if(lastAcc){ const d=Math.abs(a.x-lastAcc.x)+Math.abs(a.y-lastAcc.y)+Math.abs(a.z-lastAcc.z); if(d>30 && Date.now()-lastShake>1200){ lastShake=Date.now(); if(undoFn && undoFn!==applyUpdate){ haptic(15); $('#toastBtn').click(); } } } lastAcc={x:a.x,y:a.y,z:a.z}; } // a shake undoes an action, never installs an update
function armShake(){ if(shakeArmed) return; shakeArmed=true; window.addEventListener('devicemotion', onMotion); }
function disarmShake(){ shakeArmed=false; window.removeEventListener('devicemotion', onMotion); }
async function toggleShake(){
  if(DB.settings.shakeUndo){ DB.settings.shakeUndo=false; save(); disarmShake(); render(); return; }

}

/* Keyboard: reposition sheets */
let kbNow=0;
// iOS 26 can shrink the whole window with the keyboard instead of the visual viewport: the page then already fits above it
const kbShrunk=()=>!UI.wide && screen.height>0 && innerHeight < screen.height*0.75 && innerWidth < screen.width+2;
if(window.visualViewport){ const vv=window.visualViewport; const f=()=>{ const kb=Math.max(0, innerHeight - vv.height - vv.offsetTop); kbNow=kb; document.documentElement.style.setProperty('--kb', kb+'px'); document.documentElement.classList.toggle('kbup', kb>=60||kbShrunk()); if(kb>=60) sheet.classList.remove('top'); }; vv.addEventListener('resize',f); vv.addEventListener('scroll',f); }
// Some iOS versions do not shrink the visual viewport of an installed web app when the keyboard opens: --kb stays 0 and a
// bottom sheet stays hidden behind the keyboard. If a field in the sheet has the focus and no keyboard has been reported
// shortly after, the sheet moves to the top of the screen. The measures are logged once per launch to tune this on the device.
let kbLogs=0;
function kbFallback(when){ if(UI.wide||!sheet.classList.contains('on')) return; const ae=document.activeElement;
  if(!ae||!sheet.contains(ae)||!/^(INPUT|TEXTAREA)$/.test(ae.tagName)||/^(date|time|datetime-local|checkbox|file)$/.test(ae.type||'')) return;
  const vv=window.visualViewport, shrunk=kbShrunk();
  document.documentElement.classList.toggle('kbup', kbNow>=60||shrunk);
  const top = when==='late' && kbNow<60 && !shrunk; // decided only once the keyboard has settled
  if(kbLogs<4){ kbLogs++; const r=sheet.getBoundingClientRect(); log('info','Teclado ('+when+'): pantalla '+screen.height+', ventana '+innerHeight+', visible '+(vv?Math.round(vv.height):'?')+', desplazado '+(vv?Math.round(vv.offsetTop):'?')+', scroll '+Math.round(scrollY)+', teclado '+Math.round(kbNow)+', hoja '+Math.round(r.top)+' a '+Math.round(r.bottom)+(top?', hoja arriba':'')); }
  if(top) sheet.classList.add('top'); }
sheet.addEventListener('focusin', ()=>{ setTimeout(()=>kbFallback('early'), 400); setTimeout(()=>kbFallback('late'), 1200); });
sheet.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(!sheet.contains(document.activeElement)){ sheet.classList.remove('top'); if(!(kbNow>=60)) document.documentElement.classList.remove('kbup'); } }, 60); });

/* Another tab or window of the app wrote the data: reload it, so this one never saves a stale copy over those changes.

    if(z.dataset.dropProject!==undefined) dropToProject(ids, z.dataset.dropProject||null); else dropMany(ids, z); }); // R16: a project of the sidebar, or a date
  // R15: the title edited in place (a double click, see deskRowClick) keeps what is typed across a redraw and keeps it when left
  d.addEventListener('input', e=>{ if(e.target.dataset.role==='rowedit'&&UI.dsel.edit) UI.dsel.edit.text=e.target.value; });
  d.addEventListener('focusout', e=>{ if(e.target.dataset.role!=='rowedit'||deskRedraw) return; setTimeout(()=>{ const a=document.activeElement; if(UI.dsel.edit&&!(a&&a.dataset&&a.dataset.role==='rowedit')) endRowEdit(true); }, 0); });
  // The Tab key onto a row selects it (a click selects it on its own)
  d.addEventListener('focusin', e=>{ const r=e.target; if(!r.classList||!r.classList.contains('row')||r.closest('.first')||deskMulti()||UI.dsel.cur===r.dataset.id||!r.matches(':focus-visible')) return; UI.dsel.cur=r.dataset.id; if(UI.deskDetail){ UI.deskDetail=r.dataset.id; deskSelPane(); } else paintSel(); });
  // Double click on an empty part of a month day adds a task with that date (a past day cannot take one)
  d.addEventListener('dblclick', e=>{ const md=e.target.closest('.mday'); if(!md||e.target.closest('.wcard,button')) return; const day=md.dataset.day;
    if(day<todayStr()){ toast('No se puede añadir a un día pasado'); return; } addSheet(null,'',{date:day}); });
  // Week cards open the detail on click
  // R17: in a popover beside the card; a click on the card whose popover that same press closed leaves it closed (a toggle)
  d.addEventListener('click', e=>{ const sh=d._popShut; d._popShut=null; const c=e.target.closest('.wcard'); if(!c||e.target.closest('[data-act]')) return;
    if(sh&&sh.id===c.dataset.id&&Date.now()-sh.t<800) return; openDetail(c.dataset.id); });
}
document.addEventListener('keydown', e=>{ if(!UI.wide) return; const tag=(e.target.tagName||'').toLowerCase(); const typing=tag==='input'||tag==='textarea'||tag==='select'||!!e.target.isContentEditable;
  const modal=sheet.classList.contains('on')||asheet.classList.contains('on')||menuOpen();
  // R15: the title edited in its row: Intro keeps it, Esc gives it back
  if(e.target.dataset&&e.target.dataset.role==='rowedit'){ const ed=UI.dsel.edit, id=ed&&ed.id;
    if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); endRowEdit(true); render(); revealRow(id); }
    else if(e.key==='Escape'){ e.preventDefault(); endRowEdit(false); revealRow(id); } return; }
  if(e.key==='Escape'){ if(menuOpen()){ closeMenu(); return; } if(modal){ if(asheet.classList.contains('on')) cancelAction(); else closeSheet(); return; } // a menu over a sheet closes alone
    if(typing && e.target.dataset.role==='search' && UI.query){ e.preventDefault(); UI.query=''; UI.searchDone=false; render(); return; } // Escape in the search clears it first; render keeps the focus there
    if(deskMulti()||UI.dsel.ids.size){ endSelect(); revealRow(UI.dsel.cur); return; } // R16: the multiple selection goes first
    if(UI.deskDetail){ const f=!typing; pop(); if(f) revealRow(UI.dsel.cur); } else if(UI.query){ UI.query=''; UI.searchDone=false; render(); } return; }
  if(modal||typing) return; // N, / and the keys below never reach the page behind a menu or a sheet, nor a field being typed in
  const k=e.key, mod=e.metaKey||e.ctrlKey;
  if(mod){ if(e.altKey||e.shiftKey) return; // the browser keeps its own (Comando L, T, W, R...); only these two are the app's
    if(k==='z'||k==='Z'){ if(undoFn&&$('#toast').classList.contains('on')){ e.preventDefault(); $('#toastBtn').click(); } return; } // R15: the last action's Deshacer
    if((k==='a'||k==='A')&&deskListView()){ e.preventDefault(); selectAllDesk(); } return; }
  if(e.altKey) return;
  // Space and Intro on a focused button or control are that control's own
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button,a,select,summary,[role=button],[role=radio],.gtap')) return;
  if(k==='n'||k==='N'){ const ab=$('#desk [data-role=addbar]'); if(ab){ e.preventDefault(); ab.focus(); } return; }
  if(k==='/'){ const s=$('#desk [data-role=search]'); if(s){ e.preventDefault(); s.focus(); } return; }
  if(k==='?'){ e.preventDefault(); shortcutsSheet(); return; }
  // R15: the selected row moves with the arrows (J and K too); with Mayúsculas the selection stretches
  if(k==='ArrowDown'||k==='ArrowUp'||(!e.shiftKey&&(k==='j'||k==='k'))){ if(!deskListView()) return; e.preventDefault(); moveSel(k==='ArrowDown'||k==='j'?1:-1, e.shiftKey); return; }
  if(k===' '){ if(!deskListView()&&!UI.deskDetail) return; e.preventDefault(); togglePane(); return; }
  if(k==='Enter'){ const id=UI.dsel.cur; if(id&&deskRow(id)&&!deskMulti()){ e.preventDefault(); startRowEdit(id); } return; }
  if(e.shiftKey&&k.length===1&&!/[A-Z]/.test(k)) return; // a shifted symbol is not one of the keys
  if(/^[chmvsfp120]$/i.test(k)||k==='Delete'||k==='Backspace'){ if(deskShortcut(k)) e.preventDefault(); } });
// A project group header (R13) is a div with the button role: Enter and Space act on it as on a button
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('gtap')){ e.preventDefault(); e.target.click(); } });
wideMQ.addEventListener('change', applyWide); // first applied at start, before the first render

/* ---------- Service worker: offline cache and update notice ---------- */
function applyUpdate(){ if(!pendingSW) return; updateRequested=true; toast('Actualizando'); log('info','Actualización aplicada por el usuario'); pendingSW.postMessage({type:'SKIP_WAITING'}); }
if('serviceWorker' in navigator){
  let reloading=false;
  // Offer the update until it is applied: on install, on every return to the app and from Settings.
  let offerLater=null;
  const offerUpdate = sw => { if(pendingSW!==sw) log('info','Nueva versión descargada, pendiente de aplicar'); pendingSW=sw; if(onSettings()) render();
    // Never replace a live Deshacer: show the notice once that toast is gone (Ajustes offers it meanwhile)
    clearTimeout(offerLater); if(undoFn && undoFn!==applyUpdate){ offerLater=setTimeout(()=>offerUpdate(sw), 4500); return; }
    toast('Nueva versión disponible', applyUpdate, 'Actualizar'); };
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(!reg) return; // some embedded browsers resolve without a registration
    if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) offerUpdate(nw); }); });
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; reg.update().catch(()=>{}).then(()=>{ if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting); }); });
  }).catch(e=>log('error','Service worker no registrado: '+(e&&e.message||e)));
  // Reload only on an update: the first install also fires controllerchange (clients.claim) and must not flash the page.
  // Only that first claim is skipped; a later update, or any the user asked for, reloads.
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloading) return; if(!hadController && !updateRequested){ hadController=true; return; } reloading=true; location.reload(); });
}
