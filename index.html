<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="theme-color" content="#F9F9F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>Tareas</title>
<style>
:root{
  color-scheme:light;
  --bg:#F2F2F7; --card:#FFFFFF; --sep:#C6C6C8; --ink:#000000; --ink2:#8E8E93; --ink3:#AEAEB2;
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --fill:#E5E5EA; --fill2:#D1D1D6;
  --bar:rgba(249,249,249,.82); --mat:rgba(255,255,255,.88); --dim:rgba(0,0,0,.35); --press:#D9D9DE;
  --kb:0px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --sep:#38383A; --ink:#FFFFFF; --ink2:#8E8E93; --ink3:#636366;
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --fill:#2C2C2E; --fill2:#3A3A3C;
  --bar:rgba(22,22,24,.82); --mat:rgba(36,36,38,.9); --dim:rgba(0,0,0,.55); --press:#2C2C2E;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --sep:#38383A; --ink:#FFFFFF; --ink2:#8E8E93; --ink3:#636366;
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --fill:#2C2C2E; --fill2:#3A3A3C;
  --bar:rgba(22,22,24,.82); --mat:rgba(36,36,38,.9); --dim:rgba(0,0,0,.55); --press:#2C2C2E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:17px;}
html{font:-apple-system-body;} /* iOS: follow the system text size; other browsers ignore it */
html,body{margin:0;overscroll-behavior:none;}
body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1rem;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;}
input,textarea,select{font-size:max(16px,1rem);} /* under 16px Safari zooms on focus */

/* Screens */
.app{height:100%;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.32,.72,0,1);}
.app.sheet-open{transform:scale(.96);border-radius:14px;}
@media (prefers-reduced-motion: reduce){.app{transition:none;}.app.sheet-open{transform:none;}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(0,0,0);will-change:transform;}
.screen.pushed{transform:translate3d(100%,0,0);transition:transform .35s cubic-bezier(.32,.72,0,1);}
.screen.shown{transform:translate3d(0,0,0);transition:transform .35s cubic-bezier(.32,.72,0,1);}
.screen.under{transform:translate3d(-33%,0,0);transition:transform .35s cubic-bezier(.32,.72,0,1);}
.screen.dragging,.screen.dragging-under{transition:none;}
.screen.hidden-tab{display:none;}
.screen.root{touch-action:pan-y;}
.screen.pushed-screen{z-index:8;}
.screen.tabanim{transition:transform .3s cubic-bezier(.32,.72,0,1);}
@media (prefers-reduced-motion: reduce){.screen.pushed,.screen.shown,.screen.under{transition:opacity .2s;}.screen.tabanim{transition:none;}}

.nav{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:0 16px;}
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.nav-title{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:1rem;pointer-events:none;}
.nav.compact{box-shadow:0 .5px 0 var(--sep);}
.nav .title{display:flex;align-items:center;gap:6px;font-size:1.294rem;font-weight:700;letter-spacing:-.3px;height:44px;}
.nav .title svg{width:12px;height:12px;color:var(--ink3);}
.nav .title .pdot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:2px;}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:1rem;height:44px;}
.nav .back svg{width:12px;height:20px;}
.nav .action{color:var(--blue);font-size:1rem;height:44px;display:flex;align-items:center;}
.nav .action.strong{font-weight:600;}
.nav .actions{display:flex;gap:4px;margin-right:-8px;}
.nav .actions .action{width:40px;justify-content:center;}
.nav .actions svg{width:22px;height:22px;}
.cell.input{display:block;}
.cell .val.high{color:var(--red);}
.cell .val.mid{color:var(--orange);}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 120px;}

/* Day summary */
.summary{background:var(--card);border-radius:12px;padding:12px 16px 12px;margin:8px 0 12px;}
.summary-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.summary-head h3{margin:0;font-size:0.882rem;font-weight:600;color:var(--ink2);}
.summary-head button{color:var(--ink3);width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.summary-head svg{width:14px;height:14px;transition:transform .25s;}
.summary.collapsed .summary-head svg{transform:rotate(-90deg);}
.summary.collapsed .summary-body{display:none;}
.summary.collapsed{padding-bottom:12px;}
.summary.collapsed .summary-head{margin-bottom:0;}
.nums{display:flex;gap:8px;}
.first{margin-top:10px;}
.num{flex:1;border-radius:10px;padding:6px 4px;text-align:center;}
.num b{display:block;font-size:1.647rem;font-weight:700;line-height:1.1;letter-spacing:-.6px;}
.num span{font-size:0.706rem;color:var(--ink2);}
.num.red b{color:var(--red);}
.num.on{background:var(--fill);}
.num:active{opacity:.7;}
.num.orange b{color:var(--orange);}
.first h4{margin:6px 0 2px;font-size:0.765rem;color:var(--ink2);font-weight:500;}
.first .row{margin:0;}
.first .row-content{padding-left:0;}
.first .empty-line{color:var(--ink3);font-size:0.882rem;padding:8px 0 10px;}
.first .soon{display:flex;align-items:center;gap:8px;font-size:0.824rem;color:var(--ink2);padding:8px 0 6px;border-top:.5px solid var(--sep);}
.first .soon svg{width:15px;height:15px;color:var(--orange);}

/* Search and segment */
.searchbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px;}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--ink2);}
.search svg{width:16px;height:16px;flex:none;}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;height:36px;color:var(--ink);}
.search input::placeholder{color:var(--ink2);}
.searchbar .cancel{color:var(--blue);font-size:1rem;flex:none;}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px;}
.seg button{flex:1;height:28px;border-radius:7px;font-size:0.765rem;font-weight:500;color:var(--ink);}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;}
.seg button .n{font-weight:400;color:var(--ink2);margin-left:5px;font-size:.765rem;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366;}}
:root[data-theme="dark"] .seg button.on{background:#636366;}

/* Lists */
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.group-title{font-size:0.765rem;color:var(--ink2);padding:0 4px 6px;margin-top:4px;}
.row{position:relative;overflow:hidden;background:var(--card);}
.row + .row .row-content::before{content:"";position:absolute;left:50px;right:0;top:0;height:.5px;background:var(--sep);}
.first .row + .row .row-content::before{left:34px;}
.row-bg{position:absolute;inset:0;display:none;align-items:stretch;}
.row.swiping.dir-r .row-bg.left{display:flex;}
.row.swiping.dir-l .row-bg.right{display:flex;}
.row-bg.left{justify-content:flex-start;background:var(--green);}
.row-bg.right{justify-content:flex-end;background:var(--red);}
.row-bg.left span{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;color:#fff;transform:translate3d(10px,0,0) scale(.6);will-change:transform;}
.row-bg.left svg{width:24px;height:24px;}
.row.armed .row-bg.left{background:#2DBE54;}
.row.armed .row-bg.left svg{animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row.armed .row-bg.left{background:#28C250;}}
:root[data-theme="dark"] .row.armed .row-bg.left{background:#28C250;}
.row-bg.right button{width:80px;color:#fff;font-size:0.882rem;font-weight:500;}
.row-bg.right .b-tomorrow{background:var(--orange);}
.row-bg.right .b-delete{background:var(--red);}
.row-content{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 16px;min-height:52px;transition:transform .3s cubic-bezier(.32,.72,0,1);}
.row-content.drag{transition:none;}
.row.leaving .row-content{opacity:0;transform:translate3d(28px,0,0);transition:opacity .22s,transform .22s;}
.flip{transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .3s;}
.enter{opacity:0;}
.row-content:active{background:var(--press);}
.first .row-content{padding:8px 0;min-height:44px;}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s;}
.check:active{transform:scale(.88);}
.check.done{background:var(--pc,var(--blue));border-color:var(--pc,var(--blue));}
.check.done.just{animation:pop .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.check svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .28s cubic-bezier(.34,1.56,.64,1);}
.check.done svg{opacity:1;transform:scale(1);}
.row-text{flex:1;min-width:0;}
.row-title{font-size:1rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.row.done .row-title{color:var(--ink2);text-decoration:line-through;}
.row-meta{display:block;font-size:0.765rem;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px;position:relative;top:-1px;}
.row-meta .sep{color:var(--ink3);margin:0 6px;}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:0.706rem;font-weight:500;color:var(--pc);background:var(--tagbg);vertical-align:1px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@supports (color: color-mix(in srgb, red, blue)){ .tag{background:color-mix(in srgb, var(--pc) 15%, transparent);} :root[data-theme="dark"] .tag{background:color-mix(in srgb, var(--pc) 24%, transparent);} @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{background:color-mix(in srgb, var(--pc) 24%, transparent);} } }
.row-meta .over{color:var(--red);}
.row-meta .bell{display:inline-flex;align-items:center;gap:3px;}
.row-meta .bell svg{width:11px;height:11px;vertical-align:-1px;}
.pri{flex:none;font-weight:700;font-size:1rem;min-width:14px;text-align:center;letter-spacing:-1px;}
.pri.high{color:var(--red);}
.pri.mid{color:var(--orange);}
.chev{flex:none;color:var(--ink3);width:8px;height:14px;}

.empty{text-align:center;color:var(--ink2);padding:60px 20px 20px;font-size:0.882rem;}
.empty svg{width:48px;height:48px;color:var(--ink3);margin-bottom:10px;}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px;}
.empty .acts{display:flex;gap:20px;justify-content:center;margin-top:14px;}
.empty .btn-link{color:var(--blue);font-weight:600;font-size:1rem;}

.done-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 16px;font-size:0.882rem;color:var(--ink2);}
.done-toggle svg{width:12px;height:12px;transition:transform .25s;}
.done-toggle.open svg{transform:rotate(90deg);}

/* Settings cell */
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;width:100%;text-align:left;}
.cell + .cell{border-top:.5px solid var(--sep);margin-left:16px;padding-left:0;width:calc(100% - 16px);}
.cell:active{background:var(--press);}
.cell .lbl{flex:1;}
.cell .val{color:var(--ink2);display:flex;align-items:center;gap:6px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell .val .dot{width:12px;height:12px;border-radius:50%;}
.cell .chev{margin-left:2px;}
.cell .count{color:var(--ink2);background:var(--fill);border-radius:10px;padding:1px 8px;font-size:.765rem;min-width:24px;text-align:center;}
.cell.destructive{color:var(--red);justify-content:center;}
.cell.link{color:var(--blue);}
.cell input[type=text]{flex:1;background:none;border:0;outline:0;}
.cell .pdot{width:12px;height:12px;border-radius:50%;flex:none;}
.footnote{font-size:0.765rem;color:var(--ink2);padding:0 16px 14px;line-height:1.4;}

/* FAB */
.fab{position:fixed;right:20px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,122,255,.35);z-index:6;transition:transform .15s;}
.fab:active{transform:scale(.94);}
.fab svg{width:26px;height:26px;}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;z-index:7;}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:0.588rem;color:var(--ink2);height:48px;}
.tabbar button.on{color:var(--blue);}
.tabbar svg{width:24px;height:24px;}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--dim);opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px 14px 0 0;transform:translate3d(0,110%,0);transition:transform .35s cubic-bezier(.32,.72,0,1);z-index:21;padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto;}
.sheet.on{transform:translate3d(0,calc(-1 * var(--kb)),0);}
.sheet.drag{transition:none;}
.handle{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:4px auto 10px;}
.sheet h2{font-size:1rem;font-weight:600;margin:4px 0 12px;text-align:center;}
.sheet .titlein{width:100%;background:var(--bg);border:0;border-radius:10px;height:44px;padding:0 12px;outline:0;font-size:max(16px,1rem);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:0.824rem;font-weight:500;white-space:nowrap;}
.chip.on{background:var(--blue);color:#fff;}
.chip .dot{width:9px;height:9px;border-radius:50%;}
.chip svg{width:14px;height:14px;}
.sheet-actions{display:flex;gap:10px;margin-top:14px;}
.btn{flex:1;height:48px;border-radius:12px;font-size:1rem;font-weight:600;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn.primary{background:var(--blue);color:#fff;}
.btn.red{background:var(--red);color:#fff;}
.btn:disabled{opacity:.4;}
.btn svg{width:20px;height:20px;}
.sheet .list{background:var(--bg);border-radius:12px;overflow:hidden;margin-top:4px;}
.sheet .list .cell + .cell{border-top-color:var(--sep);}
.sheet .list .cell:active{background:var(--fill);}
.sheet .mic{width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;margin:10px auto;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.sheet .mic.rec{animation:pulse 1.2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.45)}100%{box-shadow:0 0 0 18px rgba(255,59,48,0)}}
.sheet .mic svg{width:34px;height:34px;}
.sheet .hint{text-align:center;color:var(--ink2);font-size:0.765rem;margin:4px 0 10px;}
.sheet textarea{width:100%;min-height:110px;background:var(--bg);border:0;border-radius:10px;padding:10px 12px;outline:0;resize:none;line-height:1.4;}
.sheet input[type=date],.sheet input[type=datetime-local]{width:100%;height:44px;background:var(--bg);border:0;border-radius:10px;padding:0 12px;outline:0;color:var(--ink);}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;}
.colors button.on{border-color:var(--ink);}

/* Action menu */
.asheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:21;transform:translate3d(0,120%,0);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.asheet.on{transform:translate3d(0,0,0);}
.asheet .grp{background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px;overflow:hidden;margin-bottom:8px;}
.asheet .grp .t{text-align:center;font-size:0.765rem;color:var(--ink2);padding:12px;border-bottom:.5px solid var(--sep);}
.asheet button.it{display:block;width:100%;height:56px;font-size:1.176rem;color:var(--blue);border-bottom:.5px solid var(--sep);}
.asheet button.it:last-child{border-bottom:0;}
.asheet button.it:active{background:var(--press);}
.asheet button.it.red{color:var(--red);}
.asheet button.it.cancel{font-weight:600;}

/* Toast */
.toast{position:fixed;left:16px;right:92px;bottom:calc(60px + env(safe-area-inset-bottom,0px));background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);color:var(--ink);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.18);transform:translate3d(0,20px,0);opacity:0;transition:all .25s;z-index:30;pointer-events:none;font-size:0.882rem;}
.toast.on{transform:translate3d(0,0,0);opacity:1;pointer-events:auto;}
.toast button{color:var(--blue);font-weight:600;}

/* Detail */
.detail .scroll{padding-top:4px;}
.project .scroll{padding-top:12px;}
.detail .titlein{width:100%;font-size:max(16px,1rem);font-weight:600;background:none;border:0;outline:0;padding:0;}
.detail textarea{width:100%;min-height:72px;background:none;border:0;outline:0;resize:none;padding:0;line-height:1.4;overflow:hidden;display:block;}
.vn{padding:10px 16px;border-top:.5px solid var(--sep);margin-left:0;font-size:0.882rem;line-height:1.4;}
.vn:first-child{border-top:0;}
.vn small{display:block;color:var(--ink2);font-size:0.706rem;margin-bottom:2px;}
.seg.pri-seg{margin:0;padding:3px;}
.seg.pri-seg button{height:32px;}
.seg.pri-seg button.on.high{color:var(--red);}
.seg.pri-seg button.on.mid{color:var(--orange);}
</style>
</head>
<body>
<div class="app" id="app"><nav class="tabbar" id="tabbar"></nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="asheet" id="asheet"></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastBtn">Deshacer</button></div>

<script>
'use strict';
const APP_VERSION = '0.7.1';
let pendingSW = null; // service worker installed and waiting to take over

/* ---------- Log: errors and app events, kept in localStorage for copy-and-paste debugging ---------- */
const LOGKEY = 'tareas-log';
let LOG = []; try{ LOG = JSON.parse(localStorage.getItem(LOGKEY)||'[]'); if(!Array.isArray(LOG)) LOG=[]; }catch(e){ LOG=[]; }
function log(level, msg, extra){

const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = (s, n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
function fmtDate(s){ if(!s) return ''; const t=todayStr(); if(s===t) return 'Hoy'; if(s===addDays(t,1)) return 'Mañana'; if(s===addDays(t,-1)) return 'Ayer'; const d=new Date(s+'T00:00:00'); const diff=(new Date(t+'T00:00:00')-d)/864e5; if(diff<0&&diff>-7) return DIAS[d.getDay()]; return d.getDate()+' '+MESES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDateTime(iso){ if(!iso) return ''; const d=new Date(iso); const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); return fmtDate(s)+' '+fmtTime(iso); }
const MESES_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

// Next occurrence of a weekday (0 = Sunday); strict skips today
function nextWeekday(dow, strict){ const t=todayStr(); const d=new Date(t+'T00:00:00'); let diff=(dow-d.getDay()+7)%7; if(diff===0&&strict) diff=7; return addDays(t,diff); }
// Day and optional month (1-12) to the next matching date from today
function dateFromDM(day, month){ const t=todayStr(); const y=+t.slice(0,4), m=+t.slice(5,7); const mk=(yy,mm)=>{ if(day<1||day>new Date(yy,mm,0).getDate()) return null; return yy+'-'+String(mm).padStart(2,'0')+'-'+String(day).padStart(2,'0'); };
  if(month){ if(month<1||month>12) return null; const c=mk(y,month); return (c&&c>=t)?c:mk(y+1,month); }
  const c=mk(y,m); if(c&&c>=t) return c; return m===12?mk(y+1,1):mk(y,m+1); }
// Trailing date words in a quick-add title: 'hoy', 'mañana', 'pasado mañana', a weekday, 'el 12', '12/11', '12 de noviembre'
function parseQuickDate(text){
  const t=todayStr(); const rules=[
    [/\s+pasado\s+mañana\s*$/i, ()=>addDays(t,2)],
    [/\s+mañana\s*$/i, ()=>addDays(t,1)],
    [/\s+hoy\s*$/i, ()=>t],
    [/\s+(?:el\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\s*$/i, m=>nextWeekday(WD[m[1].toLowerCase()], true)],
    [/\s+(?:el\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s*$/i, m=>dateFromDM(+m[1], MESES_FULL.indexOf(m[2].toLowerCase())+1)],
    [/\s+(?:el\s+)?(\d{1,2})\/(\d{1,2})\s*$/, m=>dateFromDM(+m[1],+m[2])],
    [/\s+el\s+(?:día\s+)?(\d{1,2})\s*$/i, m=>dateFromDM(+m[1],null)] ];
  for(const [re,fn] of rules){ const m=text.match(re); if(m){ const d=fn(m); if(d) return {title:text.slice(0,m.index).trim(), date:d, match:m[0].trim()}; } }
  return null;
}

function blank(){
  const t=new Date().toISOString();
  return { spaces:[{id:'trabajo',name:'Trabajo',order:0,created:t},{id:'personal',name:'Personal',order:1,created:t}], projects:[], tasks:[], voiceNotes:[], settings:{activeSpace:'trabajo', summaryState:'auto', filter:'hoy', doneOpen:false, theme:'auto'} };
}
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.spaces&&d.tasks) return Object.assign(blank(),d,{settings:Object.assign(blank().settings,d.settings||{})}); } }catch(e){} return blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ log('error','No se pudo guardar: '+(e&&e.message||e)); toast('No se pudo guardar en el dispositivo'); } }
DB = load();

applyTheme();

const space = () => DB.spaces.find(s=>s.id===DB.settings.activeSpace) || DB.spaces[0];
const proj = id => DB.projects.find(p=>p.id===id);
const task = id => DB.tasks.find(t=>t.id===id);
const activeProjects = () => DB.projects.filter(p=>p.spaceId===space().id && !p.archived).sort((a,b)=>a.order-b.order);
const spaceTasks = () => DB.tasks.filter(t=>t.spaceId===space().id);
const PRI = {high:0, mid:1, none:2};

function orderTasks(list){
  const t = todayStr();
  const grp = x => { if(x.date && x.date<t) return 0; if(x.date===t) return 1; if(x.priority==='high') return 2; return 3; };
  return list.slice().sort((a,b)=>{
    const ga=grp(a), gb=grp(b); if(ga!==gb) return ga-gb;
    if(ga===0||ga===1){ const pa=PRI[a.priority], pb=PRI[b.priority]; if(pa!==pb) return pa-pb; }
    if(ga===3){ if(a.date&&b.date&&a.date!==b.date) return a.date<b.date?-1:1; if(a.date&&!b.date) return -1; if(!a.date&&b.date) return 1; const pa=PRI[a.priority], pb=PRI[b.priority]; if(pa!==pb) return pa-pb; }
    return a.created<b.created?-1:1;
  });
}
function pendingFor(filter, projectId, query){
  const t=todayStr();
  let list = spaceTasks().filter(x=>x.status==='pending');
  if(projectId!==undefined) list = list.filter(x=> projectId===null ? !x.projectId : x.projectId===projectId);
  if(filter==='hoy') list = list.filter(x=>x.date && x.date<=t);
  if(query){ const q=norm(query); list = list.filter(x=> norm(x.title).includes(q) || norm(x.notes).includes(q) || (x.projectId && norm((proj(x.projectId)||{}).name).includes(q)) || DB.voiceNotes.some(v=>v.taskId===x.id && norm(v.text).includes(q))); }
  return orderTasks(list);
}
function doneList(projectId){
  const lim = Date.now()-30*864e5;
  let list = spaceTasks().filter(x=>x.status==='done' && x.completed && new Date(x.completed).getTime()>lim);
  if(projectId!==undefined) list = list.filter(x=> projectId===null ? !x.projectId : x.projectId===projectId);
  return list.sort((a,b)=>a.completed<b.completed?1:-1);
}

/* ---------- Actions ---------- */
function addTask(data){
  const t=new Date().toISOString();
  const x = Object.assign({id:uid(), title:'', spaceId:space().id, projectId:null, date:null, reminder:null, priority:'none', status:'pending', notes:'', carried:false, created:t, modified:t, completed:null}, data);
  if(x.projectId){ const p=proj(x.projectId); if(p) x.spaceId=p.spaceId; }
  DB.tasks.push(x); save(); return x;
}
function updTask(id, patch){ const x=task(id); if(!x) return; if('date' in patch && !('carried' in patch)) patch.carried=false; Object.assign(x, patch, {modified:new Date().toISOString()}); save(); }
/* Roll over: pending tasks dated before today move to today and are flagged as carried.
   Runs at start and whenever the app comes back to the foreground (the day may have changed). */
function rollOver(){ const t=todayStr(), now=new Date().toISOString(); let n=0; DB.tasks.forEach(x=>{ if(x.status==='pending'&&x.date&&x.date<t){ x.date=t; x.carried=true; x.modified=now; n++; } }); if(n) save(); return n; }
function completeTask(id, silent){
  const x=task(id); if(!x) return;
  const was = x.status;
  if(was==='pending'){ updTask(id,{status:'done', completed:new Date().toISOString()}); haptic(12); if(!silent) toast('Tarea completada', ()=>updTask(id,{status:'pending', completed:null})); }
  else { updTask(id,{status:'pending', completed:null}); haptic(8); }
}
function rescheduleTask(id, date, label){ const x=task(id); if(!x) return; const old=x.date; updTask(id,{date}); haptic(10); toast('Aplazada a '+label, ()=>updTask(id,{date:old})); }
function tomorrowTask(id){ const x=task(id); if(!x) return; const old=x.date; updTask(id,{date:addDays(todayStr(),1)}); haptic(10); toast('Aplazada a mañana', ()=>updTask(id,{date:old})); }
function deleteTask(id){
  const i=DB.tasks.findIndex(t=>t.id===id); if(i<0) return;
  const [x]=DB.tasks.splice(i,1); const vn=DB.voiceNotes.filter(v=>v.taskId===id); DB.voiceNotes=DB.voiceNotes.filter(v=>v.taskId!==id); save(); haptic(14);
  toast('Tarea eliminada', ()=>{ DB.tasks.push(x); DB.voiceNotes.push(...vn); save(); });
}
function addSpace(name){ const t=new Date().toISOString(); const sp={id:uid(), name, order:DB.spaces.length, created:t, modified:t}; DB.spaces.push(sp); save(); return sp; }
const spaceIsEmpty = id => !DB.projects.some(p=>p.spaceId===id) && !DB.tasks.some(x=>x.spaceId===id);
function deleteSpace(id){ if(DB.spaces.length<2||!spaceIsEmpty(id)) return false; DB.spaces=DB.spaces.filter(sp=>sp.id!==id); if(DB.settings.activeSpace===id) DB.settings.activeSpace=DB.spaces[0].id; save(); return true; }
function addProject(name, color){ const t=new Date().toISOString(); const p={id:uid(), spaceId:space().id, name, color, order:DB.projects.length, archived:false, created:t, modified:t}; DB.projects.push(p); save(); return p; }

/* ---------- Root render ---------- */
const app=$('#app'), tabbarEl=$('#tabbar');
const TABS=['tareas','proyectos','ajustes'];
// Root screens: one per tab, kept alive so each keeps its scroll position
function rootScreen(tab){
  let scr=app.querySelector('.screen.root[data-root="'+tab+'"]');
  if(!scr){ scr=document.createElement('div'); scr.className='screen root hidden-tab'; scr.dataset.root=tab; app.insertBefore(scr, app.firstChild); renderRoot(scr); }
  return scr;
}
function renderRoot(scr){
  const tab=scr.dataset.root;
  swapHTML(scr, tab==='tareas'?viewTareas():tab==='proyectos'?viewProyectos():viewAjustes());
}
/* FLIP: when a render follows a user action, rows that moved slide to their new place and new rows fade in */
let FLIP=false;
function renderAnimated(){ FLIP=true; try{ render(); } finally{ FLIP=false; } }
function swapHTML(scr, html){
  const sc=scr.querySelector('.scroll'); const st=sc?sc.scrollTop:0;
  const key=el=>el.dataset.id||el.dataset.openProject;
  let prev=null;
  if(FLIP&&sc){ prev=new Map(); sc.querySelectorAll('[data-id],[data-open-project]').forEach(el=>{ if(!el.closest('.first')) prev.set(key(el), el.getBoundingClientRect().top); }); }
  scr.innerHTML=html;
  const sc2=scr.querySelector('.scroll'); if(sc2){ sc2.scrollTop=st; bindScroll(scr); }
  if(prev&&sc2){
    const moved=[];
    sc2.querySelectorAll('[data-id],[data-open-project]').forEach(el=>{ if(el.closest('.first')) return; const k=key(el);
      if(!prev.has(k)){ el.classList.add('enter'); moved.push(el); return; }
      const d=prev.get(k)-el.getBoundingClientRect().top; if(Math.abs(d)>0.5){ el.style.transform='translate3d(0,'+d+'px,0)'; moved.push(el); } });
    if(moved.length){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ moved.forEach(el=>{ el.classList.add('flip'); el.style.transform=''; el.classList.remove('enter'); }); setTimeout(()=>moved.forEach(el=>el.classList.remove('flip')),350); })); }
  }
  bindCommon(scr);
}
function render(){
  const scr = rootScreen(UI.tab);
  app.querySelectorAll('.screen.root').forEach(s=>{ if(s!==scr){ s.classList.add('hidden-tab'); s.style.transform=''; } });
  scr.classList.remove('hidden-tab'); scr.style.transform='';
  renderRoot(scr);
  renderTabbar();
  if(UI.stack.length){ scr.classList.add('under'); } else { scr.classList.remove('under','dragging-under'); }
  // Pushed screens
  app.querySelectorAll('.screen.pushed-screen').forEach(s=>{ if(!UI.stack.find(x=>x.el===s)) s.remove(); });
  UI.stack.forEach((s,i)=>{ swapHTML(s.el, s.kind==='detail'?viewDetail(s.id):viewProject(s.id)); if(s.kind==='detail') bindDetail(s.el, s.id); if(i<UI.stack.length-1) s.el.classList.add('under'); else s.el.classList.remove('under'); });
}
function renderTabbar(){
  const b=(id,ic,icF,l)=>'<button data-tab="'+id+'" class="'+(UI.tab===id?'on':'')+'">'+(UI.tab===id?icF:ic)+'<span>'+l+'</span></button>';
  tabbarEl.innerHTML = b('tareas',I.list,I.listF,'Tareas')+b('proyectos',I.folder,I.folderF,'Proyectos')+b('ajustes',I.gear,I.gearF,'Ajustes');
}
function switchTab(tab){ if(UI.tab===tab){ const sc=rootScreen(tab).querySelector('.scroll'); sc&&sc.scrollTo({top:0,behavior:'smooth'}); return; } UI.tab=tab; UI.query=''; UI.sumFilter=null; render(); }
tabbarEl.addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(b) switchTab(b.dataset.tab); });

/* ---------- Swipe between tabs: the screen follows the finger, iOS style.
   Task rows keep their own horizontal gestures, so a swipe that starts on one is theirs. ---------- */
(function bindTabSwipe(){
  let x0=0,y0=0,mode=null,cur=null,nb=null,dir=0,w=0,lastX=0,lastT=0,vx=0;
  const neighbor=d=>{ const i=TABS.indexOf(UI.tab)+d; return i>=0&&i<TABS.length?TABS[i]:null; };
  app.addEventListener('touchstart',e=>{ mode=null; if(UI.stack.length||e.touches.length>1) return; const t=e.touches[0]; const root=e.target.closest('.screen.root'); if(!root||root.dataset.root!==UI.tab) return;
    const row=e.target.closest('.row'); if(row&&row.querySelector('.row-bg')) return;
    x0=lastX=t.clientX; y0=t.clientY; lastT=e.timeStamp; mode='pending'; cur=root; nb=null; w=innerWidth; vx=0; },{passive:true});
  app.addEventListener('touchmove',e=>{ if(!mode||mode==='off') return; const t=e.touches[0]; const dx=t.clientX-x0, dy=t.clientY-y0;
    if(mode==='pending'){ if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){ mode='off'; return; } if(Math.abs(dx)<10) return; dir=dx<0?1:-1; const nt=neighbor(dir); if(!nt){ mode='off'; return; }
      nb=rootScreen(nt); nb.style.transform='translate3d('+(dir*w)+'px,0,0)'; nb.classList.remove('hidden-tab'); cur.classList.add('dragging'); nb.classList.add('dragging'); mode='swipe'; if(openRow) closeRow(openRow); }
    if(mode!=='swipe') return; if(e.cancelable) e.preventDefault();
    const now=e.timeStamp; if(now>lastT){ vx=(t.clientX-lastX)/(now-lastT); lastX=t.clientX; lastT=now; }
    const d = dir===1?Math.min(0,dx):Math.max(0,dx);
    cur.style.transform='translate3d('+d+'px,0,0)'; nb.style.transform='translate3d('+(d+dir*w)+'px,0,0)';
  },{passive:false});
  const end=e=>{ if(mode!=='swipe'){ mode=null; return; } mode=null; const dx=e.changedTouches[0].clientX-x0; const d=dir===1?Math.min(0,dx):Math.max(0,dx);
    const commit = Math.abs(d)>w/3 || (Math.abs(vx)>0.4 && Math.sign(vx)===-dir && Math.abs(d)>20);
    const c=cur, n=nb; c.classList.remove('dragging'); n.classList.remove('dragging'); c.classList.add('tabanim'); n.classList.add('tabanim');
    requestAnimationFrame(()=>{ if(commit){ c.style.transform='translate3d('+(-dir*w)+'px,0,0)'; n.style.transform='translate3d(0,0,0)'; } else { c.style.transform='translate3d(0,0,0)'; n.style.transform='translate3d('+(dir*w)+'px,0,0)'; } });
    setTimeout(()=>{ c.classList.remove('tabanim'); n.classList.remove('tabanim'); if(commit){ haptic(6); UI.tab=n.dataset.root; UI.query=''; } render(); },320);
  };

})();

// Date buckets for the "Todas" list
function dateBucket(x, t){ if(!x.date) return 'none'; if(x.date<=t) return 'today'; if(x.date===addDays(t,1)) return 'tomorrow'; const d=new Date(t+'T00:00:00'); const eow=addDays(t, 6-((d.getDay()+6)%7)); if(x.date<=eow) return 'week'; return 'later'; }
const BUCKETS=[['today','Hoy'],['tomorrow','Mañana'],['week','Esta semana'],['later','Más adelante'],['none','Sin fecha']];
function listHTML(filter, projectId){
  let list = pendingFor(filter, projectId, UI.query);

  if(root && filter==='hoy' && !UI.query && UI.sumFilter) list = list.filter(x=> UI.sumFilter==='carried' ? x.carried : x.priority==='high');

  let h='';

    if(UI.query){ title='Sin resultados'; sub='Prueba con otra palabra'; acts='<button class="btn-link" data-act="clearSearch">Borrar búsqueda</button>'; }
    else if(root && filter==='hoy' && UI.sumFilter){ title=UI.sumFilter==='carried'?'Sin aplazadas':'Sin prioritarias'; sub='Hoy no hay ninguna'; acts='<button class="btn-link" data-sum="all">Quitar filtro</button>'; }

    else { title='Sin tareas pendientes'; sub='Toca + o añade una desde aquí'; acts=addBtn; }

  }
  else if(UI.query){ h += '<div class="group-title">'+list.length+(list.length===1?' resultado':' resultados')+'</div><div class="group">'+list.map(x=>rowHTML(x)).join('')+'</div>'; }
  else if(filter==='todas'){ const t=todayStr(); const by={}; list.forEach(x=>{ (by[dateBucket(x,t)]=by[dateBucket(x,t)]||[]).push(x); });
    BUCKETS.forEach(([k,label])=>{ if(by[k]) h += '<div class="group-title">'+label+'</div><div class="group">'+by[k].map(x=>rowHTML(x)).join('')+'</div>'; }); }
  else if(filter==='hoy' && root && list.some(x=>x.carried) && list.some(x=>!x.carried)){ const c=list.filter(x=>x.carried), d=list.filter(x=>!x.carried); h += '<div class="group-title">Aplazadas</div><div class="group">'+c.map(x=>rowHTML(x)).join('')+'</div><div class="group-title">Hoy</div><div class="group">'+d.map(x=>rowHTML(x)).join('')+'</div>'; }

  return h;
}

  const s=$('[data-role=search]',scr); if(s){ s.addEventListener('input',()=>{ UI.query=s.value; const scr2=s.closest('.screen'); const st=scr2.querySelector('.scroll').scrollTop; render(); const n=$('[data-role=search]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length);} }); }
  bindBackSwipe(scr);

function onClick(e){
  const scr=e.currentTarget;
  const f=e.target.closest('[data-filter]'); if(f){ DB.settings.filter=f.dataset.filter; UI.sumFilter=null; save(); render(); return; }
  const sm=e.target.closest('[data-sum]'); if(sm){ const k=sm.dataset.sum; UI.sumFilter=(k==='all'||UI.sumFilter===k)?null:k; haptic(6); render(); return; }
  const th=e.target.closest('[data-theme]'); if(th){ DB.settings.theme=th.dataset.theme; save(); applyTheme(); render(); return; }
  const op=e.target.closest('[data-open-project]'); if(op){ push('project', op.dataset.openProject); return; }
  const es=e.target.closest('[data-edit-space]'); if(es){ spaceSheet(es.dataset.editSpace); return; }
  const ua=e.target.closest('[data-unarchive]'); if(ua){ const p=proj(ua.dataset.unarchive); p.archived=false; save(); render(); return; }
  const act=e.target.closest('[data-act]'); if(!act) { const row=e.target.closest('.row'); if(row && !row.closest('.first')) { if(row.dataset.open==='1'){ closeRow(row); return; } openDetail(row.dataset.id); } return; }
  const row=act.closest('.row'); const a=act.dataset.act;
  const cur = UI.stack[UI.stack.length-1]; const detailId = cur&&cur.kind==='detail'?cur.id:null;
  switch(a){
    case 'check': { const id=row.dataset.id; act.classList.toggle('done'); act.classList.add('just'); leaveRows(id); setTimeout(()=>{ completeTask(id); renderAnimated(); },240); break; }
    case 'tomorrow': { const id=row.dataset.id; closeRow(row); leaveRows(id); setTimeout(()=>{ tomorrowTask(id); renderAnimated(); },200); break; }
    case 'delete': if(row){ closeRow(row); confirmDelete(row.dataset.id); } else if(detailId){ confirmDelete(detailId, ()=>pop()); } break;
    case 'clearSearch': UI.query=''; render(); break;
    case 'toggleSummary': DB.settings.summaryState = summaryCollapsed(pendingFor('hoy').length)?'open':'closed'; save(); render(); break;
    case 'toggleDone': DB.settings.doneOpen=!DB.settings.doneOpen; save(); render(); break;
    case 'add': addSheet(act.dataset.project||null); break;
    case 'spaceMenu': actionSheet('Espacio', DB.spaces.slice().sort((a,b)=>a.order-b.order).map(s=>({label:s.name+(s.id===space().id?'  ✓':''), fn:()=>{ DB.settings.activeSpace=s.id; save(); UI.query=''; UI.sumFilter=null; render(); }})).concat([{label:'Nuevo espacio', fn:()=>spaceSheet(null)}])); break;
    case 'back': pop(); break;
    case 'newProject': projectSheet(null); break;
    case 'newSpace': spaceSheet(null); break;
    case 'menu': detailMenu(detailId); break;
    case 'share': shareTask(detailId); break;
    case 'pickProject': pickProjectSheet(detailId); break;
    case 'pickPriority': priorityMenu(detailId); break;
    case 'postpone': closeRow(row); postponeSheet(row.dataset.id); break;
    case 'pickDate': dateSheet(detailId); break;
    case 'pickReminder': reminderSheet(detailId); break;
    case 'voice': voiceSheet(detailId); break;
    case 'export': exportJSON(); break;
    case 'import': importSheet(); break;
    case 'exportFile': exportFile(); break;
    case 'importFile': pickImportFile(); break;
    case 'demo': generateDemo(); break;
    case 'demoClear': clearDemo(); break;
    case 'log': logSheet(); break;
    case 'logCopy': copyText(logText(),'Registro copiado'); break;
    case 'update': applyUpdate(); break;
  }
}

/* ---------- Stack navigation ---------- */
function push(kind,id){
  const el=document.createElement('div'); el.className='screen pushed-screen pushed '+kind; el.dataset.kind=kind;
  app.appendChild(el); UI.stack.push({kind,id,el}); render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.classList.remove('pushed'); el.classList.add('shown'); }));
}
function openDetail(id){ push('detail', id); }
function pop(){
  const s=UI.stack.pop(); if(!s) return;
  s.el.classList.remove('shown','dragging'); s.el.classList.add('pushed');
  const under = underScreen(); under.classList.remove('under','dragging-under');

      rec.start(); recording=true; mic.classList.add('rec'); hint.textContent='Escuchando. Toca para parar'; haptic(10); }catch(e){ stop(); fallback(); } };
    stopRec=stop;
    const saveNote=()=>{ const t=ta.value.trim(); if(!t){ ta.focus(); return false; } DB.voiceNotes.push({id:uid(), taskId:id, text:t, created:new Date().toISOString()}); updTask(id,{}); haptic(8); return true; };
    s.onclick=e=>{ const b=e.target.closest('[data-x]'); if(!b) return;
      if(b.dataset.x==='mic'){ recording?stop():start(); return; }
      stop();
      if(b.dataset.x==='ok'){ if(!saveNote()) return; }
      closeSheet(); render(); };
  });
}

/* Share */
function shareText(id){ const x=task(id); if(!x) return ''; const p=x.projectId?proj(x.projectId):null; const vns=DB.voiceNotes.filter(v=>v.taskId===id).sort((a,b)=>a.created<b.created?-1:1);
  const d = x.date? new Date(x.date+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}) : 'sin fecha';
  let t='Tarea: '+x.title+'\nEspacio: '+space().name+'\nProyecto: '+(p?p.name:'ninguno')+'\nFecha: '+d+'\nPrioridad: '+(x.priority==='high'?'alta':x.priority==='mid'?'media':'ninguna')+'\n';
  if(x.notes&&x.notes.trim()) t+='\nNotas:\n'+x.notes.trim()+'\n';
  if(vns.length) t+='\nNotas de voz:\n'+vns.map(v=>'- '+fmtDateTime(v.created)+': '+v.text).join('\n')+'\n';
  return t; }
async function shareTask(id){ const t=shareText(id); if(!t) return; try{ if(navigator.share){ await navigator.share({title:task(id).title, text:t}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } copyText(t,'Texto copiado. Pégalo en Claude, WhatsApp o Mail.'); }
async function copyText(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg||'Copiado'); }catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); toast(msg||'Copiado');}catch(e2){ toast('No se pudo copiar'); } ta.remove(); } }

/* Export and import */
function exportData(){ return { app:'tareas', version:APP_VERSION, exported:new Date().toISOString(), spaces:DB.spaces, projects:DB.projects, tasks:DB.tasks, voiceNotes:DB.voiceNotes }; }
function exportJSON(){ const t=JSON.stringify(exportData(),null,2); if(navigator.share){ navigator.share({title:'Tareas (copia)', text:t}).catch(()=>copyText(t,'Copia JSON en el portapapeles')); } else copyText(t,'Copia JSON en el portapapeles'); }
async function exportFile(){
  const name='tareas-'+todayStr()+'.json'; const text=JSON.stringify(exportData(),null,2); const blob=new Blob([text],{type:'application/json'});
  try{ const file=new File([blob],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Tareas'}); log('info','Exportado a archivo (compartir)',name); return; } }
  catch(e){ if(e&&e.name==='AbortError') return; log('warn','Compartir archivo no disponible: '+(e&&e.message||e)); }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); toast('Archivo '+name+' generado'); log('info','Exportado a archivo (descarga)',name); }
  catch(e){ log('error','Exportar a archivo falló: '+(e&&e.message||e)); exportJSON(); }
}
// Merge an exported copy: unknown ids are added, known ids are replaced when the copy is newer.
function importData(text){
  const d=JSON.parse(text); if(!d||typeof d!=='object') throw new Error('Formato no reconocido');
  let added=0, updated=0;
  const merge=(arr,src)=>{ (Array.isArray(src)?src:[]).forEach(it=>{ if(!it||!it.id) return; const i=arr.findIndex(a=>a.id===it.id); if(i<0){ arr.push(it); added++; } else if((it.modified||'')>(arr[i].modified||'')){ arr[i]=it; updated++; } }); };
  merge(DB.spaces,d.spaces); merge(DB.projects,d.projects); merge(DB.tasks,d.tasks); merge(DB.voiceNotes,d.voiceNotes);
  DB.tasks.forEach(x=>{ if(x.carried===undefined) x.carried=false; });
  save(); rollOver(); log('info','Importación', {added, updated, spaces:(d.spaces||[]).length, projects:(d.projects||[]).length, tasks:(d.tasks||[]).length});
  return {added, updated};
}
function importSheet(){ openSheet('<h2>Importar pegando texto</h2><div class="hint">Pega aquí una copia exportada.</div><textarea placeholder="{ ... }"></textarea><div class="sheet-actions"><button class="btn" data-x="cancel">Cancelar</button><button class="btn primary" data-x="ok">Importar</button></div>', s=>{ const ta=$('textarea',s); ta.focus(); s.onclick=e=>{ const b=e.target.closest('[data-x]'); if(!b) return; if(b.dataset.x==='cancel'){ closeSheet(); return; } try{ const r=importData(ta.value); closeSheet(); render(); toast(r.added+' nuevos, '+r.updated+' actualizados'); }catch(err){ log('warn','Importar texto: '+err.message); toast('El texto no es un JSON válido'); } }; }); }
function pickImportFile(){
  let inp=$('#importFile'); if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.id='importFile'; inp.accept='application/json,.json,text/plain'; inp.style.cssText='position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0'; document.body.appendChild(inp); }
  inp.value=''; inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const r=importData(rd.result); render(); toast(r.added+' nuevos, '+r.updated+' actualizados'); }catch(err){ log('warn','Importar archivo '+f.name+': '+err.message); toast('El archivo no es una copia válida'); } }; rd.onerror=()=>{ log('error','No se pudo leer '+f.name); toast('No se pudo leer el archivo'); }; rd.readAsText(f); };
  inp.click();
}

/* Test data: about 150 tasks in invented projects, all ids prefixed "demo-" so they can be removed cleanly */
const demoCount = () => DB.tasks.filter(x=>String(x.id).startsWith('demo-')).length;
function generateDemo(){
  let seed=20261031; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }; const pick=a=>a[Math.floor(rnd()*a.length)];
  const batch=Date.now().toString(36); const sp=space().id; const now=new Date(); const t=todayStr();
  const projNames=[['Cliente FLC',0],['Verifactu',4],['Cash Application',3],['Propuesta Iberdrola',5],['Formación del equipo',6],['Administración',7]];
  const projects=projNames.map((pn,i)=>({id:'demo-p-'+batch+'-'+i, spaceId:sp, name:pn[0], color:COLORS[pn[1]], order:DB.projects.length+i, archived:false, created:now.toISOString(), modified:now.toISOString()}));
  const verbs=['Preparar','Revisar','Enviar','Cerrar','Actualizar','Llamar a','Validar','Redactar','Planificar','Documentar','Confirmar','Analizar'];
  const objs=['comité de seguimiento','SOW con legal','acta del steering','plan de cutover','RAID log','Marta por el presupuesto','mapping de Verifactu','propuesta de fase 2','sesión de formación','backlog de defectos','escenarios de prueba UAT','calendario de go-live','informe de horas','presentación a dirección','integración con BTP','matriz de riesgos','contrato marco','facturas pendientes','ampliación del equipo','notas del taller'];
  const noteTexts=['Pendiente de la respuesta del cliente.','Revisar con el equipo antes del jueves.','Incluye los cambios acordados en la última reunión.','Ver correo de ayer con el detalle.',''];
  const tasks=[], vnotes=[];
  for(let i=0;i<150;i++){
    const r=rnd(); let date=null; if(r<0.2) date=addDays(t,-1-Math.floor(rnd()*10)); else if(r<0.5) date=t; else if(r<0.8) date=addDays(t,1+Math.floor(rnd()*30));
    const pr=rnd(); const priority=pr<0.15?'high':pr<0.4?'mid':'none';
    const done=rnd()<0.2; const created=new Date(now.getTime()-Math.floor(rnd()*40)*864e5).toISOString();
    const completed=done?new Date(now.getTime()-Math.floor(rnd()*25)*864e5).toISOString():null;
    const projectId=rnd()<0.85?pick(projects).id:null;
    let reminder=null; if(!done&&rnd()<0.1){ const d=new Date(now.getTime()+Math.floor(rnd()*72)*36e5); d.setMinutes(0,0,0); reminder=d.toISOString(); }
    const id='demo-t-'+batch+'-'+i;
    tasks.push({id, title:pick(verbs)+' '+pick(objs), spaceId:sp, projectId, date, reminder, priority, status:done?'done':'pending', notes:pick(noteTexts), carried:false, created, modified:created, completed});
    if(rnd()<0.06) vnotes.push({id:'demo-v-'+batch+'-'+i, taskId:id, text:'Nota dictada de prueba: '+pick(noteTexts.filter(Boolean)), created});
  }
  DB.projects.push(...projects); DB.tasks.push(...tasks); DB.voiceNotes.push(...vnotes); save(); const n=rollOver(); render(); haptic(8);
  log('info','Datos de prueba generados', {projects:projects.length, tasks:tasks.length, voiceNotes:vnotes.length, rolledOver:n});
  toast(tasks.length+' tareas de prueba en '+projects.length+' proyectos');
}
function clearDemo(){
  const n=demoCount(); if(!n){ toast('No hay datos de prueba'); return; }
  confirmSheet('Eliminar '+n+' tareas de prueba', 'Se eliminan solo los elementos marcados como prueba. Tus datos no se tocan.', ()=>{
    const isDemo=x=>String(x.id).startsWith('demo-');
    DB.tasks=DB.tasks.filter(x=>!isDemo(x)); DB.projects=DB.projects.filter(x=>!isDemo(x)); DB.voiceNotes=DB.voiceNotes.filter(x=>!isDemo(x)); save(); render(); haptic(10);
    log('info','Datos de prueba eliminados', {tasks:n}); toast('Datos de prueba eliminados');
  });
}

/* Log sheet */

  openSheet('<h2>Registro</h2><div class="hint">'+LOG.length+' entradas. Cópialo y pégalo en el chat.</div><textarea readonly style="min-height:260px;font-size:12px;line-height:1.35;font-family:ui-monospace,Menlo,monospace">'+esc(logText())+'</textarea><div class="sheet-actions"><button class="btn" data-x="clear">Borrar</button><button class="btn primary" data-x="copy">Copiar</button></div>'+(navigator.share?'<div class="sheet-actions" style="margin-top:10px"><button class="btn" data-x="share">Compartir</button></div>':''), s=>{

{ const n=rollOver(); if(n) log('info','Tareas pasadas a hoy: '+n); } render();

/* ---------- Service worker: offline cache and update notice ---------- */
function applyUpdate(){ if(!pendingSW) return; toast('Actualizando'); log('info','Actualización aplicada por el usuario'); pendingSW.postMessage({type:'SKIP_WAITING'}); }
if('serviceWorker' in navigator){
  let reloading=false;
  // Offer the update until it is applied: on install, on every return to the app and from Settings.
  const offerUpdate = sw => { if(pendingSW!==sw) log('info','Nueva versión descargada, pendiente de aplicar'); pendingSW=sw; toast('Nueva versión disponible', applyUpdate, 'Actualizar'); if(UI.tab==='ajustes'&&!UI.stack.length) render(); };
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) offerUpdate(nw); }); });
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return; reg.update().catch(()=>{}).then(()=>{ if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting); }); });
  }).catch(e=>log('error','Service worker no registrado: '+(e&&e.message||e)));
  // Reload only on an update: the first install also fires controllerchange (clients.claim) and must not flash the page
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloading||!hadController) return; reloading=true; location.reload(); });
}
