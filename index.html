<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tareas">
<meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F9F9F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Tareas</title>
<style>
:root{
  color-scheme:light;
  --bg:#F2F2F7; --card:#FFFFFF; --sep:#C6C6C8; --ink:#000000; --ink2:#8E8E93; --ink3:#AEAEB2;
  --blue:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759; --fill:#E5E5EA; --fill2:#D1D1D6;
  --bar:rgba(249,249,249,.82); --mat:rgba(255,255,255,.88); --dim:rgba(0,0,0,.35); --press:#D9D9DE;
  --kb:0px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --sep:#38383A; --ink:#FFFFFF; --ink2:#8E8E93; --ink3:#636366;
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --fill:#2C2C2E; --fill2:#3A3A3C;
  --bar:rgba(22,22,24,.82); --mat:rgba(36,36,38,.9); --dim:rgba(0,0,0,.55); --press:#2C2C2E;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --sep:#38383A; --ink:#FFFFFF; --ink2:#8E8E93; --ink3:#636366;
  --blue:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --fill:#2C2C2E; --fill2:#3A3A3C;
  --bar:rgba(22,22,24,.82); --mat:rgba(36,36,38,.9); --dim:rgba(0,0,0,.55); --press:#2C2C2E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:17px;}
html{font:-apple-system-body;} /* iOS: follow the system text size; other browsers ignore it */
html,body{margin:0;overscroll-behavior:none;}
body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:1rem;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;}
input,textarea,select{font-size:max(16px,1rem);} /* under 16px Safari zooms on focus */

/* Desktop (wide screens): sidebar, main column, detail pane. Mobile code paths stay untouched. */
.desk{display:none;}
.app.desktop .screen,.app.desktop .tabbar,.app.desktop .selbar{display:none !important;}
.app.desktop{overflow:hidden;}
.app.desktop .desk{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;background:var(--bg);} /* one row, capped at the window height, so each column scrolls on its own */
.app.desktop.has-pane .desk{grid-template-columns:240px minmax(0,1fr) 400px;}
.side{background:var(--card);border-right:.5px solid var(--sep);display:flex;flex-direction:column;padding:14px 10px calc(10px + env(safe-area-inset-bottom,0px));overflow-y:auto;}
.side .sp{display:flex;align-items:center;gap:6px;font-size:1.176rem;font-weight:700;padding:6px 10px 14px;letter-spacing:-.3px;width:100%;text-align:left;}
.side .sp svg{width:12px;height:12px;color:var(--ink3);}
.side .sec{font-size:0.706rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;padding:14px 10px 6px;}
.side .it{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:8px;font-size:0.941rem;text-align:left;color:var(--ink);}
.side .it:hover{background:var(--fill);}
.side .it.on{background:var(--blue);color:#fff;}
.side .it svg{width:18px;height:18px;flex:none;}
.side .it>span:not(.n):not(.dot){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side .it .dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px;}
.side .it .n{margin-left:auto;font-size:0.765rem;color:var(--ink2);}
.side .it.on .n{color:rgba(255,255,255,.85);}
.side .grow{flex:1;}
.side .it.add{color:var(--blue);}
.main{display:flex;flex-direction:column;min-width:0;height:100%;}
.main .mhead{display:flex;align-items:center;gap:14px;padding:16px 28px 8px;}
.main .mhead h1{margin:0;font-size:1.647rem;font-weight:700;letter-spacing:-.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.main .mhead .searchbar{margin:0;width:260px;}
.main .mbody{flex:1;overflow-y:auto;padding:0 28px 40px;}
.main .mbody .scroll{padding:0;overflow:visible;flex:none;}
.main .inner{max-width:760px;}
.main .inner.week-inner{max-width:none;}
.addbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:0 14px;height:46px;margin:6px 0 14px;border:.5px solid var(--sep);}
.addbar svg{width:18px;height:18px;color:var(--blue);flex:none;}
.addbar input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:max(16px,1rem);color:var(--ink);}
.addbar input::placeholder{color:var(--ink2);}
.addbar .kbd{font-size:0.706rem;color:var(--ink3);border:.5px solid var(--sep);border-radius:5px;padding:1px 6px;}
.pane{background:var(--card);border-left:.5px solid var(--sep);height:100%;overflow:hidden;display:flex;flex-direction:column;}
.app.desktop .pane .screen{position:relative;display:flex !important;transform:none;background:var(--card);height:100%;will-change:auto;}
.pane .nav{background:var(--card);}
.pane .nav .back span{display:none;}
.pane .group{background:var(--bg);}
.pane .scroll{padding-bottom:40px;}
.desktop .row-content:hover{background:var(--press);cursor:default;}
.desktop .rowmore{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink2);opacity:0;transition:opacity .15s;}
.desktop .row:hover .rowmore{opacity:1;}
.desktop .rowmore svg{width:18px;height:18px;}
.desktop .fab{display:none;}
.desktop .check,.desktop .cell,.desktop .chip,.desktop button{cursor:pointer;}
.desktop .row-title{-webkit-line-clamp:1;}
/* Closed sheets sit invisible at the centre: hidden and without hit area, so they never take clicks */
body.desktop .sheet{left:50%;right:auto;bottom:auto;top:50%;width:440px;max-height:80%;border-radius:16px;transform:translate(-50%,-50%) scale(.96);opacity:0;visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .22s,visibility 0s linear .28s;padding:10px 20px 20px;}
body.desktop .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s;}
body.desktop .sheet .handle{display:none;}
body.desktop .asheet{left:50%;right:auto;bottom:auto;top:50%;width:320px;transform:translate(-50%,-50%) scale(.96);opacity:0;visibility:hidden;pointer-events:none;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .22s,visibility 0s linear .28s;}
body.desktop .asheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s;}
body.desktop .asheet button.it{height:46px;font-size:1rem;}
body.desktop .app.sheet-open{transform:none;border-radius:0;}
body.desktop .toast{left:auto;right:28px;bottom:28px;width:360px;}
/* Week view */
.week{display:flex;flex-direction:column;height:100%;min-height:0;}
.week .whead{display:flex;align-items:center;gap:8px;padding:0 0 12px;}
.week .whead h2{margin:0 8px 0 0;font-size:1.06rem;font-weight:600;}
.week .whead button.nav-b{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--blue);background:var(--card);border:.5px solid var(--sep);}
.week .whead button.nav-b svg{width:9px;height:14px;}
.week .whead button.today-b{height:32px;padding:0 12px;border-radius:8px;background:var(--card);border:.5px solid var(--sep);color:var(--blue);font-weight:600;font-size:0.882rem;}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start;}
.wday{background:var(--card);border-radius:12px;min-height:220px;padding:8px;border:1.5px solid transparent;transition:border-color .15s,background .15s;}
.wday.today{border-color:var(--blue);}
.wday.over{background:var(--fill);border-color:var(--blue);}
.wday.past{opacity:.75;}
.wday .dh{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 8px;}
.wday .dh b{font-size:0.882rem;font-weight:600;}
.wday .dh b small{font-weight:400;color:var(--ink2);margin-left:4px;}
.wday.today .dh b{color:var(--blue);}
.wday .dh button{width:24px;height:24px;border-radius:6px;color:var(--ink2);display:flex;align-items:center;justify-content:center;}
.wday .dh button:hover{background:var(--fill);color:var(--blue);}
.wday .dh button svg{width:14px;height:14px;}
.wcard{display:flex;align-items:flex-start;gap:7px;padding:7px 8px;border-radius:8px;background:var(--bg);margin-bottom:6px;cursor:grab;border-left:3px solid var(--pc,var(--ink3));}
.wcard:hover{background:var(--fill);}
.wcard.dragging{opacity:.4;}
.wcard .check{width:18px;height:18px;margin-top:1px;}
.wcard .check svg{width:10px;height:10px;}
.wcard .t{flex:1;min-width:0;font-size:0.824rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
.wcard .t .pri{display:inline;margin-right:4px;letter-spacing:-1px;}
.wcard .t .m{display:block;color:var(--ink2);font-size:0.706rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wcard .pri{font-size:0.765rem;min-width:0;}
.wcard.done .t{text-decoration:line-through;color:var(--ink2);}
.wundated{margin-top:14px;background:var(--card);border-radius:12px;padding:10px 12px;border:1.5px solid transparent;}
.wundated.over{background:var(--fill);border-color:var(--blue);}
.wundated h3{margin:0 0 8px;font-size:0.824rem;color:var(--ink2);font-weight:600;}
.wundated h3:last-child{margin-bottom:0;}
.wundated .cards{display:flex;flex-wrap:wrap;gap:8px;}
.wundated .wcard{margin:0;width:220px;}

/* Screens */
.app{height:100%;position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),border-radius .5s cubic-bezier(.32,.72,0,1);} /* iOS timing: screens and sheets take half a second */
.app.sheet-open{transform:scale(.96);border-radius:14px;}
@media (prefers-reduced-motion: reduce){.app{transition:none;}.app.sheet-open{transform:none;}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transform:translate3d(0,0,0);will-change:transform;}
.screen.pushed{transform:translate3d(100%,0,0);transition:transform .5s cubic-bezier(.32,.72,0,1);}
.screen.shown{transform:translate3d(0,0,0);transition:transform .5s cubic-bezier(.32,.72,0,1);}
.screen.under{transform:translate3d(-33%,0,0);transition:transform .5s cubic-bezier(.32,.72,0,1);}
.screen.dragging,.screen.dragging-under{transition:none;}
.screen.hidden-tab{display:none;}
.screen.root{touch-action:pan-y;}
.screen.pushed-screen{z-index:8;}
.screen.pushed-screen.pushed{pointer-events:none;} /* a screen sliding in or out (already popped) takes no taps */
.app.navigating .screen{pointer-events:none;} /* during a push or pop transition a second tap acts on nothing */
.screen.tabanim{transition:transform .4s cubic-bezier(.32,.72,0,1);}
/* Reduce Motion: a pushed screen fades in and out where it stands; the screen below stays still */
@media (prefers-reduced-motion: reduce){.screen.pushed{transform:none;opacity:0;transition:opacity .2s;}.screen.shown{transform:none;opacity:1;transition:opacity .2s;}.screen.under{transform:none;transition:none;}.screen.tabanim{transition:none;}}

.nav{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));} /* side safe areas: landscape on a notched iPhone */
.nav-row{height:44px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.nav-title{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:1rem;pointer-events:none;}
.nav.compact{box-shadow:0 .5px 0 var(--sep);}
.nav .title{display:flex;align-items:center;gap:6px;font-size:1.294rem;font-weight:700;letter-spacing:-.3px;height:44px;}
.nav .title svg{width:12px;height:12px;color:var(--ink3);}
.nav .title .pdot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:2px;}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:1rem;height:44px;}
.nav .back svg{width:12px;height:20px;}
.nav .action{color:var(--blue);font-size:1rem;height:44px;display:flex;align-items:center;}
.nav .action.strong{font-weight:600;}
.nav .actions{display:flex;gap:4px;margin-right:-8px;}
.nav .actions .action{width:40px;justify-content:center;}
.nav .actions svg{width:22px;height:22px;}
.cell.input{display:block;}
.cell .val.high{color:var(--red);}
.cell .val.mid{color:var(--orange);}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));}

/* Day summary */
.summary{background:var(--card);border-radius:12px;padding:12px 16px 12px;margin:8px 0 12px;}
.summary-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.summary-head h3{margin:0;font-size:0.882rem;font-weight:600;color:var(--ink2);}
.summary-head button{color:var(--ink3);width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
.summary-head svg{width:14px;height:14px;transition:transform .25s;}
.summary.collapsed .summary-head svg{transform:rotate(-90deg);}
.summary.collapsed .summary-body{display:none;}
.summary.collapsed{padding-bottom:12px;}
.summary.collapsed .summary-head{margin-bottom:0;}
.nums{display:flex;gap:8px;}
.first{margin-top:10px;}
.num{flex:1;border-radius:10px;padding:6px 4px;text-align:center;}
.num b{display:block;font-size:1.647rem;font-weight:700;line-height:1.1;letter-spacing:-.6px;}
.num span{font-size:0.706rem;color:var(--ink2);}
.num.red b{color:var(--red);}
.num.on{background:var(--fill);}
.num:active{opacity:.7;}
.num.orange b{color:var(--orange);}
.first h4{margin:6px 0 2px;font-size:0.765rem;color:var(--ink2);font-weight:500;}
.first .row{margin:0;}
.first .row-content{padding-left:0;}
.first .empty-line{color:var(--ink3);font-size:0.882rem;padding:8px 0 10px;}
.first .soon{display:flex;align-items:center;gap:8px;font-size:0.824rem;color:var(--ink2);padding:8px 0 6px;border-top:.5px solid var(--sep);}
.first .soon svg{width:15px;height:15px;color:var(--orange);}

/* Search and segment */
.searchbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px;}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--ink2);}
.search svg{width:16px;height:16px;flex:none;}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;height:36px;color:var(--ink);}
.search input::placeholder{color:var(--ink2);}
.searchbar .cancel{color:var(--blue);font-size:1rem;flex:none;}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px;}
.seg button{flex:1;height:28px;border-radius:7px;font-size:0.765rem;font-weight:500;color:var(--ink);}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;}
.seg button .n{font-weight:400;color:var(--ink2);margin-left:5px;font-size:.765rem;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#636366;}}
:root[data-theme="dark"] .seg button.on{background:#636366;}

/* Lists */
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.group-title{font-size:0.765rem;color:var(--ink2);padding:0 4px 6px;margin-top:4px;}
.row{position:relative;overflow:hidden;background:var(--card);}
.row.cv{content-visibility:auto;contain-intrinsic-size:auto 62px;} /* far below the visible part when drawn: see lazyRows */
.rph{height:62px;} /* a row of a long list not drawn yet: see lazyRows */
.row + .row .row-content::before{content:"";position:absolute;left:50px;right:0;top:0;height:.5px;background:var(--sep);}
.first .row + .row .row-content::before{left:34px;}
.row-bg{position:absolute;inset:0;display:none;align-items:stretch;}
.row.swiping.dir-r .row-bg.left{display:flex;}
.row.swiping.dir-l .row-bg.right{display:flex;}
.row-bg.left{justify-content:flex-start;background:var(--green);}
.row-bg.right{justify-content:flex-end;background:var(--red);}
.row-bg.left span{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;color:#fff;transform:translate3d(10px,0,0) scale(.6);will-change:transform;}
.row-bg.left svg{width:24px;height:24px;}
.row.armed .row-bg.left{background:#2DBE54;}
.row.armed .row-bg.left svg{animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row.armed .row-bg.left{background:#28C250;}}
:root[data-theme="dark"] .row.armed .row-bg.left{background:#28C250;}
.row-bg.right button{width:80px;color:#fff;font-size:0.882rem;font-weight:500;}
.row-bg.right .b-tomorrow{background:var(--orange);}
.row-bg.right .b-delete{background:var(--red);}
.row-content{position:relative;background:var(--card);display:flex;align-items:center;gap:12px;padding:10px 16px 10px 16px;min-height:52px;transition:transform .4s cubic-bezier(.32,.72,0,1);}
.row-content.drag{transition:none;}
.row.leaving .row-content{opacity:0;transform:translate3d(28px,0,0);transition:opacity .22s,transform .22s;}
.row.leaving{pointer-events:none;} /* a second tap during the exit must not reopen the task or open its detail */
.flip{transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .4s;}
.enter{opacity:0;}
.row-content:active{background:var(--press);}
.first .row-content{padding:8px 0;min-height:44px;}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink3);display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,transform .15s;}
.check:active{transform:scale(.88);}
.check.done{background:var(--pc,var(--blue));border-color:var(--pc,var(--blue));}
.check.done.just{animation:pop .32s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.check svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .28s cubic-bezier(.34,1.56,.64,1);}
.check.done svg{opacity:1;transform:scale(1);}
.row-text{flex:1;min-width:0;}
.row-title{font-size:1rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.row.done .row-title{color:var(--ink2);text-decoration:line-through;}
.row-meta{display:block;font-size:0.765rem;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-meta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px;position:relative;top:-1px;}
.row-meta .sep{color:var(--ink3);margin:0 6px;}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:0.706rem;font-weight:500;color:var(--pc);background:var(--tagbg);vertical-align:1px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@supports (color: color-mix(in srgb, red, blue)){ .tag{background:color-mix(in srgb, var(--pc) 15%, transparent);} :root[data-theme="dark"] .tag{background:color-mix(in srgb, var(--pc) 24%, transparent);} @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{background:color-mix(in srgb, var(--pc) 24%, transparent);} } }
.row-meta .over{color:var(--red);}
.row-meta .bell{display:inline-flex;align-items:center;gap:3px;}
.row-meta .bell svg{width:11px;height:11px;vertical-align:-1px;}
.row-meta .ind{display:inline-block;margin-right:4px;color:var(--ink3);}
.row-meta .ind svg{width:12px;height:12px;vertical-align:-2px;}
.pri{flex:none;font-weight:700;font-size:1rem;min-width:14px;text-align:center;letter-spacing:-1px;}

<div class="app" id="app"><nav class="tabbar" id="tabbar"></nav><nav class="selbar" id="selbar"></nav></div>

<script>
'use strict';
const APP_VERSION = '0.14.5';
let pendingSW = null; // service worker installed and waiting to take over
let updateRequested = false; // the user asked for the waiting worker to take over

/* ---------- Log: errors and app events, kept in localStorage for copy-and-paste debugging ---------- */
const LOGKEY = 'tareas-log';
let LOG = []; try{ LOG = JSON.parse(localStorage.getItem(LOGKEY)||'[]'); if(!Array.isArray(LOG)) LOG=[]; }catch(e){ LOG=[]; }
function log(level, msg, extra){
  const e = { t:new Date().toISOString(), l:level, m:String(msg) };

}

function logText(){
  const d = (typeof DB!=='undefined'&&DB) ? ' | espacios '+DB.spaces.length+', proyectos '+DB.projects.length+', tareas '+DB.tasks.length+', notas de voz '+DB.voiceNotes.length : '';

  const lines = LOG.map(e=>{ const t=e.t.replace('T',' ').slice(5,19); return t+' ['+e.l+'] '+e.m+(e.x?' | '+e.x:''); });

/* ---------- Utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_FULL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function fmtDate(s){ if(!s) return ''; const t=todayStr(); if(s===t) return 'Hoy'; if(s===addDays(t,1)) return 'Mañana'; if(s===addDays(t,-1)) return 'Ayer'; const d=new Date(s+'T00:00:00'); const diff=Math.round((new Date(t+'T00:00:00')-d)/864e5); if(diff<0&&diff>-7) return DIAS_FULL[d.getDay()]; return d.getDate()+' '+MESES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function localDay(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const MESES_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD = {domingo:0,lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6};
// Next occurrence of a weekday (0 = Sunday); strict skips today
function nextWeekday(dow, strict){ const t=todayStr(); const d=new Date(t+'T00:00:00'); let diff=(dow-d.getDay()+7)%7; if(diff===0&&strict) diff=7; return addDays(t,diff); }
// Quick options without repeats: one whose date (or instant) is already offered is left out, so on a Thursday 'Viernes' is not a second 'Mañana'
const uniqueBy = (list, key) => { const seen=new Set(); return list.filter(o=>{ const k=key(o); if(seen.has(k)) return false; seen.add(k); return true; }); };
// 'Fin de semana' in Aplazar: the next weekend day, so on a Saturday it is Sunday (the same as 'Mañana') and never a week ahead
function weekendDay(){ const t=todayStr(); return new Date(t+'T00:00:00').getDay()===6 ? addDays(t,1) : nextWeekday(6,true); }
// Day and optional month (1-12) to the next matching date from today
function dateFromDM(day, month){ const t=todayStr(); const y=+t.slice(0,4), m=+t.slice(5,7); const mk=(yy,mm)=>{ if(day<1||day>new Date(yy,mm,0).getDate()) return null; return yy+'-'+String(mm).padStart(2,'0')+'-'+String(day).padStart(2,'0'); };
  if(month){ if(month<1||month>12) return null; const c=mk(y,month); return (c&&c>=t)?c:mk(y+1,month); }
  for(let k=0;k<3;k++){ const mm=(m-1+k)%12+1, yy=y+Math.floor((m-1+k)/12); const c=mk(yy,mm); if(c&&c>=t) return c; } return null; } // a month without that day is skipped: 'el 30' on 31 January is 30 March
// Trailing date words in a quick-add title: 'hoy', 'mañana', 'pasado mañana', a weekday, 'el 12', '12/11', '12 de noviembre'
function parseQuickDate(text){
  const t=todayStr(); const rules=[
    [/\s+pasado\s+mañana\s*$/i, ()=>addDays(t,2)],
    [/\s+mañana\s*$/i, ()=>addDays(t,1)],
    [/\s+hoy\s*$/i, ()=>t],
    [/\s+(?:el\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\s*$/i, m=>nextWeekday(WD[m[1].toLowerCase()], true)],
    [/\s+(?:el\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s*$/i, m=>dateFromDM(+m[1], MESES_FULL.indexOf(m[2].toLowerCase())+1)],
    [/\s+(?:el\s+)?(\d{1,2})\/(\d{1,2})\s*$/, m=>dateFromDM(+m[1],+m[2])],
    [/\s+el\s+(?:día\s+)?(\d{1,2})\s*$/i, m=>dateFromDM(+m[1],null)] ];
  for(const [re,fn] of rules){ const m=text.match(re); if(m){ const d=fn(m); if(d) return {title:text.slice(0,m.index).trim(), date:d, match:m[0].trim()}; } }
  return null;
}
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const tint = (hex,a) => { const n=parseInt(String(hex).slice(1),16); return isNaN(n)?'transparent':'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'; };
const URL_RE=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi, TEL_RE=/(\+?\d[\d .-]{7,}\d)/g;
// Links and phone numbers found in free text, in one pass over the raw text so a phone never matches inside a URL
const LINK_RE=new RegExp(URL_RE.source+'|'+TEL_RE.source,'gi'), DATE_LIKE=/(^|\D)(\d{4}-(0?[1-9]|1[0-2])-\d{1,2}|\d{1,2}[-.](0?[1-9]|1[0-2])[-.]\d{2,4})(\D|$)/;
function scanLinks(text){ const t=String(text||''), out=[];
  for(const m of t.matchAll(LINK_RE)){ let s=m[0]; const at=m.index;
    if(m[1]){ // a URL leaves out trailing punctuation, and a closing bracket it never opened
      for(;;){ const c=s.slice(-1); if('.,;:!?\'"'.includes(c) || (c===')'&&s.split('(').length<s.split(')').length) || (c===']'&&s.split('[').length<s.split(']').length)) s=s.slice(0,-1); else break; }
      if(/^(?:https?:\/\/|www\.)./i.test(s)) out.push({kind:'url', start:at, end:at+s.length, text:s, href:/^https?:/i.test(s)?s:'https://'+s}); }
    else { // only real phone shapes: Spanish 9 digits or international; not dates, invoice numbers or IBANs
      const d=s.replace(/[^\d+]/g,''), prev=t.charAt(at-1);
      if(!/[A-Za-zÀ-ɏ\d]/.test(prev) && !DATE_LIKE.test(s) && (/^(?:\+|00)\d{9,15}$/.test(d)||/^[6789]\d{8}$/.test(d))) out.push({kind:'tel', start:at, end:at+s.length, text:s, href:'tel:'+d}); } }
  return out; }
function extractLinks(text){ const ls=scanLinks(text), seen=new Set(); // links first, then phones, each target once
  return ls.filter(l=>l.kind==='url').concat(ls.filter(l=>l.kind==='tel')).filter(l=>!seen.has(l.href)&&seen.add(l.href)).map(l=>({label:l.kind==='url'?l.text.replace(/^https?:\/\//i,'').replace(/^www\./i,'').split(/[\/?#]/)[0]:l.text.trim(), href:l.href})); }
function linkify(text){ const t=String(text||''); let o='', last=0;
  scanLinks(t).forEach(l=>{ o+=esc(t.slice(last,l.start))+'<a href="'+esc(l.href)+'"'+(l.kind==='url'?' target="_blank" rel="noopener"':'')+'>'+esc(l.text)+'</a>'; last=l.end; });
  return o+esc(t.slice(last)); }
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// iOS Safari has no vibrate(); toggling a native switch inside a user gesture gives a haptic tick on iOS 17.4 and later

/* ---------- Data ---------- */
const KEY = 'tareas-v1';
let DB = null;
function blank(){
  const t=new Date().toISOString();
  return { spaces:[{id:'trabajo',name:'Trabajo',order:0,created:t},{id:'personal',name:'Personal',order:1,created:t}], projects:[], tasks:[], voiceNotes:[], settings:{activeSpace:'trabajo', summaryState:'auto', filter:'hoy', doneOpen:false, theme:'auto', tipsSeen:false, shakeUndo:false, allGroup:'date'} };
}
let lastRaw = null; // the stored text this window last read or wrote; another window may have changed it since
function load(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){ log('error','No se pudieron leer los datos: '+(e&&e.message||e)); }
  lastRaw=raw; if(!raw) return blank();
  let d=null; try{ d=JSON.parse(raw); }catch(e){}
  const b=blank(), lists=['spaces','projects','tasks','voiceNotes'];
  if(!d || typeof d!=='object' || Array.isArray(d) || !lists.some(k=>Array.isArray(d[k]))){
    // Unreadable data: keep the raw text aside before the first save replaces it
    try{ localStorage.setItem(KEY+'-corrupt', raw); }catch(e){}
    log('error','Datos guardados no reconocidos: se empieza en blanco y se conserva el texto en '+KEY+'-corrupt', raw.slice(0,120));
    return b;
  }
  if(!Array.isArray(d.spaces) || !d.spaces.length){ d.spaces=b.spaces; log('warn','Datos guardados sin espacios: se crean Trabajo y Personal'); }
  lists.forEach(k=>{ if(!Array.isArray(d[k])) d[k]=b[k]; });
  const s=(d.settings&&typeof d.settings==='object')?d.settings:{};
  // Before v0.7 the summary kept a boolean summaryCollapsed; carry it over to summaryState
  if(s.summaryState===undefined && 'summaryCollapsed' in s) s.summaryState=s.summaryCollapsed?'closed':'auto';
  delete s.summaryCollapsed;
  return Object.assign(b, d, {settings:Object.assign(b.settings, s)});
}
let saveFailed = false; // the last save did not reach localStorage
let saveErrorNow = false; // set until the current task ends, so the action's own toast reports the failure
// A bulk action changes many tasks with updTask: inside batch() their saves become one write at the end
let saveHold=0, saveDirty=false;
let dataVer=0; // bumped on every save: a screen drawn at an older version shows stale data (see swapHTML, pop)
let staleView=false; // data reloaded from another window while something was being typed or picked: not yet drawn (reloadFromStorage)
function batch(fn){ saveHold++; try{ return fn(); } finally{ if(--saveHold===0 && saveDirty){ saveDirty=false; save(); } } }
// Typing in a detail's title or notes is saved a moment after the last key, not on every key: each save writes all the data.
// editPatch keeps what is waiting, so a reload from another window can put it back. Any save() writes it too.
let editSaveT=null, editPatch=null;
function saveEdit(x, patch){ Object.assign(x, patch, {modified:new Date().toISOString()}); dataVer++;
  editPatch={id:x.id, patch:Object.assign(editPatch&&editPatch.id===x.id?editPatch.patch:{}, patch, {modified:x.modified})};
  clearTimeout(editSaveT); editSaveT=setTimeout(save, 400); }
function flushEdits(){ if(editSaveT) save(); }
function save(){
  if(saveHold){ saveDirty=true; return true; }
  dataVer++; clearTimeout(editSaveT); editSaveT=null; editPatch=null; // this write carries any typing still waiting for its save
  const raw=JSON.stringify(DB);
  try{ localStorage.setItem(KEY, raw); }
  catch(e){
    // Storage full: free the space the log takes and try once more
    try{ LOG=LOG.slice(-50); localStorage.setItem(LOGKEY, JSON.stringify(LOG)); }catch(err){ try{ localStorage.removeItem(LOGKEY); }catch(err2){} }
    try{ localStorage.setItem(KEY, raw); }
    catch(e2){ if(!saveFailed) log('error','No se pudo guardar: '+(e2&&e2.message||e2)); saveFailed=true; saveErrorNow=true; Promise.resolve().then(()=>{ saveErrorNow=false; }); toast('No se pudo guardar en el dispositivo'); return false; }
  }
  lastRaw=raw;
  if(saveFailed){ saveFailed=false; log('info','Se vuelve a guardar con normalidad'); }
  return true;
}

function applyTheme(){ const t=DB.settings.theme||'auto'; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  // Browser and status bar tint: a chosen theme overrides both metas; in auto each one keeps its media query
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{ m.content = t==='dark'?'#161618':t==='light'?'#F9F9F9':(m.media?'#161618':'#F9F9F9'); }); }

const space = () => DB.spaces.find(s=>s.id===DB.settings.activeSpace) || DB.spaces[0];
const proj = id => DB.projects.find(p=>p.id===id);
const task = id => DB.tasks.find(t=>t.id===id);
const activeProjects = () => DB.projects.filter(p=>p.spaceId===space().id && !p.archived).sort((a,b)=>a.order-b.order);
const spaceTasks = () => DB.tasks.filter(t=>t.spaceId===space().id);
const PRI = {high:0, mid:1, none:2};

function orderTasks(list){
  const t = todayStr();
  const grp = x => { if(x.date && x.date<t) return 0; if(x.date===t) return 1; if(x.priority==='high') return 2; return 3; };
  return list.slice().sort((a,b)=>{
    const ga=grp(a), gb=grp(b); if(ga!==gb) return ga-gb;
    if(ga===0||ga===1){ const pa=PRI[a.priority], pb=PRI[b.priority]; if(pa!==pb) return pa-pb; }
    if(ga===3){ if(a.date&&b.date&&a.date!==b.date) return a.date<b.date?-1:1; if(a.date&&!b.date) return -1; if(!a.date&&b.date) return 1; const pa=PRI[a.priority], pb=PRI[b.priority]; if(pa!==pb) return pa-pb; }
    return a.created<b.created?-1:1;
  });
}
// The query is normalised once and the voice notes searched once per list, not once per task
function queryMatcher(query){ const q=norm(query); const vn=new Set(DB.voiceNotes.filter(v=>norm(v.text).includes(q)).map(v=>v.taskId));
  return x => norm(x.title).includes(q) || norm(x.notes).includes(q) || (x.projectId && norm((proj(x.projectId)||{}).name).includes(q)) || vn.has(x.id); }
function matchesQuery(x, query){ return queryMatcher(query)(x); }
function pendingFor(filter, projectId, query){
  const t=todayStr();
  let list = spaceTasks().filter(x=>x.status==='pending');
  if(projectId!==undefined) list = list.filter(x=> projectId===null ? !x.projectId : x.projectId===projectId);
  if(filter==='hoy') list = list.filter(x=>x.date && x.date<=t);
  if(query) list = list.filter(queryMatcher(query));
  return orderTasks(list);
}
function doneList(projectId){
  const lim = Date.now()-30*864e5;
  let list = spaceTasks().filter(x=>x.status==='done' && x.completed && new Date(x.completed).getTime()>lim);
  if(projectId!==undefined) list = list.filter(x=> projectId===null ? !x.projectId : x.projectId===projectId);
  return list.sort((a,b)=>a.completed<b.completed?1:-1);
}

/* ---------- Toast with undo ---------- */
let toastTimer=null, undoFn=null;
function toast(text, undo, label){
  if(saveErrorNow && !label) text='No se pudo guardar en el dispositivo'; // an action whose save failed must not claim success
  const el=$('#toast'); $('#toastText').textContent=text; undoFn=undo||null; const b=$('#toastBtn'); b.textContent=label||'Deshacer'; b.style.display=undo?'':'none';
  el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.classList.remove('on'); undoFn=null;}, label?12000:4000);
}
$('#toastBtn').addEventListener('click',()=>{ if(undoFn){ undoFn(); undoFn=null; } $('#toast').classList.remove('on'); clearTimeout(toastTimer); renderAnimated(); });

/* ---------- Actions ---------- */
function addTask(data){
  const t=new Date().toISOString();
  const x = Object.assign({id:uid(), title:'', spaceId:space().id, projectId:null, date:null, reminder:null, priority:'none', status:'pending', notes:'', carried:false, created:t, modified:t, completed:null}, data);
  if(x.projectId){ const p=proj(x.projectId); if(p) x.spaceId=p.spaceId; }
  DB.tasks.push(x); save(); return x;
}
function updTask(id, patch){ const x=task(id); if(!x) return; if('date' in patch && !('carried' in patch)) patch.carried=false; Object.assign(x, patch, {modified:new Date().toISOString()}); save(); }
/* Roll over: pending tasks dated before today move to today and are flagged as carried.
   Runs at start and whenever the app comes back to the foreground (the day may have changed). */
// It leaves 'modified' alone: every device repeats it, so it must not beat a real edit in an import ('newer wins').
function rollOver(){ const t=todayStr(); let n=0; if(DB.settings.summaryDay!==t){ DB.settings.summaryDay=t; UI.summaryFirst=true; save(); } DB.tasks.forEach(x=>{ if(x.status==='pending'&&x.date&&x.date<t){ x.date=t; x.carried=true; n++; } }); if(n) save(); return n; }
function completeTask(id, silent){
  const x=task(id); if(!x) return;
  const was = x.status;
  if(was==='pending'){ updTask(id,{status:'done', completed:new Date().toISOString()}); haptic(12); if(!silent) toast('Tarea completada', ()=>updTask(id,{status:'pending', completed:null})); }
  else { const t=todayStr(); updTask(id, x.date&&x.date<t ? {status:'pending', completed:null, date:t, carried:true} : {status:'pending', completed:null}); haptic(8); } // a reopened task never comes back overdue (decision 8.5)
}
function rescheduleTask(id, date, label){ const x=task(id); if(!x) return; const old=x.date, oldC=x.carried; updTask(id,{date}); haptic(10); toast('Aplazada a '+label, ()=>updTask(id,{date:old, carried:oldC})); } // undo gives back the Aplazadas mark too
function tomorrowTask(id){ const x=task(id); if(!x) return; const old=x.date, oldC=x.carried; updTask(id,{date:addDays(todayStr(),1)}); haptic(10); toast('Aplazada a mañana', ()=>updTask(id,{date:old, carried:oldC})); }
function deleteTask(id){
  const i=DB.tasks.findIndex(t=>t.id===id); if(i<0) return;
  const [x]=DB.tasks.splice(i,1); const vn=DB.voiceNotes.filter(v=>v.taskId===id); DB.voiceNotes=DB.voiceNotes.filter(v=>v.taskId!==id); save(); haptic(14);
  toast('Tarea eliminada', ()=>{ DB.tasks.push(x); DB.voiceNotes.push(...vn); save(); });
}
function addSpace(name){ const t=new Date().toISOString(); const sp={id:uid(), name, order:DB.spaces.length, created:t, modified:t}; DB.spaces.push(sp); save(); return sp; }
const spaceIsEmpty = id => !DB.projects.some(p=>p.spaceId===id) && !DB.tasks.some(x=>x.spaceId===id);
function deleteSpace(id){ if(DB.spaces.length<2||!spaceIsEmpty(id)) return false; DB.spaces=DB.spaces.filter(sp=>sp.id!==id); if(DB.settings.activeSpace===id){ DB.settings.activeSpace=DB.spaces[0].id; resetListState(); } save(); return true; }
function addProject(name, color){ const t=new Date().toISOString(); const p={id:uid(), spaceId:space().id, name, color, order:DB.projects.length, archived:false, created:t, modified:t}; DB.projects.push(p); save(); return p; }

const app=$('#app'), tabbarEl=$('#tabbar');
const TABS=['tareas','proyectos','ajustes'];
// Root screens: one per tab, kept alive so each keeps its scroll position
function rootScreen(tab){
  let scr=app.querySelector('.screen.root[data-root="'+tab+'"]');
  if(!scr){ scr=document.createElement('div'); scr.className='screen root hidden-tab'; scr.dataset.root=tab; app.insertBefore(scr, app.firstChild); renderRoot(scr); }
  return scr;
}
function renderRoot(scr){
  const tab=scr.dataset.root;

function listHTML(filter, projectId){
  let list = pendingFor(filter, projectId, UI.query);
  const root = projectId===undefined;
  if(root && filter==='hoy' && !UI.query && UI.sumFilter) list = list.filter(x=> UI.sumFilter==='carried' ? x.carried : x.priority==='high');
  if(root && !UI.query && UI.projFilter!==null) list = list.filter(x=> UI.projFilter==='none' ? !x.projectId : x.projectId===UI.projFilter);
  const done = doneList(projectId); const dm = UI.query ? done.filter(queryMatcher(UI.query)) : [];
  const addBtn = '<button class="btn-link" data-act="add"'+(projectId!==undefined?' data-project="'+(projectId||'')+'"':'')+'>Añadir tarea</button>';
  let h='';
  if(!list.length){ if(!(UI.query && UI.searchDone && dm.length)){ // the completed matches are listed below: no "Sin resultados" above them
    let title, sub, acts;
    if(UI.query){ title='Sin resultados'; sub='Prueba con otra palabra'; acts='<button class="btn-link" data-act="clearSearch">Borrar búsqueda</button>'; }
    else if(root && filter==='hoy' && UI.sumFilter){ title=UI.sumFilter==='carried'?'Sin aplazadas':'Sin prioritarias'; sub='Hoy no hay ninguna'; acts='<button class="btn-link" data-sum="all">Quitar filtro</button>'; }
    else if(root && UI.projFilter!==null){ const pf=UI.projFilter==='none'?null:proj(UI.projFilter); title='Nada '+(pf?'de '+esc(pf.name):'sin proyecto'); sub=filter==='hoy'?'Hoy no hay ninguna':'No hay pendientes'; acts='<button class="btn-link" data-pf="">Quitar filtro</button>'; }
    else if(filter==='hoy'){ title='Nada para hoy'; sub='Nada pendiente con fecha de hoy'; acts='<button class="btn-link" data-filter="todas">Ver todas</button>'+addBtn; }
    else { title='Sin tareas pendientes'; sub='Toca + o añade una desde aquí'; acts=addBtn; }
    h += '<div class="empty">'+I.inbox+'<b>'+title+'</b>'+sub+'<div class="acts">'+acts+'</div></div>';
  } }
  else if(UI.query){ h += '<div class="group-title">'+list.length+(list.length===1?' resultado':' resultados')+'</div><div class="group">'+list.map(x=>rowHTML(x)).join('')+'</div>'; }
  if(UI.query){ if(dm.length){ h += UI.searchDone ? '<div class="group-title">Completadas</div><div class="group">'+dm.map(x=>rowHTML(x)).join('')+'</div>' : '<div class="empty" style="padding:8px 0 16px"><div class="acts"><button class="btn-link" data-act="searchDone">Incluir '+dm.length+(dm.length===1?' completada':' completadas')+'</button></div></div>'; } return h; }
  else if(filter==='todas' && root && DB.settings.allGroup==='project'){ const ps=activeProjects(); const by={}; list.forEach(x=>{ const k=!x.projectId||!proj(x.projectId)?'none':ps.some(p=>p.id===x.projectId)?x.projectId:'archived'; (by[k]=by[k]||[]).push(x); });
    ps.forEach(p=>{ if(by[p.id]) h += '<div class="group-title"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+p.color+';margin-right:6px;vertical-align:1px"></span>'+esc(p.name)+' <span style="color:var(--ink3)">'+by[p.id].length+'</span></div><div class="group">'+by[p.id].map(x=>rowHTML(x)).join('')+'</div>'; });
    if(by.archived) h += '<div class="group-title">Proyectos archivados <span style="color:var(--ink3)">'+by.archived.length+'</span></div><div class="group">'+by.archived.map(x=>rowHTML(x)).join('')+'</div>';
    if(by.none) h += '<div class="group-title">Sin proyecto <span style="color:var(--ink3)">'+by.none.length+'</span></div><div class="group">'+by.none.map(x=>rowHTML(x)).join('')+'</div>'; }
  else if(filter==='todas'){ const t=todayStr(); const by={}; list.forEach(x=>{ (by[dateBucket(x,t)]=by[dateBucket(x,t)]||[]).push(x); });
    BUCKETS.forEach(([k,label])=>{ if(by[k]) h += '<div class="group-title" style="display:flex;justify-content:space-between;align-items:center"><span>'+label+'</span>'+(k==='none'&&root&&!UI.select?'<button class="btn-link" data-act="plan" style="font-size:0.765rem;font-weight:600">Planificar ('+by[k].length+')</button>':'')+'</div><div class="group">'+by[k].map(x=>rowHTML(x)).join('')+'</div>'; }); }
  else if(filter==='hoy' && root && list.some(x=>x.carried) && list.some(x=>!x.carried)){ const c=list.filter(x=>x.carried), d=list.filter(x=>!x.carried); h += '<div class="group-title">Aplazadas</div><div class="group">'+c.map(x=>rowHTML(x)).join('')+'</div><div class="group-title">Hoy</div><div class="group">'+d.map(x=>rowHTML(x)).join('')+'</div>'; }
  else h += '<div class="group">'+list.map(x=>rowHTML(x)).join('')+'</div>';
  if(root && filter==='hoy' && !UI.query && !UI.sumFilter){ const tm=pendingFor('todas').filter(x=>x.date===addDays(todayStr(),1)).length; if(tm) h += '<button class="preview" data-filter="todas"><span>Mañana: '+tm+(tm===1?' tarea':' tareas')+'</span>'+I.chev+'</button>'; }
  if(done.length){ const dt=done.filter(x=>x.completed&&localDay(x.completed)===todayStr()).length;
    if(!DB.settings.doneOpen){ h += '<div class="group"><button class="cell link" data-act="toggleDone" style="justify-content:center"><span>Mostrar completadas ('+done.length+(dt?', '+dt+' hoy':'')+')</span></button></div>'; }
    else { const t=todayStr(), yd=addDays(t,-1); const by={}, order=[]; done.forEach(x=>{ const d=x.completed?localDay(x.completed):'0000'; if(!by[d]){ by[d]=[]; order.push(d); } by[d].push(x); });
      h += '<div class="group"><button class="cell link" data-act="toggleDone" style="justify-content:center"><span>Ocultar completadas</span></button></div>';
      order.forEach(d=>{ const label=d===t?'Hoy':d===yd?'Ayer':d==='0000'?'Sin fecha':fmtDate(d); h += '<div class="group-title">'+label+'</div><div class="group">'+by[d].map(x=>rowHTML(x)).join('')+'</div>'; }); } }
  return h;
}

const detailLinks = notes => extractLinks(notes).slice(0,6);
// A voice note row: swipe right to edit, left to delete (on the desktop, a click offers both)
const vnHTML = v => '<div class="vn" data-vn="'+v.id+'"><div class="vn-bg l"><button data-vact="edit">Editar</button></div><div class="vn-bg r"><button data-vact="del">Eliminar</button></div><div class="vn-c"><small>'+fmtDateTime(v.created)+(v.modified?', editada':'')+'</small>'+linkify(v.text)+'</div></div>';
function linksHTML(links){ return links.map(l=>'<a href="'+esc(l.href)+'"'+(l.href.startsWith('tel:')?'':' target="_blank" rel="noopener"')+'>'+esc(l.label)+'</a>').join(''); }
function bindDetail(el, id){
  const x=task(id); if(!x) return;
  const ti=$('[data-role=title]',el), no=$('[data-role=notes]',el), sc=el.querySelector('.scroll');
  // Growing a text area collapses it for a moment: the screen keeps its scroll instead of jumping to the top
  const fit=(ta,h)=>{ const y=sc?sc.scrollTop:0; ta.style.height='auto'; ta.style.height=h()+'px'; if(sc) sc.scrollTop=y; };
  const growT=()=>fit(ti,()=>ti.scrollHeight); growT();
  // The lists behind show the new title as it is typed; no render here, which would rebuild this screen under the finger
  const showTitle=()=>{ document.querySelectorAll('.row[data-id="'+id+'"] .row-title').forEach(e=>e.textContent=x.title||'Sin título');
    document.querySelectorAll('.wcard[data-id="'+id+'"] .t').forEach(e=>{ const n=[...e.childNodes].find(c=>c.nodeType===3); if(n) n.nodeValue=x.title; }); };
  // The title is required: an empty field never reaches the data, and on leaving it the last title comes back
  ti.addEventListener('input',()=>{ const v=ti.value.replace(/\n/g,' '); if(v.trim()){ saveEdit(x,{title:v}); showTitle(); } growT(); });
  ti.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ti.blur(); } });
  ti.addEventListener('blur',()=>{ const v=ti.value.replace(/\n/g,' ').trim(); if(v&&v!==x.title){ x.title=v; x.modified=new Date().toISOString(); save(); showTitle(); } else flushEdits(); if(ti.value!==x.title){ ti.value=x.title; growT(); } });
  const grow=()=>fit(no,()=>Math.max(100, no.scrollHeight+2)); grow();
  // The link and phone chips under the notes follow what is typed, a moment after the last key; only the strip changes
  let lt=null; const refreshLinks=()=>{ const ls=detailLinks(x.notes); let box=$('.links',el); const cur=box?[...box.querySelectorAll('a')].map(a=>a.getAttribute('href')).join(' '):'';
    if(cur===ls.map(l=>l.href).join(' ')) return;
    if(!ls.length){ box.remove(); return; }
    if(!box){ if(!no.isConnected) return; box=document.createElement('div'); box.className='links'; no.closest('.cell').after(box); }
    box.innerHTML=linksHTML(ls); };
  no.addEventListener('input',()=>{ saveEdit(x,{notes:no.value}); grow(); clearTimeout(lt); lt=setTimeout(refreshLinks, 400); });
  no.addEventListener('blur', flushEdits);
}

/* Search. The list follows the typing a moment after the last key, and the search field itself is never rebuilt:
   only what is around it changes (summary, filters, Cancelar and the list), so the keyboard stays open on the iPhone
   and the caret, an accent typed with a dead key or IME text being composed are never cut off. */
let searchT=null;
function bindSearch(s, around){
  let composing=false; s.dataset.shown=UI.query; // the query the screen around the field was drawn with
  const go=()=>{ searchT=null; if(composing||!s.isConnected||s.closest('.hidden-tab')) return; if(UI.query===s.dataset.shown) return;
    if(!UI.query) UI.searchDone=false;
    if(around()){ s.dataset.shown=UI.query; return; }
    render(); }; // not expected: the screen has no search field where it should be

  // A scrolled inner box (a long textarea, the log) keeps the finger until it is back at its top; only then does the sheet follow it down
  const scroller=t=>{ for(let el=t; el&&el!==h; el=el.parentElement){ if(el.scrollHeight>el.clientHeight+1){ const o=getComputedStyle(el).overflowY; if(el.tagName==='TEXTAREA'||o==='auto'||o==='scroll') return el; } } return null; };
  const reset=()=>{ h.classList.remove('drag'); h.style.transform=''; };
  h.ontouchstart=e=>{ const onHandle=!!e.target.closest('.handle'); drag=false; dy=0; inner=null; if(h.scrollTop>0&&!onHandle) return; if(!onHandle) inner=scroller(e.target); y0=e.touches[0].clientY; drag=!(inner&&inner.scrollTop>0); };
  h.ontouchmove=e=>{ const y=e.touches[0].clientY;
    if(inner&&inner.scrollTop>0){ if(drag){ drag=false; dy=0; reset(); } return; } // the inner box is scrolling
    if(!drag){ if(!inner) return; drag=true; y0=y; dy=0; } // the inner box reached its top: from here the sheet follows
    dy=Math.max(0,y-y0); if(dy>0){ h.classList.add('drag'); h.style.transform='translate3d(0,calc('+dy+'px - var(--kb)),0)'; } }; // keeps the keyboard offset of .sheet.on
  h.ontouchend=()=>{ inner=null; if(!drag) return; drag=false; h.classList.remove('drag'); if(dy>110) closeSheet(); else h.style.transform=''; };
  h.ontouchcancel=()=>{ inner=null; if(!drag) return; drag=false; reset(); }; }

function addSheet(projectId){
  const st={title:'', date:null, projectId:projectId||null, priority:'none', auto:null, manual:false, added:0};
  // Quick date chips, each a different date: on a Thursday 'Viernes' is tomorrow and on a Sunday 'Próx. semana' is, so they are left out
  const quick=()=>{ const t=todayStr(); return uniqueBy([['hoy',t,'Hoy'],['man',addDays(t,1),'Mañana'],['vie',nextWeekday(5,true),'Viernes'],['nsem',nextWeekday(1,true),'Próx. semana']], q=>q[1]); };
  const draw=()=>{
    const p=st.projectId?proj(st.projectId):null; const q=quick(); const custom=st.date&&!q.some(c=>c[1]===st.date);
    $('#chips',sheet).innerHTML=
      q.map(c=>'<button class="chip'+(st.date===c[1]?' on':'')+'" data-c="'+c[0]+'">'+I.cal+c[2]+'</button>').join('')+
      '<button class="chip'+(custom?' on':'')+'" data-c="fecha">'+I.cal+(custom?fmtDate(st.date):'Fecha')+'</button>'+
      '<button class="chip'+(p?' on':'')+'" data-c="proj">'+(p?'<span class="dot" style="background:'+p.color+'"></span>'+esc(p.name):I.folder.replace('<svg','<svg style="width:14px;height:14px"')+'Proyecto')+'</button>'+
      '<button class="chip'+(st.priority!=='none'?' on':'')+'" data-c="pri">'+I.flag+(st.priority==='high'?'Alta':st.priority==='mid'?'Media':'Prioridad')+'</button>';
  };
  const prefill = arguments[1]||''; const preset = arguments[2]||{}; if(preset.date){ st.date=preset.date; st.manual=true; }
  openSheet(sheadHTML('Nueva tarea','Cancelar','Añadir')+'<input class="titlein" placeholder="Qué hay que hacer" autocomplete="off" enterkeyhint="done"><div class="chips" id="chips"></div><div class="hint" id="addHint" style="text-align:left;margin:6px 2px 0">Escribe "mañana", "viernes" o "el 12" al final y se toma como fecha. Enter añade y sigue; Añadir termina.</div><input type="date" id="hiddenDate" min="'+todayStr()+'" style="position:absolute;opacity:0;width:1px;height:1px;left:-10px"><div class="sheet-actions"><button class="btn" data-x="open" style="height:40px;font-weight:500">Añadir y abrir</button></div>', s=>{
    const inp=$('.titlein',s), hint=$('#addHint',s); inp.focus(); draw();
    if(prefill){ inp.value=prefill; setTimeout(()=>inp.dispatchEvent(new Event('input')),0); }
    // Date words typed at the end of the title set the date chip until the user picks one by hand
    inp.addEventListener('input',()=>{ const r=parseQuickDate(inp.value); if(r){ if(!st.manual){ st.date=r.date; st.auto=r.match; draw(); } } else if(st.auto){ st.auto=null; if(!st.manual) st.date=null; draw(); } });
    let lastId=null;
    const add=()=>{ let t=inp.value.trim(); if(!t) return false; const r=st.auto?parseQuickDate(t):null; if(r&&r.title) t=r.title; lastId=addTask({title:t,date:st.date,projectId:st.projectId,priority:st.priority}).id; st.added++; haptic(8); return t; };
    // The list behind the sheet is drawn once, when the sheet closes (any way it closes), not after every Enter
    sheetOnClose=()=>{ if(st.added) render(); };
    const finish=()=>{ closeSheet(); if(st.added) toast(st.added===1?'Tarea añadida':st.added+' tareas añadidas'); };
    const ok=()=>{ if(!add()){ inp.focus(); return; } finish(); };
    const okAndNext=()=>{ const t=add(); if(!t){ finish(); return; } inp.value=''; st.auto=null; if(!st.manual) st.date=null; draw(); hint.textContent=st.added+(st.added===1?' añadida: ':' añadidas. Última: ')+t; inp.focus(); };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); okAndNext(); } });
    s.onclick=e=>{ const b=e.target.closest('[data-x]'); if(b){ if(b.dataset.x==='open'){ if(!add()){ inp.focus(); return; } finish(); openDetail(lastId); } else b.dataset.x==='ok'?ok():finish(); return; }

      else if(k==='fecha'){ const d=$('#hiddenDate',s); d.value=st.date||todayStr(); d.onchange=()=>{ if(d.value&&d.value<todayStr()) return; st.date=d.value||null; draw(); }; try{ d.showPicker?d.showPicker():d.click(); }catch(e){ d.click(); } return; }
      else if(k==='proj'){ const ps=activeProjects(); if(!ps.length){ toast('Crea un proyecto en la pestaña Proyectos'); return; } actionSheet('Proyecto', [{label:'Ninguno', fn:()=>{st.projectId=null; reopen();}}].concat(ps.map(p=>({label:p.name, fn:()=>{st.projectId=p.id; reopen();}}))), ()=>inp.focus()); return; }
      else if(k==='pri'){ actionSheet('Prioridad',[{label:'Alta',fn:()=>{st.priority='high';reopen();}},{label:'Media',fn:()=>{st.priority='mid';reopen();}},{label:'Ninguna',fn:()=>{st.priority='none';reopen();}}], ()=>inp.focus()); return; }
      draw();
    };
    const reopen=()=>{ st.title=inp.value; sheet.classList.add('on'); scrim.classList.add('on'); dimApp(true); draw(); inp.focus(); }; // focus inside the tap: iOS brings the keyboard back
  });
}
